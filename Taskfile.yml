  rs:audit:
    desc: "Supply-chain audit for the rust workspace. Asserts toolchain pin matches ADR-0019; runs cargo audit + cargo deny over the helper's transitive closure. Closes 2026-05-13 adversarial cycle row 17.1 / 17.4."
    dir: rs
    cmds:
      # 17.4 — toolchain pin matches the documented version. The grep
      # asserts the exact channel string; a PR that deletes or bumps
      # rust-toolchain.toml without coordinated ADR + Taskfile edit
      # fails this gate.
      - 'grep -q ''channel = "1.95.0"'' rust-toolchain.toml || (echo "rs/rust-toolchain.toml: channel != 1.95.0 — see ADR-0019 §Implementation pins"; exit 1)'
