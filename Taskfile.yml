    desc: "Test the leyline-sign crate with host + host-extras (cloister-2a0faa). Exercises the op:// + apple-password:// scheme handlers + nono URI validators that are opt-in for production deploys. Pulls in nono = 0.54 + the sigstore-verify / aws-lc-rs / landlock closure flagged in threat-model §17.1 — that's the cost of running this target."
