version: "3"

tasks:
  build:
    desc: Bundle Worker for Cloudflare / wrangler dev
    deps: [manifest]
    cmds:
      - pnpm exec wrangler build
    sources:
      - src/**/*.ts
      - tsconfig.json
    generates:
      - .wrangler/tmp/build-*/index.js

  manifest:
    desc: Compile cloister.capnp → src/generated/manifest.ts (ADR-0004)
    cmds:
      - node scripts/build-manifest.mjs
    sources:
      - cloister.capnp
      - manifest/cloister.capnp
      - scripts/build-manifest.mjs
    generates:
      - src/generated/manifest.ts

  wire:fixtures:
    desc: Regenerate substrate-equivalence fixtures from wire/cross-check-fixtures.capnp (ADR-0005, cloister-5183bc 2D-codec.D)
    cmds:
      - node scripts/gen-wire-fixtures.mjs
    sources:
      - wire/cloister.capnp
      - wire/cross-check-fixtures.capnp
      - scripts/gen-wire-fixtures.mjs
    generates:
      - test/wire/fixtures/canonical.ts

  wire:verify-roundtrip:
    desc: Phase 2D-codec.E direction-2 substrate equivalence (our encode → capnp decode → capnp encode → our decode)
    cmds:
      - pnpm exec tsc --project tsconfig.verify.json
      - node scripts/verify-wire-roundtrip.mjs
    sources:
      - src/wire/**/*.ts
      - wire/cloister.capnp
      - scripts/verify-wire-roundtrip.mjs
      - tsconfig.verify.json

  companion:stub:
    desc: Run a local stub of cloister-companion (ADR-0005). HTTP listener on :8385 that decodes capnp ToolCall and returns canned ToolResult — lets `task dev` exercise leylineNet backends without a real Rust companion.
    cmds:
      - pnpm exec tsc --project tsconfig.verify.json
      - 'echo "[task] stub-companion starting on :8385 (PORT=N to override, STUB_COMPANION_VERBOSE=1 for per-request logs)"'
      - node scripts/stub-companion.mjs
    sources:
      - src/wire/**/*.ts
      - scripts/stub-companion.mjs
      - tsconfig.verify.json

  smoke:leyline-stub:
    desc: End-to-end wire smoke — production codec → real HTTP → stub-companion → real HTTP → production codec. Spawns + tears down the stub on an ephemeral port (default :18385).
    cmds:
      - pnpm exec tsc --project tsconfig.verify.json
      - node scripts/smoke-leyline-stub.mjs
    sources:
      - src/wire/**/*.ts
      - scripts/stub-companion.mjs
      - scripts/smoke-leyline-stub.mjs
      - tsconfig.verify.json

  build:local:
    desc: Bundle Worker for local workerd (embeds into dist/)
    deps: [manifest]
    cmds:
      - pnpm exec wrangler build --outdir dist
    sources:
      - src/**/*.ts
    generates:
      - dist/index.js

  test:
    desc: Run tests inside workerd (real DOs, real SQLite)
    deps: [manifest]
    cmds:
      - pnpm exec vitest run

  test:watch:
    desc: Watch mode
    deps: [manifest]
    cmds:
      - pnpm exec vitest

  test:plugin:
    desc: Run the CC plugin's hook tests via node's built-in test runner
    cmds:
      - node --test hooks/test/*.test.mjs

  type-check:
    desc: TypeScript type check (no emit)
    deps: [manifest]
    cmds:
      - pnpm exec tsc --noEmit

  dev:
    desc: Start local dev server on :8787
    deps: [manifest]
    cmds:
      - pnpm exec wrangler dev

  serve:local:
    desc: Run via workerd directly (requires build:local first)
    cmds:
      - npx workerd serve config.capnp --experimental

  lint:
    desc: Fast gate — tsc + worker tests + plugin tests. Runs ≤2s. Use this in inner-loop dev.
    deps: [type-check, test, test:plugin]

  verify:
    desc: Strict gate — `lint` + every external-process equivalence harness. Slower (spawns capnp CLI + Node servers); use in CI / pre-push.
    deps: [lint, wire:verify-roundtrip, smoke:leyline-stub]

  smoke:
    desc: End-to-end smoke — spins up leyline + cloister, exercises the full chain
    cmds:
      - bash scripts/e2e-smoke.sh

  # ── OCI packaging (melange + apko) ───────────────────────────────────────
  #
  # `task apk:keygen` once, then `task image` whenever you want to rebuild.
  # Output: cloister.tar — an OCI image you can `docker load` or push.

  apk:keygen:
    desc: Generate the melange signing key (one-time setup)
    cmds:
      - melange keygen melange.rsa
    status:
      - test -f melange.rsa
      - test -f melange.rsa.pub

  apk:
    desc: Build cloister APK via melange (release-style, signed)
    deps: [apk:keygen]
    cmds:
      - mkdir -p ./packages
      - |
        melange build melange.yaml \
          --signing-key melange.rsa \
          --arch "$(uname -m | sed 's/aarch64/aarch64/;s/x86_64/x86_64/')" \
          --out-dir ./packages

  image:
    desc: Compose the cloister OCI image via apko (depends on `task apk`)
    deps: [apk]
    vars:
      TAG: '{{.TAG | default "latest"}}'
    cmds:
      - "apko build apko.yaml cloister:{{.TAG}} cloister.tar --keyring-append melange.rsa.pub"
      - 'echo "Built cloister.tar — load with: docker load < cloister.tar"'

  image:check:
    desc: Validate melange.yaml + apko.yaml syntax without running a real build
    deps: [apk:keygen]
    cmds:
      # melange has no `lint` for YAML — `compile` parses the recipe end-to-end
      # and emits the resolved build script (--arch is required).
      - melange compile melange.yaml --arch "$(uname -m)" >/dev/null
      # apko equivalent: show-config resolves all packages + paths.
      - apko show-config apko.yaml >/dev/null
