    desc: "Validate ADR-0019 §Implementation pins on rs/crates/sign/Cargo.toml (cloister-9bfbf6) — fails if ed25519-dalek drifts from tilde-pin (`~2.1`) to caret/bare/wildcard. cargo-deny can't catch this (it sees resolved versions, not version-spec strings)."
