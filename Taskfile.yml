    desc: "Build cloister-cas (LLO leyline-cas-ffi bridge) for wasm32 (cloister-713b4e). Requires `rustup target add wasm32-unknown-unknown` once. LLO is fetched as a git dep pinned in crates/cas/Cargo.toml; cargo handles the checkout."
