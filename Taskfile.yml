      # if needed; CI installs once and caches. Local dev installs on
      # first run (~30s). Failing on warnings ensures a new advisory
      # against any nono transitive does not land silently.
      - cargo audit --deny warnings
      # `cargo deny check` enforces the bans / advisories / licenses /
      # sources policy declared in deny.toml (next to Cargo.toml). The
