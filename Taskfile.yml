      - src/routes/vault-do-credential-store.ts
      - src/routes/vault-proxy.ts
      - src/routes/vault-proxy-credential-store.ts
      - scripts/lint-vault-id-source.mjs

  lint:bundle-isolation:
    desc: "Validate ADR-0013 substrate invariants on src/generated/cluster.ts + config.capnp (cloister-ac30e7 + cloister-cf519b) — globalOutbound scope, credential bindings, bundle tiers, orphan bindings. Reads cluster.ts via tsx (the canonical derived artifact per ADR-0025)."
    cmds:
