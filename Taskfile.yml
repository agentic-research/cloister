  dev:bootstrap:
    desc: "One-time dev setup — generates DEV_VAULT_KEK + writes .env.local (gitignored). Required after ADR-0014 v2 (cloister-125199). Idempotent. (Git hooks — incl. the post-merge bead auto-close — are owned by rsry: `rsry hooks install`, not cloister's Taskfile.)"
    cmds:
      - node scripts/dev-bootstrap.mjs

  dev:
    desc: Start local dev server on :8787 (sources .env.local for VAULT_KEK_SOURCE)
    deps: [manifest]
    cmds:
      # Source .env.local so VAULT_KEK_SOURCE + DEV_VAULT_KEK flow into
      # wrangler's env. ADR-0014 v2 (cloister-125199) requires non-empty
      # VAULT_KEK_SOURCE; the vault DO throws otherwise. Run
      # `task dev:bootstrap` once to generate .env.local.
      - |
        if [ ! -f .env.local ]; then
          echo "✗ .env.local missing — run \`task dev:bootstrap\` first" >&2
          exit 1
        fi
        set -a
        . ./.env.local
        set +a
        pnpm exec wrangler dev

  serve:local:
    desc: Run via workerd directly (requires build:local first)
    cmds:
      - npx workerd serve dist/config.capnp --experimental

  do:harden:
    desc: "ADR-0039 Phase 0 — lock down the local Durable Object storage dir (chmod 700 + files 0600 + Time Machine exclusion). Zero-code at-rest hardening vs the same-UID / backup-exfil threat (threat-model §13.9). Honors CLOISTER_DO_PATH (default /data/do). Same-UID reads still possible until at-rest encryption lands (ADR-0039 Phase 1)."
    cmds:
      - |
        set -eu
        DIR="${CLOISTER_DO_PATH:-/data/do}"
        mkdir -p "$DIR"
        chmod 700 "$DIR"
        find "$DIR" -type f -exec chmod 600 {} + 2>/dev/null || true
        echo "do:harden: $DIR is now 0700 (files 0600) — ADR-0039 Phase 0."
        echo "  same-UID reads still possible until at-rest encryption (ADR-0039 Phase 1)."
        if command -v tmutil >/dev/null 2>&1; then
          if tmutil addexclusion "$DIR" 2>/dev/null; then
            echo "  added Time Machine exclusion for $DIR."
          else
            echo "  run 'sudo tmutil addexclusion $DIR' to exclude it from Time Machine."
          fi
        fi

  dev:securevol:
    desc: "ADR-0039 Phase 1 (macOS) — create/mount an ENCRYPTED APFS volume for local DO storage: passphrase held in Keychain, mounted at CLOISTER_DO_PATH. Idempotent (creates once, mounts thereafter), then composes do:harden. Linux: fscrypt/LUKS on the DO dir + a secret-tool passphrase (see docs/adr/0039). NOTE: writes to your Keychain + creates a disk image — review before first run."
    env:
      # Computed once so the mount path + the composed do:harden agree.
      CLOISTER_DO_PATH:
        sh: echo "${CLOISTER_DO_PATH:-$HOME/.local/share/cloister/do}"
    cmds:
      - |
        set -eu
        if [ "$(uname)" != "Darwin" ]; then
          echo "dev:securevol is macOS-only (APFS). On Linux: fscrypt/LUKS on \$CLOISTER_DO_PATH + a secret-tool passphrase — see docs/adr/0039-local-do-sqlite-security.md." >&2
          exit 1
        fi
        IMG="${CLOISTER_SECUREVOL:-$HOME/.local/share/cloister/cloister-do.sparsebundle}"
        MOUNT="$CLOISTER_DO_PATH"
        KC="cloister-do-volume"
        mkdir -p "$(dirname "$IMG")"
        # 1. Volume passphrase in Keychain (generate once, 256-bit).
        if ! security find-generic-password -s "$KC" -a "$USER" >/dev/null 2>&1; then
          security add-generic-password -s "$KC" -a "$USER" -w "$(openssl rand -base64 32)" -U
          echo "dev:securevol: generated volume passphrase → Keychain (service=$KC)."
        fi
        PASS="$(security find-generic-password -s "$KC" -a "$USER" -w)"
        # 2. Encrypted APFS sparsebundle (create once).
        if [ ! -d "$IMG" ]; then
          printf '%s' "$PASS" | hdiutil create -type SPARSEBUNDLE -fs APFS \
            -encryption AES-256 -stdinpass -volname cloister-do -size 10g "$IMG" >/dev/null
          echo "dev:securevol: created encrypted volume $IMG."
        fi
        # 3. Mount at CLOISTER_DO_PATH (idempotent).
        if mount | grep -q " on $MOUNT "; then
          echo "dev:securevol: already mounted at $MOUNT."
        else
          # Refuse to mount over existing DO data. Mounting the (empty) volume
          # here would SHADOW it — the cluster would see an empty store and the
          # old beads/blobs/trust/vault would be hidden under the mount (not
          # deleted, but invisible). Migrate first: mount the volume at a temp
          # dir, `cp -a "$MOUNT"/. <tmp>/`, unmount, move the plaintext dir
          # aside, then re-run so the volume mounts onto an empty path.
          if [ -d "$MOUNT" ] && [ -n "$(ls -A "$MOUNT" 2>/dev/null)" ]; then
            echo "dev:securevol: REFUSING — $MOUNT is non-empty (existing DO data)." >&2
            echo "  Mounting here would shadow it. Migrate the data into the volume" >&2
            echo "  first (see the task comment) or point CLOISTER_DO_PATH at an empty" >&2
            echo "  dir. Your data is NOT touched." >&2
            exit 1
          fi
          mkdir -p "$MOUNT"
          printf '%s' "$PASS" | hdiutil attach -stdinpass -mountpoint "$MOUNT" -nobrowse "$IMG" >/dev/null
          echo "dev:securevol: mounted (encrypted) at $MOUNT."
        fi
        # The sparsebundle IS the durable store — persistent on disk, never
        # auto-deleted. Unmount/remount preserves all data; detach with
        # `hdiutil detach $MOUNT`. Data survives cluster teardown + reboots.
        echo "dev:securevol: export CLOISTER_DO_PATH=$MOUNT, then run task serve:local / task dev."
        echo "dev:securevol: data persists in $IMG (unmount-safe); detach via hdiutil detach $MOUNT."
      # Compose the Phase-0 permission lockdown onto the freshly-mounted volume.
      - task: do:harden

  mermaid:lint:
    desc: "Validate mermaid blocks in markdown — catches undeclared node refs (the GH-renderer-breaks bug)"
