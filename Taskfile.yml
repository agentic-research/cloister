version: "3"

includes:
  rs:
    taskfile: ./rs/Taskfile.yml
    dir: ./rs
  # Recipe tasks live in recipes/Taskfile.yml — the root stays an index.
  recipes:
    taskfile: ./recipes/Taskfile.yml
    dir: ./recipes

vars:
  # Use tsx as a Node loader instead of the tsx CLI. The CLI opens an IPC
  # pipe even for simple script runs, which fails in sandboxed local flows.
  NODE_TSX: node --import tsx

tasks:
  deps:node:
    desc: "Install Node dependencies from pnpm-lock.yaml. CI and local bootstrap use this; verification gates assume deps are already present and stay offline."
    cmds:
      - pnpm install --frozen-lockfile
    sources:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
    generates:
      - node_modules/.modules.yaml

  build:
    desc: Bundle Worker for Cloudflare / wrangler dev
    deps: [manifest]
    cmds:
      - pnpm exec wrangler build
    sources:
      - src/**/*.ts
      - tsconfig.json
    generates:
      - .wrangler/tmp/build-*/index.js

  tool-schemas:
    desc: "Compile src/tool-schemas/*.ts (zod) → src/generated/tool-schemas.ts (cloister-7ca96c)"
    run: once
    cmds:
      - "{{.NODE_TSX}} scripts/build-tool-schemas.mjs"
    sources:
      - src/tool-schemas/**/*.ts
      - scripts/build-tool-schemas.mjs
    generates:
      - src/generated/tool-schemas.ts

  manifest:
    desc: Compile cloister.capnp → src/generated/manifest.ts (ADR-0004). Overlays zod-derived tool schemas (cloister-7ca96c).
    deps: [tool-schemas]
    run: once
    cmds:
      # `scripts/build-manifest.mjs` dynamically `import()`s
      # `src/generated/tool-schemas.ts` — a `.ts` file directly. Node 23+
      # strips types natively (works locally), but the CI runner uses
      # Node 20 LTS (matches workerd's runtime line) which can't load .ts
      # without a loader. `tsx` (in devDeps) provides the loader on any
      # Node version. Don't switch back to `node` until CI moves off
      # Node 20 OR build-tool-schemas emits .mjs (the latter would
      # break tsc on src/generated/tool-schemas.ts; pick the right path
      # then, not now).
      - "{{.NODE_TSX}} scripts/build-manifest.mjs"
    sources:
      - cloister.capnp
      - manifest/cloister.capnp
      - scripts/build-manifest.mjs
      # Build-time validation imports buildServiceRegistry from this
      # pure module. Without listing it here, Task's checksum cache
      # would skip `task manifest` after a validation-rule change
      # (Copilot #8 on PR #36).
      - src/manifest/vault-proxy-services.ts
      - src/generated/tool-schemas.ts
    generates:
      - src/generated/manifest.ts

  # NOTE: the legacy capnp→ts generator (`cluster:manifest` / build-cluster.mjs)
  # was retired in cloister-ab8f21. src/generated/cluster.ts is generated
  # solely from the operator-authoritative cluster.toml via `cluster:toml`
  # (ADR-0025). The old leg read the hand-authored root cluster.capnp, which
  # carries no `inputs` — so it would have regenerated cluster.ts WITHOUT the
  # declared inputs, silently regressing them.

  # schema-bridge tasks
  #
  # Build-time codegen pipeline that lowers capnp schemas into zod
  # validators + matching TS/Go types. The plugin is LLO's
  # `leyline-schema-bridge` crate (rs/ll-open/schema-bridge), consumed as
  # a SHA-pinned git dep anchored in rs/crates/cas — cloister no longer
  # vendors it (ADR-0036 Phase 2, LLO PR #222, bead cloister-a7346b).
  #
  # Intentionally NOT wired into `task verify` or `task lint` yet —
  # this is a migration step. The output sits beside the existing
  # capnp-eval pipeline (src/generated/cluster.ts) and the legacy file
  # imports it as a side-effect to keep it in the dependency graph for
  # `task lint`'s tsc pass.
  schema-bridge:build:
    desc: "Fetch LLO's schema-bridge capnp plugins (zod + go) as DIGEST-PINNED published binaries (cloister-9170d0). Was `cargo build` against a SHA-pinned git dep, which sat at v0.7.9 while the fix cloister needed shipped in 0.11.3 — the regen ran green against a five-minor-stale generator and nothing reported it. Digests live in schema-bridge.lock.json and are verified on EVERY run, cached under rs/target/schema-bridge/<version>/ so a warm tree needs no network."
    cmds:
      - node scripts/fetch-schema-bridge.mjs capnpc-schema-bridge-zod
      - node scripts/fetch-schema-bridge.mjs capnpc-schema-bridge-go
    sources:
      - schema-bridge.lock.json
      - scripts/fetch-schema-bridge.mjs

  harness:sandbox:build:
    desc: "Build the cloister-harness confinement binary (S1). Gate: a nono API bump or a bad edit fails here instead of silently breaking `SANDBOX=nono task harness:dev`. Builds the nono (Seatbelt/Landlock) + sigstore closure into ITS OWN target dir (tools/harness-sandbox/target) — NOT shared with rs/target's host-extras nono build, since cargo namespaces compiled artifacts per target dir. CI caches tools/harness-sandbox/target separately (ci.yml) so a warm run is fast; cold is ~4min. Wired into `verify:strict`."
    dir: tools/harness-sandbox
    cmds:
      - cargo build --release
    sources:
      - src/**/*.rs
      - Cargo.toml
      - Cargo.lock
    generates:
      - target/release/cloister-harness

  spike:libkrun:
    desc: "cloister-b28416 — libkrun VMM-embed proof (ADR-0044/0046). Boots an Alpine microVM on HVF, proves guest fs reads+writes forward to a host dir (mediate-below-stock-libkrun). macOS+libkrun only; SKIPs elsewhere. NOT a CI gate (runners lack HVF/KVM). Prereq: brew tap slp/krun && brew install krunvm."
    cmds:
      - bash tools/libkrun-spike/run-spike.sh

  spike:libkrun:mediated:
    desc: "cloister-e87760 — the ADR-0044/0046 KEYSTONE proof. Boots the microVM with its virtio-fs backed by the ConfinementGraph MEDIATOR's NFS (not a passthrough) and proves the guest fs traverses the mediator: allowed skill served + recorded, policy-denied path blocked in-guest. macOS+libkrun+sudo only; SKIPs elsewhere. NOT a CI gate. Prereq: run spike:libkrun once (fetches rootfs)."
    cmds:
      - bash tools/libkrun-spike/run-mediated.sh

  mediator:test:
    desc: "Compatibility check for the former tools/mediator crate. The canonical ConfinementGraph implementation now lives in rs/crates/host-runtime and is gated by rs:host-runtime:test."
    dir: tools/mediator
    cmds:
      - cargo test

  mediator:dev:
    desc: "cloister-b2d2b1 — mount the confinement-wrapped leyline-fs graph over NFS (Plan 3 Task 5). BLOCKED on ley-line-open-95cd90 (leyline-fs `nfs` feature missing dep:libc). Once LLO ships the fix: cargo run --bin mount --features nfs. macOS-native (nfsserve, kext-free)."
    dir: tools/mediator
    cmds:
      - cargo run --bin mount --features nfs

  cluster:zod:
    desc: "Regenerate src/generated/cluster.zod.ts via schema-bridge. NOT a verify gate yet; run manually after cluster.capnp schema edits."
    deps: [schema-bridge:build]
    cmds:
      - |
        set -eu
        # `capnp compile` exits 0 even when the plugin errors and
        # writes nothing — its stderr carries the real diagnostic.
        # Generate into a tmpdir + existence-check + atomic move into
        # src/generated/. An in-place existence check is insufficient
        # because cluster.zod.ts is already committed: a failing
        # plugin run that writes nothing would leave the OLD file in
        # tree and `[ -f … ]` would falsely pass. Same shape as
        # :check-drift below.
        TMPDIR=$(mktemp -d)
        trap 'rm -rf "$TMPDIR"' EXIT
        capnp compile -o"$(node scripts/fetch-schema-bridge.mjs capnpc-schema-bridge-zod)":"$TMPDIR" manifest/cluster.capnp
        if [ ! -f "$TMPDIR/cluster.zod.ts" ]; then
          echo "FAIL — schema-bridge produced no cluster.zod.ts; check capnp stderr above" >&2
          exit 1
        fi
        mv "$TMPDIR/cluster.zod.ts" src/generated/cluster.zod.ts
    sources:
      - manifest/cluster.capnp
      - schema-bridge.lock.json
    generates:
      - src/generated/cluster.zod.ts

  cluster:zod:verify:
    desc: "End-to-end semantic check — ClusterSchema (from cluster.zod.ts) must accept the real cluster const (from cluster.ts). Surfaced the union-shape bug during the initial schema-bridge wiring; lives here to lock that property in."
    cmds:
      - "{{.NODE_TSX}} scripts/validate-cluster-zod.mjs"
    sources:
      - src/generated/cluster.ts
      - src/generated/cluster.zod.ts
      - scripts/validate-cluster-zod.mjs

  cluster:zod:check-drift:
    desc: "Drift check — regenerate cluster.zod.ts into a temp file and diff against the committed copy. Fails if schema-bridge's output diverges from what's checked in. Opt-in; not part of `task verify` yet. Requires the `capnp` CLI."
    deps: [schema-bridge:build]
    cmds:
      - |
        set -eu
        TMPDIR=$(mktemp -d)
        trap 'rm -rf "$TMPDIR"' EXIT
        # `capnp compile` exits 0 even when the plugin errors and
        # writes nothing — its stderr carries the real diagnostic.
        # Check that the output file actually landed before diffing,
        # otherwise `diff` would fail on a missing file with a
        # misleading "DRIFT" framing.
        capnp compile -o"$(node scripts/fetch-schema-bridge.mjs capnpc-schema-bridge-zod)":"$TMPDIR" manifest/cluster.capnp
        if [ ! -f "$TMPDIR/cluster.zod.ts" ]; then
          echo "FAIL — schema-bridge produced no cluster.zod.ts; check capnp stderr above" >&2
          exit 1
        fi
        if ! diff -u src/generated/cluster.zod.ts "$TMPDIR/cluster.zod.ts"; then
          echo "" >&2
          echo "DRIFT — committed src/generated/cluster.zod.ts differs from what" >&2
          echo "schema-bridge would generate today. Run \`task cluster:zod\` to" >&2
          echo "regenerate, then commit." >&2
          exit 1
        fi
        echo "OK — cluster.zod.ts matches the schema-bridge codegen output"
    sources:
      - manifest/cluster.capnp
      - schema-bridge.lock.json
      - src/generated/cluster.zod.ts

  cluster:go:
    desc: "Regenerate pkg/cluster/cluster.go via schema-bridge (Go emitter). NOT a verify gate yet; run manually after cluster.capnp schema edits. Requires `capnp` CLI + `gofmt`."
    deps: [schema-bridge:build]
    cmds:
      - |
        set -eu
        # Same atomic-move pattern as cluster:zod (the plugin can
        # silently write nothing on stderr; existence-check first).
        TMPDIR=$(mktemp -d)
        trap 'rm -rf "$TMPDIR"' EXIT
        capnp compile -o"$(node scripts/fetch-schema-bridge.mjs capnpc-schema-bridge-go)":"$TMPDIR" manifest/cluster.capnp
        if [ ! -f "$TMPDIR/cluster.go" ]; then
          echo "FAIL — schema-bridge produced no cluster.go; check capnp stderr above" >&2
          exit 1
        fi
        # Pipe through `gofmt -s` (simplify) for canonical formatting.
        # The Rust emitter intentionally doesn't do column alignment;
        # gofmt is the authoritative formatter for Go. Per
        # cloister-76a9ea hand-off note.
        gofmt -s "$TMPDIR/cluster.go" > pkg/cluster/cluster.go
    sources:
      - manifest/cluster.capnp
      - schema-bridge.lock.json
    generates:
      - pkg/cluster/cluster.go

  cluster:go:check-drift:
    desc: "Drift check — regenerate pkg/cluster/cluster.go into a temp file (gofmt'd) and diff against the committed copy. Fails if schema-bridge's Go output diverges from what's checked in. Opt-in; not part of `task verify` yet. Requires `capnp` + `gofmt`."
    deps: [schema-bridge:build]
    cmds:
      - |
        set -eu
        TMPDIR=$(mktemp -d)
        trap 'rm -rf "$TMPDIR"' EXIT
        capnp compile -o"$(node scripts/fetch-schema-bridge.mjs capnpc-schema-bridge-go)":"$TMPDIR" manifest/cluster.capnp
        if [ ! -f "$TMPDIR/cluster.go" ]; then
          echo "FAIL — schema-bridge produced no cluster.go; check capnp stderr above" >&2
          exit 1
        fi
        gofmt -s "$TMPDIR/cluster.go" > "$TMPDIR/cluster.gofmt.go"
        if ! diff -u pkg/cluster/cluster.go "$TMPDIR/cluster.gofmt.go"; then
          echo "" >&2
          echo "DRIFT — committed pkg/cluster/cluster.go differs from what" >&2
          echo "schema-bridge would generate today. Run \`task cluster:go\` to" >&2
          echo "regenerate, then commit." >&2
          exit 1
        fi
        echo "OK — pkg/cluster/cluster.go matches the schema-bridge Go codegen output"
    sources:
      - manifest/cluster.capnp
      - schema-bridge.lock.json
      - pkg/cluster/cluster.go

  cluster:go:verify:
    desc: "End-to-end Go round-trip — the cluster const (dumped from src/generated/cluster.ts) must unmarshal into the generated Go types and round-trip without loss. Parallel to cluster:zod:verify. Requires Go toolchain."
    cmds:
      - scripts/verify-go.sh
    sources:
      - src/generated/cluster.ts
      - pkg/cluster/cluster.go
      - pkg/cluster/cluster_roundtrip_test.go
      - scripts/verify-go.sh

  # identity:* — second schema for schema-bridge generalization proof
  # (ADR-0036 Phase 1 piece E, cloister-77172d). manifest/identity.capnp
  # is a vendored copy of notme's source-of-truth schema; these tasks
  # regen + drift-check the generated artifacts. -I./wire adds the
  # vendored go.capnp to capnp's import path (identity.capnp imports
  # it for $Go.* annotations).
  identity:zod:
    desc: "Regenerate src/generated/identity.zod.ts via schema-bridge. NOT a verify gate yet; run manually after manifest/identity.capnp updates."
    deps: [schema-bridge:build]
    cmds:
      - |
        set -eu
        TMPDIR=$(mktemp -d)
        trap 'rm -rf "$TMPDIR"' EXIT
        capnp compile -I./wire -o"$(node scripts/fetch-schema-bridge.mjs capnpc-schema-bridge-zod)":"$TMPDIR" manifest/identity.capnp
        if [ ! -f "$TMPDIR/identity.zod.ts" ]; then
          echo "FAIL — schema-bridge produced no identity.zod.ts; check capnp stderr above" >&2
          exit 1
        fi
        mv "$TMPDIR/identity.zod.ts" src/generated/identity.zod.ts
    sources:
      - manifest/identity.capnp
      - schema-bridge.lock.json
    generates:
      - src/generated/identity.zod.ts

  identity:zod:check-drift:
    desc: "Drift check for identity.zod.ts (parallel to cluster:zod:check-drift)."
    deps: [schema-bridge:build]
    cmds:
      - |
        set -eu
        TMPDIR=$(mktemp -d)
        trap 'rm -rf "$TMPDIR"' EXIT
        capnp compile -I./wire -o"$(node scripts/fetch-schema-bridge.mjs capnpc-schema-bridge-zod)":"$TMPDIR" manifest/identity.capnp
        if [ ! -f "$TMPDIR/identity.zod.ts" ]; then
          echo "FAIL — schema-bridge produced no identity.zod.ts; check capnp stderr above" >&2
          exit 1
        fi
        if ! diff -u src/generated/identity.zod.ts "$TMPDIR/identity.zod.ts"; then
          echo "" >&2
          echo "DRIFT — committed src/generated/identity.zod.ts differs from what" >&2
          echo "schema-bridge would generate today. Run \`task identity:zod\` to" >&2
          echo "regenerate, then commit." >&2
          exit 1
        fi
        echo "OK — identity.zod.ts matches the schema-bridge codegen output"
    sources:
      - manifest/identity.capnp
      - schema-bridge.lock.json
      - src/generated/identity.zod.ts

  identity:go:
    desc: "Regenerate pkg/identity/identity.go via schema-bridge (Go emitter). NOT a verify gate yet."
    deps: [schema-bridge:build]
    cmds:
      - |
        set -eu
        TMPDIR=$(mktemp -d)
        trap 'rm -rf "$TMPDIR"' EXIT
        capnp compile -I./wire -o"$(node scripts/fetch-schema-bridge.mjs capnpc-schema-bridge-go)":"$TMPDIR" manifest/identity.capnp
        if [ ! -f "$TMPDIR/identity.go" ]; then
          echo "FAIL — schema-bridge produced no identity.go; check capnp stderr above" >&2
          exit 1
        fi
        gofmt -s "$TMPDIR/identity.go" > pkg/identity/identity.go
    sources:
      - manifest/identity.capnp
      - schema-bridge.lock.json
    generates:
      - pkg/identity/identity.go

  identity:go:check-drift:
    desc: "Drift check for pkg/identity/identity.go (parallel to cluster:go:check-drift)."
    deps: [schema-bridge:build]
    cmds:
      - |
        set -eu
        TMPDIR=$(mktemp -d)
        trap 'rm -rf "$TMPDIR"' EXIT
        capnp compile -I./wire -o"$(node scripts/fetch-schema-bridge.mjs capnpc-schema-bridge-go)":"$TMPDIR" manifest/identity.capnp
        if [ ! -f "$TMPDIR/identity.go" ]; then
          echo "FAIL — schema-bridge produced no identity.go; check capnp stderr above" >&2
          exit 1
        fi
        gofmt -s "$TMPDIR/identity.go" > "$TMPDIR/identity.gofmt.go"
        if ! diff -u pkg/identity/identity.go "$TMPDIR/identity.gofmt.go"; then
          echo "" >&2
          echo "DRIFT — committed pkg/identity/identity.go differs from what" >&2
          echo "schema-bridge would generate today. Run \`task identity:go\` to" >&2
          echo "regenerate, then commit." >&2
          exit 1
        fi
        echo "OK — pkg/identity/identity.go matches the schema-bridge Go codegen output"
    sources:
      - manifest/identity.capnp
      - schema-bridge.lock.json
      - pkg/identity/identity.go

  cluster:emit:
    desc: "Emit deployment artifacts (compose YAML) from cluster.toml via the canonical TOML → cluster.ts pipeline"
    deps: [cluster:toml]
    cmds:
      - node scripts/emit-compose.mjs
    sources:
      - src/generated/cluster.ts
      - scripts/emit-compose.mjs
    generates:
      - cluster.compose.yaml

  # ── Bidi TOML ↔ cluster.ts pipeline (ADR-0025, cloister-ae06f3) ─────────
  #
  # Forward leg (`cluster:toml`):     cluster.toml → cluster.ts via
  #                                   @iarna/toml.parse → ClusterSchema →
  #                                   semantic check → render.
  # Reverse leg (`cluster:toml:export`): cluster.ts → canonical TOML
  #                                      (stdout; pass `-- --write <path>`
  #                                      to land at a file).
  # Drift gate (`cluster:toml:roundtrip`): re-export current cluster.ts to
  #                                        a tmp TOML and diff against the
  #                                        committed cluster.toml — fails
  #                                        on drift. Same shape as
  #                                        `cluster:zod:check-drift`.
  #
  # The tasks require the tsx loader because the scripts dynamically
  # import the .ts ClusterSchema from src/generated/cluster.zod.ts.
  cluster:toml:
    desc: "Operator workflow — parse cluster.toml, validate via ClusterSchema, render src/generated/cluster.ts, then re-canonicalize cluster.toml (cloister-ae06f3 + cloister-fe891f, ADR-0025)."
    # Two cmds chained: forward leg (cluster.toml → cluster.ts) then
    # reverse leg (cluster.ts → canonical cluster.toml). Operators edit
    # cluster.toml in whatever shape (`httpPort = 9999`, bundle inserted
    # anywhere); after `task cluster:toml`, both files are in canonical
    # sync. Same idempotency profile as `task cluster:zod` regenerating
    # cluster.zod.ts. The chain is the SPEC of the workflow; the
    # cluster-toml contract test pins it.
    cmds:
      - "{{.NODE_TSX}} scripts/toml-to-cluster.mjs"
      - "{{.NODE_TSX}} scripts/cluster-to-toml.mjs --write cluster.toml"
    sources:
      - cluster.toml
      - scripts/toml-to-cluster.mjs
      - scripts/cluster-to-toml.mjs
      - src/generated/cluster.zod.ts
    generates:
      - src/generated/cluster.ts

  cluster:toml:export:
    desc: "Reverse leg — render canonical TOML from src/generated/cluster.ts. Writes to stdout; pass `-- --write <path>` to land at a file."
    cmds:
      - "{{.NODE_TSX}} scripts/cluster-to-toml.mjs {{.CLI_ARGS}}"
    sources:
      - src/generated/cluster.ts
      - scripts/cluster-to-toml.mjs

  cluster:toml:roundtrip:
    desc: "Drift gate — re-export src/generated/cluster.ts to a temp TOML and diff against the committed cluster.toml. Fails if the two diverge (operator edited cluster.toml without running `task cluster:toml`, or vice-versa). Mirrors `cluster:zod:check-drift`."
    # Intentionally no `sources:` block — gates must always run; the
    # task-runner's mtime cache would otherwise skip the gate when
    # nothing visibly changed, which is exactly the case where drift
    # silently lands (someone hand-edited cluster.ts after a stale
    # cluster.toml). Same shape as cluster:zod:check-drift.
    cmds:
      - |
        set -eu
        if [ ! -f cluster.toml ]; then
          echo "FAIL — cluster.toml does not exist at repo root; run \`task cluster:toml:export -- --write cluster.toml\` to seed it" >&2
          exit 1
        fi
        TMPDIR=$(mktemp -d)
        trap 'rm -rf "$TMPDIR"' EXIT
        # Use `--write` so any successful write commits atomically to the
        # tmpdir before diff; `set -eu` surfaces script failures.
        {{.NODE_TSX}} scripts/cluster-to-toml.mjs --write "$TMPDIR/cluster.toml" >/dev/null
        if [ ! -f "$TMPDIR/cluster.toml" ]; then
          echo "FAIL — cluster-to-toml produced no output; check tsx stderr above" >&2
          exit 1
        fi
        if ! diff -u cluster.toml "$TMPDIR/cluster.toml"; then
          echo "" >&2
          echo "DRIFT — committed cluster.toml differs from what cluster-to-toml.mjs" >&2
          echo "would generate from the current src/generated/cluster.ts. Either:" >&2
          echo "  - operator edited cluster.toml: run \`task cluster:toml\` to regenerate cluster.ts, then commit both" >&2
          echo "  - operator edited cluster.ts: run \`task cluster:toml:export -- --write cluster.toml\` to refresh cluster.toml, then commit both" >&2
          exit 1
        fi
        echo "OK — cluster.toml matches the cluster-to-toml.mjs canonical output for the current cluster.ts"

  test:cluster-toml:
    desc: "Bidi TOML pipeline contract tests (cloister-ae06f3) — node:test under tsx loader so the scripts can dynamically import src/generated/cluster.zod.ts."
    cmds:
      - "{{.NODE_TSX}} --test scripts/test/cluster-toml-roundtrip.test.mjs"
    sources:
      - scripts/test/cluster-toml-roundtrip.test.mjs
      - scripts/toml-to-cluster.mjs
      - scripts/cluster-to-toml.mjs
      - src/generated/cluster.zod.ts

  emit:cloister-capnp:
    desc: "Phase 2 of \"cloister.capnp as build artifact\" arc (cloister-345ad1, ADR-0031) — generate cloister.capnp from cluster.toml ([[routes]] + [metadata]) + cluster.lock.toml ([[generated_backends]]). Byte-stable; safe to commit the output."
    cmds:
      - "{{.NODE_TSX}} scripts/emit-cloister-capnp.mjs --write cloister.capnp"
    sources:
      - cluster.toml
      - cluster.lock.toml
      - scripts/emit-cloister-capnp.mjs
      - scripts/toml-to-cluster.mjs
    generates:
      - cloister.capnp

  emit:cloister-capnp:drift:
    desc: "Drift gate — re-emit cloister.capnp to a tmp file + diff against the committed copy. Same shape as cluster:toml:roundtrip + cluster:zod:check-drift. Per cloister-345ad1 / ADR-0031."
    cmds:
      - |
        set -eu
        if [ ! -f cloister.capnp ]; then
          echo "FAIL — cloister.capnp does not exist at repo root; run \`task emit:cloister-capnp\` to seed it" >&2
          exit 1
        fi
        TMPDIR=$(mktemp -d)
        trap 'rm -rf "$TMPDIR"' EXIT
        {{.NODE_TSX}} scripts/emit-cloister-capnp.mjs --write "$TMPDIR/cloister.capnp" >/dev/null
        if [ ! -f "$TMPDIR/cloister.capnp" ]; then
          echo "FAIL — emit-cloister-capnp produced no output; check tsx stderr above" >&2
          exit 1
        fi
        if ! diff -u cloister.capnp "$TMPDIR/cloister.capnp"; then
          echo "" >&2
          echo "DRIFT — committed cloister.capnp differs from what" >&2
          echo "emit-cloister-capnp.mjs would generate from the current" >&2
          echo "cluster.toml + cluster.lock.toml. Run \`task emit:cloister-capnp\`" >&2
          echo "to regenerate, then commit. Per cloister-345ad1 / ADR-0031." >&2
          exit 1
        fi
        echo "OK — cloister.capnp matches the emit-cloister-capnp.mjs canonical output"

  test:emit-cloister-capnp:
    desc: "Phase 2 of cloister-345ad1 — contract tests for scripts/emit-cloister-capnp.mjs."
    cmds:
      - "{{.NODE_TSX}} --test scripts/test/emit-cloister-capnp.test.mjs"
    sources:
      - scripts/test/emit-cloister-capnp.test.mjs
      - scripts/emit-cloister-capnp.mjs
      - scripts/toml-to-cluster.mjs

  cluster:resolve:
    desc: "ADR-0026 Phase 1b — resolve cluster.toml [inputs.*] refs (file://, https://) + write cluster.lock.toml with content-addressed digests. Operator runs this after editing cluster.toml; commits both files. Per cloister-cf7a3b."
    cmds:
      - "{{.NODE_TSX}} scripts/resolve-inputs.mjs"
    sources:
      - cluster.toml
      - scripts/resolve-inputs.mjs
    generates:
      - cluster.lock.toml

  inputs:pull:
    desc: "ADR-0026 Phase 1c — preview and explicitly acquire the OCI images pinned by cluster.lock.toml. Interactive runs ask confirmation; automation passes --yes. Mutable refs are rejected unless --allow-unpinned is separately acknowledged. `task inputs:pull -- --print` previews without pulling."
    cmds:
      - "{{.NODE_TSX}} scripts/pull-inputs.mjs {{.CLI_ARGS}}"
    sources:
      - cluster.lock.toml
      - scripts/pull-inputs.mjs

  cluster:dev:
    desc: "Mac dev launcher — spawns cluster bundles as native processes with UDS in /tmp (cloister-be0607c). CLUSTER_DEV_DRY_RUN=1 to preview without spawning."
    # cluster.ts comes from the authoritative cluster.toml leg (ADR-0025); the
    # legacy capnp→ts cluster:manifest was retired (cloister-ab8f21).
    deps: [cluster:toml]
    cmds:
      - node scripts/cluster-dev.mjs
    sources:
      - src/generated/cluster.ts
      - scripts/cluster-dev.mjs

  cluster:up:
    desc: "Run the cluster locally via nerdctl/podman/docker compose"
    deps: [cluster:emit]
    cmds:
      - 'echo "[cluster] using compose runtime — set COMPOSE_CMD to override (default tries nerdctl, then podman, then docker)"'
      - |
        CMD="${COMPOSE_CMD:-}"
        if [ -z "$CMD" ]; then
          if command -v nerdctl >/dev/null 2>&1; then CMD="nerdctl compose";
          elif command -v podman >/dev/null 2>&1; then CMD="podman compose";
          elif command -v docker >/dev/null 2>&1; then CMD="docker compose";
          else echo "no compose-capable runtime found (need nerdctl, podman, or docker)" >&2; exit 1; fi
        fi
        echo "[cluster] running: $CMD up -f cluster.compose.yaml"
        exec $CMD -f cluster.compose.yaml up

  cluster:down:
    desc: "Tear down the local cluster (preserves volumes — pass DESTROY=1 to also remove)"
    cmds:
      - |
        CMD="${COMPOSE_CMD:-}"
        if [ -z "$CMD" ]; then
          if command -v nerdctl >/dev/null 2>&1; then CMD="nerdctl compose";
          elif command -v podman >/dev/null 2>&1; then CMD="podman compose";
          elif command -v docker >/dev/null 2>&1; then CMD="docker compose";
          else echo "no compose-capable runtime found" >&2; exit 1; fi
        fi
        if [ "${DESTROY:-0}" = "1" ]; then
          exec $CMD -f cluster.compose.yaml down -v
        else
          exec $CMD -f cluster.compose.yaml down
        fi

  cluster:test:
    desc: "Tier 1 integration matrix (cloister-1b1124) — builds + smokes all 5 sibling OCI images then boots cluster.capnp via task cluster:up. Opt-in, not part of `task lint`. ~5-10 min cold; SKIP_BUILDS=1 reuses loaded images. See scripts/integration-test.sh."
    cmds:
      - bash scripts/integration-test.sh

  wire:fixtures:
    desc: Regenerate substrate-equivalence fixtures from wire/cross-check-fixtures.capnp (ADR-0005, cloister-5183bc 2D-codec.D)
    cmds:
      - node scripts/gen-wire-fixtures.mjs
    sources:
      - wire/cloister.capnp
      - wire/cross-check-fixtures.capnp
      - scripts/gen-wire-fixtures.mjs
    generates:
      - test/wire/fixtures/canonical.ts

  helper:start:
    desc: "Start the leyline-sign-helper in the foreground on 127.0.0.1:8786 (cloister-99165e, ADR-0019). Builds first if needed."
    deps: [rs:sign:helper]
    cmds:
      - rs/target/release/leyline-sign-helper --bind 127.0.0.1:8786 --foreground

  helper:status:
    desc: "Probe GET /healthz to confirm the leyline-sign-helper is reachable (cloister-99165e)."
    cmds:
      # curl -fsS is the real check (non-2xx / unreachable → non-zero). jq only
      # pretty-prints; degrade to raw when it's absent so a missing jq doesn't
      # break a probe that otherwise succeeded. (Convenience task, not a gate.)
      - |
        resp=$(curl -fsS http://127.0.0.1:8786/healthz) || exit 1
        if command -v jq >/dev/null 2>&1; then printf '%s\n' "$resp" | jq .; else printf '%s\n' "$resp"; fi

  wire:verify-roundtrip:
    desc: Phase 2D-codec.E direction-2 substrate equivalence (our encode → capnp decode → capnp encode → our decode)
    cmds:
      - pnpm exec tsc --project tsconfig.verify.json
      - node scripts/verify-wire-roundtrip.mjs
    sources:
      - src/wire/**/*.ts
      - wire/cloister.capnp
      - scripts/verify-wire-roundtrip.mjs
      - tsconfig.verify.json

  companion:stub:
    desc: Run a local stub of cloister-companion (ADR-0005). HTTP listener on :8385 that decodes capnp ToolCall and returns canned ToolResult — lets `task dev` exercise leylineNet backends without a real Rust companion.
    cmds:
      - pnpm exec tsc --project tsconfig.verify.json
      - 'echo "[task] stub-companion starting on :8385 (PORT=N to override, STUB_COMPANION_VERBOSE=1 for per-request logs)"'
      - node scripts/stub-companion.mjs
    sources:
      - src/wire/**/*.ts
      - scripts/stub-companion.mjs
      - tsconfig.verify.json

  smoke:leyline-stub:
    desc: End-to-end wire smoke — production codec → real HTTP → stub-companion → real HTTP → production codec. Spawns + tears down the stub on an ephemeral port (default :18385).
    cmds:
      - pnpm exec tsc --project tsconfig.verify.json
      - node scripts/smoke-leyline-stub.mjs
    sources:
      - src/wire/**/*.ts
      - scripts/stub-companion.mjs
      - scripts/smoke-leyline-stub.mjs
      - tsconfig.verify.json

  build:local:
    desc: Bundle Worker for local workerd (embeds into dist/)
    deps: [manifest]
    cmds:
      # wrangler 3.x dropped the standalone `build` subcommand; `deploy
      # --dry-run --outdir` is the supported equivalent (it runs the
      # bundler + asset emit, then exits before pushing). Also surfaces
      # any wrangler.toml binding misconfig at build time.
      - pnpm exec wrangler deploy --dry-run --outdir dist
      - node scripts/emit-workerd-config.mjs
    sources:
      - src/**/*.ts
    generates:
      - dist/index.js
      - dist/config.capnp

  test:
    # `rs:sign:wasm` is required because src/wire/signet-verify.ts imports
    # rs/target/wasm32-unknown-unknown/release/leyline_sign.wasm; without
    # it vitest-pool-workers fails every test file at module init. The
    # rs:sign:wasm task has sources/generates declared, so it's a no-op
    # on rebuilds. The crate source now lives in LLO
    # (`rs/ll-open/sign/`); cargo pulls it via the git dep pinned in
    # `rs/crates/cas/Cargo.toml`.
    #
    # `rs:sign:host` runs the host-binary integration + adversarial test
    # suites (cloister-99165e, ADR-0019). Wired into `task test` so the
    # threat-model §15 adversarial tests (upstream in LLO at
    # `rs/ll-open/sign/tests/host_adversarial.rs`) block CI when red.
    # The tests pin invariants from the trust-root-friend pre-merge
    # review (adversarial-cycle 2026-05-12); they are the spec of
    # correct behavior. Without this wire-up, the failing tests don't
    # gate the merge — which defeats the entire point of the gate.
    desc: Run tests inside workerd (real DOs, real SQLite)
    deps: [manifest, rs:test]
    cmds:
      - pnpm exec vitest run
    # Content-hash cache (Task `method: checksum`): skip the workerd suite when
    # none of its inputs changed. The invalidation set is deliberately broad —
    # the code under test, the tests, the vitest/miniflare config surface
    # (vitest.config.ts reads wrangler.toml), the generated manifest (src/generated
    # is under src/**), the capnp schema, and the wasm the suite loads at module
    # init. Over-inclusive by design: a listed-but-irrelevant change just re-runs
    # the suite; a real change is never missed. CI runs on a fresh checkout with a
    # cold cache, so it always executes the full suite regardless (cloister-8e40ad).
    #
    # The dependency tree is part of the system under test, not just its build
    # input: vitest-pool-workers runs the suite THROUGH miniflare, so a bump to
    # miniflare or anything beneath it changes what the tests actually exercise.
    # package.json alone misses that — pnpm 10 declares overrides in
    # pnpm-workspace.yaml, and a transitive bump moves only the lockfile. Found
    # by the CVE-2026-48779 ws override, which reported "up to date" and skipped
    # the whole suite on the one change that most needed running (cloister-035655).
    sources:
      - src/**/*.ts
      - test/**/*.ts
      - vitest.config.ts
      - wrangler.toml
      - config.capnp
      - tsconfig.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - manifest/**/*.capnp
      - rs/target/wasm32-unknown-unknown/release/leyline_sign.wasm

  test:watch:
    desc: Watch mode
    deps: [manifest, rs:sign:wasm]
    cmds:
      - pnpm exec vitest

  bench:lease:
    desc: "Lease-pipeline microbenchmark (cloister-747d98). Excluded from `task lint`/`task test`. Writes results to stdout — paste into docs/perf/*.md."
    deps: [manifest]
    cmds:
      - pnpm exec vitest run --config vitest.bench.config.ts --reporter=verbose test/perf/lease-pipeline.test.ts

  bench:dispatch:
    desc: "tools/call dispatch microbenchmark (cloister-e4daae surface 1). Excluded from `task lint`/`task test`."
    deps: [manifest]
    cmds:
      - pnpm exec vitest run --config vitest.bench.config.ts --reporter=verbose test/perf/tools-call-dispatch.test.ts

  bench:trust-store:
    desc: "TrustStore RPC contention bench (cloister-e4daae surface 2). Excluded from `task lint`/`task test`."
    deps: [manifest]
    cmds:
      - pnpm exec vitest run --config vitest.bench.config.ts --reporter=verbose test/perf/trust-store-contention.test.ts

  bench:disclosure:
    desc: "Disclosure endpoint throughput bench (cloister-e4daae surface 3). Excluded from `task lint`/`task test`."
    deps: [manifest]
    cmds:
      - pnpm exec vitest run --config vitest.bench.config.ts --reporter=verbose test/perf/disclosure-endpoint.test.ts

  bench:registry:
    desc: "OCI registry push/pull bench (cloister-3a3b0d). Monolithic + chunked upload, manifest PUT/GET, blob GET — small/medium/large sizes. Excluded from `task lint`/`task test`."
    deps: [manifest]
    cmds:
      - pnpm exec vitest run --config vitest.bench.config.ts --reporter=verbose test/perf/oci-registry.test.ts

  bench:cold-start:
    desc: "Cold-start cluster boot bench (cloister-e4daae surface 4). External probe — spawns wrangler dev, polls /health."
    cmds:
      - node scripts/bench-cold-start.mjs

  bench:all:
    desc: "Run all perf benches (cloister-e4daae). Slow — opt-in. Writes results to stdout."
    deps: [manifest]
    cmds:
      - pnpm exec vitest run --config vitest.bench.config.ts --reporter=verbose
      - node scripts/bench-cold-start.mjs

  type-check:
    desc: TypeScript type check (no emit)
    deps: [manifest]
    cmds:
      - pnpm exec tsc --noEmit
    # Content-hash cache (Task `method: checksum`, the v3 default): re-check only
    # when a compiled input actually changes. tsc --noEmit follows tsconfig.json;
    # the globs below are generous on purpose (over-inclusive is safe — it can
    # only cause an unnecessary re-run, never a missed one). cloister-8e40ad.
    #
    # The resolved dependency tree is a compiled input: tsc reads .d.ts files out
    # of node_modules, so a version bump changes the types being checked without
    # touching a single source file. package.json alone does NOT capture that —
    # pnpm 10 declares overrides in pnpm-workspace.yaml, and a transitive bump
    # moves only the lockfile. Both are listed so a dependency-only change cannot
    # pass this gate vacuously (cloister-035655).
    sources:
      - src/**/*.ts
      - test/**/*.ts
      - tsconfig.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

  dev:bootstrap:
    desc: "One-time dev setup — generates DEV_VAULT_KEK + writes .env.local (gitignored). Required after ADR-0014 v2 (cloister-125199). Idempotent. (Git hooks — incl. the post-merge bead auto-close — are owned by rsry: `rsry hooks install`, not cloister's Taskfile.)"
    cmds:
      - node scripts/dev-bootstrap.mjs

  dev:
    desc: Start local dev server on :8787 (sources .env.local for VAULT_KEK_SOURCE)
    deps: [manifest]
    cmds:
      # Source .env.local so VAULT_KEK_SOURCE + DEV_VAULT_KEK flow into
      # wrangler's env. ADR-0014 v2 (cloister-125199) requires non-empty
      # VAULT_KEK_SOURCE; the vault DO throws otherwise. Run
      # `task dev:bootstrap` once to generate .env.local.
      - |
        if [ ! -f .env.local ]; then
          echo "✗ .env.local missing — run \`task dev:bootstrap\` first" >&2
          exit 1
        fi
        # cloister-21f273: fail loudly if .dev.vars would shadow a .env.local
        # value under `wrangler dev` (the cloister-d2db6d silent gate-off).
        node scripts/config-source-check.mjs || exit 1
        set -a
        . ./.env.local
        set +a
        pnpm exec wrangler dev

  config:check:
    desc: "cloister-21f273 — preflight the config-source resolution: fail if a .env.local value would be SHADOWED under `wrangler dev` (because .dev.vars exists and wrangler ignores process env) or CONFLICTs with .dev.vars. No-op in CI (gitignored dev files absent). Values never printed."
    cmds:
      - node scripts/config-source-check.mjs

  serve:local:
    desc: Run via workerd directly (requires build:local first)
    cmds:
      - npx workerd serve dist/config.capnp --experimental

  do:harden:
    desc: "ADR-0039 Phase 0 — lock down the local Durable Object storage dir (chmod 700 + files 0600 + Time Machine exclusion). Zero-code at-rest hardening vs the same-UID / backup-exfil threat (threat-model §13.9). Honors CLOISTER_DO_PATH (default /data/do). Same-UID reads still possible until at-rest encryption lands (ADR-0039 Phase 1)."
    cmds:
      - |
        set -eu
        DIR="${CLOISTER_DO_PATH:-/data/do}"
        mkdir -p "$DIR"
        chmod 700 "$DIR"
        find "$DIR" -type f -exec chmod 600 {} + 2>/dev/null || true
        echo "do:harden: $DIR is now 0700 (files 0600) — ADR-0039 Phase 0."
        echo "  same-UID reads still possible until at-rest encryption (ADR-0039 Phase 1)."
        if command -v tmutil >/dev/null 2>&1; then
          if tmutil addexclusion "$DIR" 2>/dev/null; then
            echo "  added Time Machine exclusion for $DIR."
          else
            echo "  run 'sudo tmutil addexclusion $DIR' to exclude it from Time Machine."
          fi
        fi

  dev:securevol:
    desc: "ADR-0039 Phase 1 (macOS) — create/mount an ENCRYPTED APFS volume for local DO storage: passphrase held in Keychain, mounted at CLOISTER_DO_PATH. Idempotent (creates once, mounts thereafter), then composes do:harden. Linux: fscrypt/LUKS on the DO dir + a secret-tool passphrase (see docs/adr/0039). NOTE: writes to your Keychain + creates a disk image — review before first run."
    env:
      # Computed once so the mount path + the composed do:harden agree.
      CLOISTER_DO_PATH:
        sh: echo "${CLOISTER_DO_PATH:-$HOME/.local/share/cloister/do}"
    cmds:
      - |
        set -eu
        if [ "$(uname)" != "Darwin" ]; then
          echo "dev:securevol is macOS-only (APFS). On Linux: fscrypt/LUKS on \$CLOISTER_DO_PATH + a secret-tool passphrase — see docs/adr/0039-local-do-sqlite-security.md." >&2
          exit 1
        fi
        IMG="${CLOISTER_SECUREVOL:-$HOME/.local/share/cloister/cloister-do.sparsebundle}"
        MOUNT="$CLOISTER_DO_PATH"
        KC="cloister-do-volume"
        mkdir -p "$(dirname "$IMG")"
        # 1. Volume passphrase in Keychain (generate once, 256-bit).
        if ! security find-generic-password -s "$KC" -a "$USER" >/dev/null 2>&1; then
          security add-generic-password -s "$KC" -a "$USER" -w "$(openssl rand -base64 32)" -U
          echo "dev:securevol: generated volume passphrase → Keychain (service=$KC)."
        fi
        PASS="$(security find-generic-password -s "$KC" -a "$USER" -w)"
        # 2. Encrypted APFS sparsebundle (create once).
        if [ ! -d "$IMG" ]; then
          printf '%s' "$PASS" | hdiutil create -type SPARSEBUNDLE -fs APFS \
            -encryption AES-256 -stdinpass -volname cloister-do -size 10g "$IMG" >/dev/null
          echo "dev:securevol: created encrypted volume $IMG."
        fi
        # 3. Mount at CLOISTER_DO_PATH (idempotent).
        if mount | grep -q " on $MOUNT "; then
          echo "dev:securevol: already mounted at $MOUNT."
        else
          # Refuse to mount over existing DO data. Mounting the (empty) volume
          # here would SHADOW it — the cluster would see an empty store and the
          # old beads/blobs/trust/vault would be hidden under the mount (not
          # deleted, but invisible). Migrate first: mount the volume at a temp
          # dir, `cp -a "$MOUNT"/. <tmp>/`, unmount, move the plaintext dir
          # aside, then re-run so the volume mounts onto an empty path.
          if [ -d "$MOUNT" ] && [ -n "$(ls -A "$MOUNT" 2>/dev/null)" ]; then
            echo "dev:securevol: REFUSING — $MOUNT is non-empty (existing DO data)." >&2
            echo "  Mounting here would shadow it. Migrate the data into the volume" >&2
            echo "  first (see the task comment) or point CLOISTER_DO_PATH at an empty" >&2
            echo "  dir. Your data is NOT touched." >&2
            exit 1
          fi
          mkdir -p "$MOUNT"
          printf '%s' "$PASS" | hdiutil attach -stdinpass -mountpoint "$MOUNT" -nobrowse "$IMG" >/dev/null
          echo "dev:securevol: mounted (encrypted) at $MOUNT."
        fi
        # The sparsebundle IS the durable store — persistent on disk, never
        # auto-deleted. Unmount/remount preserves all data; detach with
        # `hdiutil detach $MOUNT`. Data survives cluster teardown + reboots.
        echo "dev:securevol: export CLOISTER_DO_PATH=$MOUNT, then run task serve:local / task dev."
        echo "dev:securevol: data persists in $IMG (unmount-safe); detach via hdiutil detach $MOUNT."
      # Compose the Phase-0 permission lockdown onto the freshly-mounted volume.
      - task: do:harden

  do:migrate-securevol:
    desc: "ADR-0039 Phase 1 — migrate an EXISTING populated DO dir into a fresh encrypted volume (macOS), NON-DESTRUCTIVELY. Copies CLOISTER_DO_PATH into the encrypted volume, verifies the file count, moves the plaintext dir aside as a *.plaintext-backup (never deletes), then mounts the encrypted volume in its place + composes do:harden. Idempotent: no-op if already mounted. NOTE: writes Keychain + creates a disk image + moves your DO dir — review before running; delete the plaintext backup yourself once you've confirmed."
    env:
      CLOISTER_DO_PATH:
        sh: echo "${CLOISTER_DO_PATH:-$HOME/.local/share/cloister/do}"
    cmds:
      - |
        set -eu
        [ "$(uname)" = "Darwin" ] || { echo "do:migrate-securevol: macOS-only (APFS). Linux: fscrypt/LUKS migration — see docs/adr/0039." >&2; exit 1; }
        IMG="${CLOISTER_SECUREVOL:-$HOME/.local/share/cloister/cloister-do.sparsebundle}"
        DST="$CLOISTER_DO_PATH"
        KC="cloister-do-volume"
        if mount | grep -q " on $DST "; then echo "do:migrate-securevol: $DST already mounted — nothing to migrate."; exit 0; fi
        if [ ! -d "$DST" ] || [ -z "$(ls -A "$DST" 2>/dev/null)" ]; then
          echo "do:migrate-securevol: $DST is empty — run \`task dev:securevol\` instead (nothing to migrate)." >&2; exit 1
        fi
        BAK="${DST}.plaintext-backup"
        [ -e "$BAK" ] && { echo "do:migrate-securevol: backup path $BAK already exists — move it aside first." >&2; exit 1; }
        mkdir -p "$(dirname "$IMG")"
        # 1. Passphrase in Keychain (generate once).
        if ! security find-generic-password -s "$KC" -a "$USER" >/dev/null 2>&1; then
          security add-generic-password -s "$KC" -a "$USER" -w "$(openssl rand -base64 32)" -U
          echo "do:migrate-securevol: generated volume passphrase → Keychain."
        fi
        PASS="$(security find-generic-password -s "$KC" -a "$USER" -w)"
        # 2. Encrypted sparsebundle (create once).
        if [ ! -d "$IMG" ]; then
          printf '%s' "$PASS" | hdiutil create -type SPARSEBUNDLE -fs APFS -encryption AES-256 -stdinpass -volname cloister-do -size 10g "$IMG" >/dev/null
          echo "do:migrate-securevol: created encrypted volume $IMG."
        fi
        # 3. Mount at a temp point, copy the data in, verify, unmount.
        TMP="$(mktemp -d)"
        printf '%s' "$PASS" | hdiutil attach -stdinpass -mountpoint "$TMP" -nobrowse "$IMG" >/dev/null
        echo "do:migrate-securevol: copying $DST → encrypted volume ..."
        cp -a "$DST"/. "$TMP"/
        SRC_N=$(find "$DST" -type f | wc -l | tr -d ' '); DST_N=$(find "$TMP" -type f | wc -l | tr -d ' ')
        hdiutil detach "$TMP" >/dev/null 2>&1; rmdir "$TMP" 2>/dev/null || true
        if [ "$SRC_N" != "$DST_N" ]; then
          echo "do:migrate-securevol: FILE-COUNT MISMATCH (plaintext $SRC_N vs volume $DST_N) — aborting; your data is untouched at $DST." >&2; exit 1
        fi
        # 4. Move plaintext aside (backup, NEVER deleted), mount encrypted in place.
        mv "$DST" "$BAK"
        mkdir -p "$DST"
        printf '%s' "$PASS" | hdiutil attach -stdinpass -mountpoint "$DST" -nobrowse "$IMG" >/dev/null
        echo "do:migrate-securevol: ✓ migrated $SRC_N files — $DST is now the ENCRYPTED volume."
        echo "  plaintext backup at $BAK — verify the cluster reads fine, then: rm -rf '$BAK'"
      - task: do:harden

  mermaid:lint:
    desc: "Validate mermaid blocks in markdown — catches undeclared node refs (the GH-renderer-breaks bug)"
    cmds:
      - node scripts/lint-mermaid.mjs README.md docs/ARCHITECTURE.md
    sources:
      - README.md
      - docs/ARCHITECTURE.md
      - scripts/lint-mermaid.mjs

  lint:paths:
    desc: "Validate the do-storage path agrees across apko/config.capnp/cluster.capnp (cloister-7c12cc)"
    cmds:
      - node scripts/lint-paths.mjs
    sources:
      - apko.yaml
      - config.capnp
      - cluster.capnp
      - scripts/lint-paths.mjs

  lint:timing:
    desc: "Validate security-affecting timing invariants (cloister-7ea4c4 / P1) — clock-skew, bundle refresh, retry backoff"
    cmds:
      - node scripts/lint-timing-invariants.mjs
    sources:
      - src/storage/ca-bundle-cache.ts
      - src/routes/lease-middleware.ts
      - src/storage/pending-attestations.ts
      - scripts/lint-timing-invariants.mjs

  lint:vault-id-source:
    desc: "Forward-guard lint (cloister-93b0c2 / C6) — rejects `.newUniqueId(` calls in vault-touching source files. ADR-0021 mandates `idFromName(bundleIdName)` for vault DO id derivation; a drift to `newUniqueId()` would silently collapse every per-tenant KEK to the \"cluster\" fallback (see threat-model §13.7.3). No live violation today; defensive."
    cmds:
      - node scripts/lint-vault-id-source.mjs
    sources:
      - src/vault-store.ts
      - src/routes/vault-do-credential-store.ts
      - src/routes/vault-proxy.ts
      - src/routes/vault-proxy-credential-store.ts
      - scripts/lint-vault-id-source.mjs

  harness:dev:
    desc: "ADR-0042 — turnkey local harness run. Mints a fresh ephemeral dev master + cert, writes .dev.vars (CLOISTER_MODE=dev + DEV_* seams), launches cloister (:8787) + the lease shim (:8799), and prints the base-URL export. Pick the harness with `-- --target claude-code|codex` (default claude-code); each target declares its own key env var, upstream, injection and auth modes in scripts/harness-targets.mjs (cloister-742e19). Set that target's key env var first — it is vaulted, never seen by the harness. Prereq: `task dev:bootstrap` once. Dev-only; lint:no-dev-mode keeps it out of committed config."
    cmds:
      - node scripts/harness-dev.mjs {{.CLI_ARGS}}

  harness:dev:setup:
    desc: "ADR-0042 — mint + write .dev.vars only, no launch (for verifying the dev-identity + seed wiring). `task harness:dev` runs this then launches."
    cmds:
      - node scripts/harness-dev.mjs --setup-only {{.CLI_ARGS}}

  lint:no-dev-mode:
    desc: "ADR-0042 safety rail — fail if any committed config enables a dev-mode harness seam (CLOISTER_MODE=dev or a DEV_* binding with a value). Dev mode is runtime-only via `task harness:dev`; it must never ship in config.capnp / wrangler.toml / cluster.toml / generated runtime."
    cmds:
      - node scripts/lint-no-dev-mode.mjs
    sources:
      - config.capnp
      - wrangler.toml
      - cluster.toml
      - cluster.lock.toml
      - src/generated/cluster.ts
      - src/generated/manifest.ts
      - scripts/lint-no-dev-mode.mjs

  lint:lease-gate-source:
    desc: "ADR-0053 / cloister-220c9d single-source guard (cloister-bd7210 Phase 1) — the lease-gate trust anchor `env.INTERLACE_ROOT_PUBKEY` may only be read where the gate is resolved (src/routes/lease-gate.ts) or the CA bundle is (src/storage/ca-bundle-source.ts). Any other src/ file reading it is a re-scattered gate check; routes must go through resolveLeaseGate / leaseEnforced / gateAndVerify."
    cmds:
      - node scripts/lint-lease-gate-source.mjs
    sources:
      - src/**/*.ts
      - scripts/lint-lease-gate-source.mjs

  lint:silent-swallow:
    desc: "cloister-bd7210 Phase 2 rail — a bare `catch {}` on the trust/IO surface (storage/wire/routes) that silently returns null/false/undefined DISCARDS the error (the cloister-3ad090 class). Each must surface it (log / typed error / rethrow) or carry an inline `lint-allow-silent: <reason>` justification."
    cmds:
      - node scripts/lint-silent-swallow.mjs
    sources:
      - src/**/*.ts
      - scripts/lint-silent-swallow.mjs

  lint:log-shape:
    desc: "cloister-bd7e51 rail — an operational log on the trust/IO surface (storage/wire/routes + trust-store/vault-store) must be STRUCTURED (logEvent from src/obs/log.ts, or console.X(JSON.stringify(…))), never an ad-hoc string log (the cloister-3ad090 class: unqueryable + no redaction seam). Justify a real exception with an inline `lint-allow-string-log: <reason>`."
    cmds:
      - node scripts/lint-log-shape.mjs
    sources:
      - src/**/*.ts
      - scripts/lint-log-shape.mjs

  lint:trust-env-locality:
    desc: "cloister-21e42e rail — each trust-secret env var (VAULT_KEK_SOURCE, RECEIPT_SIGNING_KEY, DEV_CA_MASTER, …) may be read only in its resolver. A scattered read is how an empty-value-means-off footgun hides (the emptiness semantics must live in one reviewable place). Generalizes lint:lease-gate-source to the whole trust-secret surface; INTERLACE_ROOT_PUBKEY stays owned by that rail."
    cmds:
      - node scripts/lint-trust-env-locality.mjs
    sources:
      - src/**/*.ts
      - scripts/lint-trust-env-locality.mjs

  cluster:emit:check-drift:
    desc: "Drift gate for cluster.compose.yaml — re-emit to a temp file and diff against the committed copy. It is a GENERATED artifact that is committed, and it had no gate: the committed copy was found stale by an entire bundle (4 bundles/3 wires/3 inputs vs the manifest's 5/4/4), predating notme-proxy and the canonical-hours input. `lint:tenant-docs` READS this file, so it was checking tenant coverage against stale input and passing vacuously (cloister-cb735c)."
    cmds:
      - |
        set -eu
        TMP=$(mktemp -d)
        trap 'rm -rf "$TMP"' EXIT
        COMPOSE_OUTPUT="$TMP/cluster.compose.yaml" node scripts/emit-compose.mjs >/dev/null
        if ! diff -u cluster.compose.yaml "$TMP/cluster.compose.yaml"; then
          echo "DRIFT — cluster.compose.yaml differs from what the emitter produces." >&2
          echo "Regenerate + commit:  task cluster:emit && git add cluster.compose.yaml" >&2
          exit 1
        fi
        echo "OK — cluster.compose.yaml matches the emitter output"
    sources:
      - scripts/emit-compose.mjs
      - src/generated/cluster.ts
      - cluster.lock.toml
      - cluster.compose.yaml

  lint:cargo-pins:
    desc: "Every ley-line-open git dependency across the Rust workspace shares ONE rev and ONE version. `task lint`'s description claimed a \"cargo-pin lint\" that was never written; a v0.13.0 bump then missed the leyline-fs pin in a second manifest, and cargo compiled leyline-core twice (two BLAKE3 folds, two PARTITION_CONTEXT constants) with `cargo check` still exiting 0."
    cmds:
      - node scripts/lint-cargo-pins.mjs
    sources:
      - scripts/lint-cargo-pins.mjs
      - rs/**/Cargo.toml

  lint:structured-parse:
    desc: "Do not hand-match a format that has a parser (cloister-2fb46a). Born from a real bug: lint-binding-parity regexed wrangler.toml, missed every inline-table DO binding, and reported four violations that did not exist. Flags .toml/.json/.yaml read-then-regex; .capnp is exempt (no parser without a capnp toolchain) as is prose. Escape hatch: lint-allow-rawparse: <reason>."
    cmds:
      - node scripts/lint-structured-parse.mjs
    sources:
      - scripts/lint-structured-parse.mjs
      - scripts/**/*.mjs
      - src/**/*.ts

  lint:binding-parity:
    desc: "config.capnp and wrangler.toml must declare the same bindings for anything read in src/ (cloister-9aeb3f). CLAUDE.md called this a manual sync obligation and ADR-0001 recorded it as a known weakness; it had drifted — six trust-surface vars were CF-only, so the lease gate could not be exercised under workerd at all."
    cmds:
      - node scripts/lint-binding-parity.mjs
    sources:
      - scripts/lint-binding-parity.mjs
      - config.capnp
      - wrangler.toml

  lint:spec-citation:
    desc: "cloister-e83a33 rail — every `leyline-schema-spec/...` citation must resolve. That root is a declared ALIAS for ley-line-open's `rs/ll-core/schema-spec/`; no directory of that literal name exists anywhere. Two halves: the SHAPE check (every citation uses the declared root) runs everywhere; the EXISTENCE check needs an LLO checkout and skips without one, so it is a local cross-check rather than a CI-vacuous gate. A deliberate forward reference carries `lint-allow-unresolved: <reason>` on the preceding line."
    cmds:
      - node scripts/lint-spec-citation.mjs
    sources:
      - scripts/lint-spec-citation.mjs
      - "src/**/*.ts"
      - "docs/**/*.md"
      - CLAUDE.md

  lint:harness-target-literals:
    desc: "cloister-742e19 / ADR-0057 rail — provider literals (anthropic/openai, key + base-URL env vars, injection headers, harness binaries) live ONLY in scripts/harness-targets.mjs. A harness is a lattice participant, not a special case: adding one must be a new declared row, never an edit to the harness path. Comments are exempt — usage examples naming both harnesses are documentation worth keeping."
    cmds:
      - node scripts/lint-harness-target-literals.mjs
    sources:
      - scripts/harness-dev.mjs
      - scripts/harness-targets.mjs
      - scripts/lint-harness-target-literals.mjs
      - tools/harness-shim/index.ts

  lint:dev-escape:
    desc: "ADR-0026 rail — a committed cluster.toml must not carry an [inputs.*] `from` dev-escape. `from` wins over `ref`, so committing it silently overrides the durable content-addressed ref for every checkout (and an absolute file:/// path resolves on exactly one machine). manifest/cluster.capnp documented this rule; nothing enforced it until recipes/rosary-dev shipped one. Scoped to [inputs.*] — [[wires]] `from` is a bundle name and is legitimate."
    cmds:
      - node scripts/lint-dev-escape.mjs
    sources:
      - "**/cluster.toml"
      - scripts/lint-dev-escape.mjs

  mutate:
    desc: "Targeted mutation testing (cloister-dab35a). OPT-IN — deliberately NOT a `task lint` dep: the inner-loop gate is content-hash cached at ~3s warm and must stay that way. Applies curated mutants to real files (reverting each in a finally, and refusing to run against a dirty tree) and asserts the suite NOTICES. A SURVIVOR is a missing test, not a style nit. `task mutate -- --only=src/` to filter."
    cmds:
      - node scripts/mutation-probe.mjs {{.CLI_ARGS}}

  lint:shim:
    desc: "Type-check the host-side harness lease shim (cloister-caab2d). Separate tsconfig: the shim is a Node program (lib DOM + node-shims.d.ts), outside the workers tsconfig, so `task type-check` never sees it. This keeps it honest."
    cmds:
      - pnpm exec tsc -p tools/harness-shim/tsconfig.json
    sources:
      - tools/harness-shim/*.ts
      - tools/harness-shim/node-shims.d.ts
      - tools/harness-shim/tsconfig.json

  lint:bundle-isolation:
    desc: "Validate ADR-0013 substrate invariants on src/generated/cluster.ts + config.capnp (cloister-ac30e7 + cloister-cf519b) — globalOutbound scope, credential bindings, bundle tiers, orphan bindings. Reads cluster.ts via tsx (the canonical derived artifact per ADR-0025)."
    cmds:
      - "{{.NODE_TSX}} scripts/lint-bundle-isolation.mjs"
    sources:
      - src/generated/cluster.ts
      - config.capnp
      - scripts/lint-bundle-isolation.mjs

  lint:capability-scheme:
    desc: "ADR-0028 §6 lane discipline — fails if any [inputs.*].provides/requires value isn't cloister/<name>/v<n> shape (cloister-308ea4). Catches lane-1 URN / lane-2 WIMSE leakage into lane-3 slots. Reads cluster.ts via tsx."
    cmds:
      - "{{.NODE_TSX}} scripts/lint-capability-scheme.mjs"
    sources:
      - src/generated/cluster.ts
      - scripts/lint-capability-scheme.mjs

  lint:app-protocol:
    desc: "ADR-0030 §A4 hybrid namespace lint — fails if any cluster.toml [[edges]].appProtocol isn't substrate-blessed (art.*) or operator-extensible (x-<vendor>-*) shape (cloister-0fa3d7). Pattern mirrors lint:capability-scheme."
    cmds:
      - "{{.NODE_TSX}} scripts/lint-app-protocol.mjs"
    sources:
      - src/generated/cluster.ts
      - scripts/lint-app-protocol.mjs

  lint:tenant-docs:
    desc: "Drift gate for docs/tenants/ (cloister-c9df61) — asserts every tenant in cloister.capnp + every non-substrate service in cluster.compose.yaml has a matching docs/tenants/<name>.md page."
    cmds:
      - node scripts/lint-tenant-docs.mjs
    sources:
      - cloister.capnp
      - cluster.compose.yaml
      - docs/tenants/*.md
      - scripts/lint-tenant-docs.mjs

  lint:lockfile-drift:
    desc: "Drift gate for cluster.lock.toml — asserts every file:// input's committed sha256 still matches the bytes on disk. Catches the 2026-06-24 LLO-contract incident class where a vendored source advances but the lockfile stays pinned to the older digest, silently dropping advertised tools from src/generated/manifest.ts."
    cmds:
      - "{{.NODE_TSX}} scripts/lint-lockfile-drift.mjs"
    sources:
      - cluster.toml
      - cluster.lock.toml
      - scripts/lint-lockfile-drift.mjs

  lint:doc-links:
    desc: "Drift gate for markdown cross-references — asserts every relative link in docs/**/*.md + the canonical top-level docs (README, CHANGELOG, CLAUDE, AGENTS, GETTING-STARTED) resolves to an existing file. Skips code-block content (fenced + inline) so example snippets aren't false-flagged. Catches the PR-#94 class of bug where deleting a doc leaves dangling [foo](foo.md) refs in sibling pages."
    cmds:
      - node scripts/lint-doc-links.mjs
    sources:
      - "docs/**/*.md"
      - README.md
      - CHANGELOG.md
      - CLAUDE.md
      - AGENTS.md
      - GETTING-STARTED.md
      - scripts/lint-doc-links.mjs

  adr:index:
    desc: "Generate docs/adr/INDEX.md from each ADR's own frontmatter — the ADR index is DERIVED, never hand-maintained (cloister-1d2e0e). Design-status comes from the ADR; impl-status lives in beads + git, not here. Replaces the per-ADR status lists STATUS/README/CLAUDE hand-copied and let drift."
    cmds:
      - node scripts/gen-adr-index.mjs
    sources:
      - docs/adr/*.md
      - scripts/gen-adr-index.mjs
    generates:
      - docs/adr/INDEX.md

  adr:index:check:
    desc: "CI gate: fail if docs/adr/INDEX.md drifts from a fresh generation off the ADR frontmatter. Run `task adr:index` to regenerate. Replaces lint-doc-counts's ADR-count policing with generation."
    cmds:
      - node scripts/gen-adr-index.mjs --check

  lint:recipes:
    desc: "Phase 1 recipe smoke validation (cloister-449f82) — each recipes/<name>/ has README.md + (cloister.capnp OR cluster.toml); READMEs link to docs/reference/{bundle-topology,backend-kinds}.md per the canonical-link convention. Phase 2 will add capnp/TOML parse validation; Phase 3 will add local boot smoke. Invoked via tsx because lint-recipes.mjs transitively dynamic-imports cluster.zod.ts at runtime (per toml-to-cluster.mjs ADR-0025 Phase 1); plain `node` can't load .ts."
    cmds:
      - "{{.NODE_TSX}} scripts/lint-recipes.mjs"
    sources:
      - recipes/**/*
      - scripts/lint-recipes.mjs

  test:lint-scripts:
    desc: "Run node:test suites for lint + CLI scripts (cloister-ac30e7, cloister-ca1dab, cloister-addcdd, cloister-0d5e0f, cloister-9bfbf6, cloister-cf7a3b). Lives under scripts/test/ — node-native, NOT vitest (these tests shell out via child_process which workerd doesn't have). Also runs the nono harness-isolation suite (cloister-24717d; self-skips when the nono CLI is not installed) plus its outer-sandbox contract (cloister-6f7e77), which pins that an unwritable $HOME degrades to a scoped skip instead of taking the whole file down."
    cmds:
      - "{{.NODE_TSX}} --test scripts/test/lint-bundle-isolation.test.mjs scripts/test/cli-init.test.mjs scripts/test/cloister-cli.test.mjs scripts/test/emit-host-launch-plan.test.mjs scripts/test/init-krun-storage.test.mjs scripts/test/pull-inputs.test.mjs scripts/test/emit-workerd-config.test.mjs scripts/test/emit-compose.test.mjs scripts/test/done-runner.test.mjs scripts/test/gen-adr-index.test.mjs scripts/test/lint-recipes.test.mjs scripts/test/e2e-manifest-pipeline.test.mjs scripts/test/resolve-inputs.test.mjs scripts/test/lint-capability-scheme.test.mjs scripts/test/lint-app-protocol.test.mjs scripts/test/cli-add.test.mjs scripts/test/lint-vault-id-source.test.mjs scripts/test/lint-lockfile-drift.test.mjs scripts/test/lint-doc-links.test.mjs scripts/test/lint-lease-gate-source.test.mjs scripts/test/lint-silent-swallow.test.mjs scripts/test/lint-log-shape.test.mjs scripts/test/config-source-check.test.mjs scripts/test/lint-trust-env-locality.test.mjs scripts/test/lint-dev-escape.test.mjs scripts/test/capability-matchmaker.test.mjs scripts/test/git-hooks.test.mjs scripts/test/harness-targets.test.mjs scripts/test/lint-spec-citation.test.mjs scripts/test/build-manifest-row-shape.test.mjs scripts/test/lint-binding-parity.test.mjs scripts/test/lint-structured-parse.test.mjs scripts/test/fetch-schema-bridge.test.mjs scripts/test/gate-integrity.test.mjs scripts/test/type-duplication.test.mjs scripts/test/oci-artifact.test.mjs scripts/test/cargo-pins.test.mjs scripts/test/write-generated.test.mjs tools/harness-sandbox/test/nono-isolation.test.mjs tools/harness-sandbox/test/nono-isolation-outer-sandbox.test.mjs"
    # Content-hash cache. This suite tests the scripts + their fixtures + several
    # committed surfaces the tests read directly (git-hooks.test reads Taskfile.yml
    # + the hook; gen-adr-index reads docs/adr; lint-recipes reads recipes;
    # resolve/lockfile tests read cluster.toml/.lock; e2e reads the capnp schema).
    # Over-inclusive on purpose — a src/-only change skips this whole suite; any
    # change under a listed path re-runs it. CI cold-checkout always runs it.
    sources:
      - scripts/**/*.mjs
      - test/fixtures/**
      - tools/harness-sandbox/test/**/*.mjs
      - docs/adr/**/*.md
      - recipes/**
      - scripts/git-hooks/**
      - Taskfile.yml
      - cluster.toml
      - cluster.lock.toml
      - cloister.capnp
      - manifest/**/*.capnp

  init:
    desc: "Scaffold a starter cluster from a recipe (cloister-ca1dab). Usage: task init -- --recipe <name> --out <dir> [--port N]. Without args, prints --help."
    cmds:
      - node scripts/cli-init.mjs {{.CLI_ARGS | default "--help"}}

  add:
    desc: "Add an input to cluster.toml + resolve it into cluster.lock.toml (cloister-66b6a6 / ADR-0026 Phase 2). Usage: task add -- <ref> [--name N] [--version V] [--provides cap]... [--requires cap].... Supports file://, https://, github://owner/repo[/path]@<git-ref>."
    cmds:
      - "{{.NODE_TSX}} scripts/cli-add.mjs {{.CLI_ARGS | default \"--help\"}}"

  runtime:plan:
    desc: "Emit a digest-pinned cloister/host-runtime/v1 plan for one external bundle. Usage: task runtime:plan -- <bundle> --workspace /absolute/path [--output /absolute/plan.json]."
    cmds:
      - "node scripts/emit-host-launch-plan.mjs {{.CLI_ARGS | default \"--help\"}}"

  runtime:build:
    desc: "Build the native krunvm host-runtime binary."
    cmds:
      - task: rs:host-runtime:build

  runtime:doctor:
    desc: "Report krunvm/Buildah availability and bounded storage health."
    deps: [runtime:build]
    cmds:
      - "node scripts/cloister-cli.mjs runtime doctor"

  runtime:run:
    desc: "Run a digest-pinned host plan through krunvm. Usage: task runtime:run -- /absolute/plan.json. Depends on runtime:doctor (cloister-66f1ce) so a plan cannot launch against a host whose preconditions were never verified — doctor previously existed and was invoked by nothing."
    deps: [runtime:build, runtime:doctor]
    cmds:
      - "node scripts/cloister-cli.mjs runtime run {{.CLI_ARGS}}"

  runtime:storage:init:
    desc: "Create/attach one grow-on-demand case-sensitive sparsebundle for krunvm. Preview: task runtime:storage:init -- --print"
    cmds:
      - "node scripts/init-krun-storage.mjs {{.CLI_ARGS | default \"--help\"}}"

  runtime:storage:status:
    desc: "Report bounded krunvm storage use and tracked VM counts."
    deps: [runtime:build]
    cmds:
      - "node scripts/cloister-cli.mjs runtime storage status"

  runtime:storage:gc:
    desc: "Preview bounded krunvm reclamation; pass --yes to execute. Usage: task runtime:storage:gc -- --print"
    deps: [runtime:build]
    cmds:
      - "node scripts/cloister-cli.mjs runtime storage gc {{.CLI_ARGS | default \"--print\"}}"

  lint:
    desc: "Fast gate — tsc + worker tests + plugin tests + mermaid + paths + timing + bundle-isolation + tenant-docs + cluster-toml contracts + cargo-pin coherence (lint:cargo-pins) + cluster-zod runtime validation. Runs ≤2s. Use this in inner-loop dev. For Tier 1 integration (image builds + cluster boot), see `task cluster:test` (opt-in, slower)."
    # `cluster:zod:verify` runtime-validates cluster.ts against ClusterSchema.
    # Previously only in `task verify`; promoted to `task lint` after a
    # cedcf3 Phase 1 schema-change drifted past lint and only surfaced
    # under `task verify`. Inner-loop catches schema-vs-runtime drift now.
    deps: [type-check, test, mermaid:lint, lint:paths, lint:timing, lint:bundle-isolation, lint:capability-scheme, lint:app-protocol, lint:tenant-docs, lint:lockfile-drift, lint:doc-links, adr:index:check, lint:recipes, test:lint-scripts, test:cluster-toml, test:emit-cloister-capnp, lint:vault-id-source, lint:shim, lint:no-dev-mode, lint:lease-gate-source, lint:silent-swallow, lint:log-shape, lint:trust-env-locality, lint:dev-escape, lint:harness-target-literals, lint:spec-citation, lint:binding-parity, lint:structured-parse, config:check, cluster:zod:verify, identity:zod:check-drift, cluster:zod:check-drift, lint:cargo-pins, cluster:emit:check-drift, cluster:toml:roundtrip]

  verify:
    desc: Strict gate — `lint` + every external-process equivalence harness + Rust supply-chain audit + host-extras feature build + cluster.toml drift gate + cloister.capnp drift gate (cloister-345ad1). Slower (spawns capnp CLI + Node servers; runs cargo audit/deny + builds the nono closure); use in CI / pre-push.
    cmds:
      - task: lint
      - task: verify:strict

  verify:strict:
    desc: "Strict-only gates run after `lint`: external-process equivalence, stub smoke, Rust audit/host-extras, and generated drift checks."
    deps: [wire:verify-roundtrip, smoke:leyline-stub, rs:verify, harness:sandbox:build, cluster:toml:roundtrip, emit:cloister-capnp:drift]

  done:
    desc: "Pre-PR readiness gate (cloister-0d5e0f) — runs every drop-in rule under `done-rules/` (mache-smell-rules-shaped). Block-severity failures exit 1; warns pass. Adding a check is one JSON file; no Taskfile edit needed. Set DONE_RULES_DIR to override the rules dir."
    cmds:
      - node scripts/done-runner.mjs

  ci:
    desc: "Run the strict local CI gate once. `task verify` runs `task lint` first, then the strict-only extras, matching the main-push CI superset without running lint twice. Per cloister-8e40ad, `task lint` invokes `test:lint-scripts` which includes the e2e manifest pipeline (real fixture .capnp files driven through scripts/build-manifest.mjs, asserting happy + unhappy paths). Adding a new validator or schema invariant means adding a fixture here — never re-implementing the check in CI YAML."
    cmds:
      - 'echo "[ci] Running the exact gate CI runs. See .github/workflows/ci.yml for the workflow spec."'
      - task: verify

  pre-push:
    desc: "Pre-push gate — the strict verify gate, once. Wire into .git/hooks/pre-push via `task install-hooks` (or run `task pre-push` manually) to catch CI failures before the push, not after. Relies on Task's content-hash cache (`method: checksum`): an unchanged tree is a near-instant no-op, only changed tasks re-run. CI runs the same gate cold, so a cached local pass can't mask a real failure."
    deps: [verify]

  install-hooks:
    desc: "Symlink scripts/git-hooks/* into .git/hooks/. Run once per clone so the pre-push gate fires automatically before every `git push`. The hook runs `task pre-push` and trusts Task's content-hash cache (`method: checksum`) — an unchanged tree is a no-op; a real edit re-runs the affected task. (Content hashing replaced the old `--force` mtime-bypass, which was slow and only needed in the timestamp-cache era.)"
    cmds:
      - |
        set -e
        HOOK_DIR="$(git rev-parse --git-dir)/hooks"
        for hook in scripts/git-hooks/*; do
          name="$(basename "$hook")"
          target="$HOOK_DIR/$name"
          if [ -e "$target" ] && [ ! -L "$target" ]; then
            echo "▸ $target exists and is NOT a symlink — back it up + re-run, or move aside manually."
            exit 1
          fi
          ln -sf "$(pwd)/$hook" "$target"
          echo "▸ wired $target -> $hook"
        done
        echo "▸ done. Hooks fire on next git operation."

  smoke:
    desc: End-to-end smoke — spins up leyline + cloister, exercises the full chain
    cmds:
      - bash scripts/e2e-smoke.sh

  # ── OCI packaging (melange + apko) ───────────────────────────────────────
  #
  # `task apk:keygen` once, then `task image` whenever you want to rebuild.
  # Output: cloister.tar — an OCI image you can `docker load` or push.

  apk:keygen:
    desc: Generate the melange signing key (one-time setup)
    cmds:
      - melange keygen melange.rsa
    status:
      - test -f melange.rsa
      - test -f melange.rsa.pub

  apk:
    desc: Build cloister APK via melange (release-style, signed)
    deps: [apk:keygen]
    cmds:
      - mkdir -p ./packages
      - |
        melange build melange.yaml \
          --signing-key melange.rsa \
          --arch "$(uname -m | sed 's/aarch64/aarch64/;s/x86_64/x86_64/')" \
          --out-dir ./packages

  image:
    desc: Compose the cloister OCI image via apko (depends on `task apk`)
    deps: [apk]
    vars:
      # Default to the package version so `task cluster:up` (which references
      # `cloister:0.1.0` in cluster.compose.yaml) finds the freshly-built
      # image. Override with TAG=latest for ad-hoc local pushes.
      TAG: '{{.TAG | default "0.1.0"}}'
    cmds:
      # `task apk` only builds the host arch; apko.yaml's `archs: [x86_64,
      # aarch64]` is the release-shape declaration. Pass `--arch host` so
      # apko narrows to whatever the local melange step produced — keeps
      # local-dev images buildable without setting up cross-arch apks.
      # Multi-arch publishes still use apko's release pipeline (CI).
      - "apko build --arch \"$(uname -m | sed 's/arm64/aarch64/;s/amd64/x86_64/')\" apko.yaml cloister:{{.TAG}} cloister.tar --keyring-append melange.rsa.pub"
      - 'echo "Built cloister.tar — run \"task image:load\" to load+retag in one step (or do it manually: docker load < cloister.tar && docker tag cloister:{{.TAG}}-<arch> cloister:{{.TAG}})"'

  image:load:
    desc: "Build, load, and retag the cloister image so cluster.compose.yaml's bare TAG resolves (cloister-280136)"
    deps: [image]
    vars:
      TAG: '{{.TAG | default "0.1.0"}}'
    cmds:
      - "docker load < cloister.tar"
      # apko's docker-tar output is tagged `<image>:<TAG>-<arch>` (e.g.
      # `cloister:0.1.0-arm64`). cluster.compose.yaml references the
      # bare `cloister:0.1.0` — retag so it resolves on both arm and
      # x86 hosts without compose-file edits. Multi-arch publishes
      # via CI do their own manifest-list tagging; this is local-dev only.
      - |
        ARCH_SUFFIX="$(uname -m | sed 's/arm64/arm64/;s/x86_64/amd64/;s/aarch64/arm64/')"
        # apko's local-load tag uses the OS-arch convention, not Linux-arch
        SOURCE_TAG="cloister:{{.TAG}}-${ARCH_SUFFIX}"
        # Try common variants; the first one that exists wins.
        for candidate in "cloister:{{.TAG}}-arm64" "cloister:{{.TAG}}-amd64" "cloister:{{.TAG}}-aarch64" "cloister:{{.TAG}}-x86_64"; do
          if docker image inspect "$candidate" >/dev/null 2>&1; then
            docker tag "$candidate" "cloister:{{.TAG}}"
            echo "[image:load] tagged $candidate → cloister:{{.TAG}}"
            exit 0
          fi
        done
        echo "[image:load] FATAL: no arch-tagged cloister:{{.TAG}}-* image found after docker load" >&2
        echo "[image:load] available cloister:* images:" >&2
        docker images cloister --format '  {{`{{.Repository}}:{{.Tag}}`}}' >&2
        exit 1

  image:run:
    desc: "Build, load, and run the cloister OCI image locally (cloister-a3681d). One-stop for `I want to validate it works in the container` — chains image → image:load → docker run with /data/do as a named volume + 8787 forwarded. Foreground; Ctrl+C stops it. Extra args via `task image:run -- -d` pass through to `docker run` (-d to detach, --name foo, etc.)."
    deps: [image:load]
    vars:
      TAG: '{{.TAG | default "0.1.0"}}'
    cmds:
      # Foreground by default so operators see logs. The named volume
      # (cloister-do) keeps DO storage across runs; --rm cleans the
      # container itself. CLI_ARGS pass through to `docker run` so the
      # user can add -d, --env, --name, etc. without editing the Taskfile.
      - 'docker run --rm -p 8787:8787 -v cloister-do:/data/do {{.CLI_ARGS | default ""}} cloister:{{.TAG}}'

  image:check:
    desc: Validate melange.yaml + apko.yaml syntax without running a real build
    deps: [apk:keygen]
    cmds:
      # melange has no `lint` for YAML — `compile` parses the recipe end-to-end
      # and emits the resolved build script (--arch is required).
      - melange compile melange.yaml --arch "$(uname -m)" >/dev/null
      # apko equivalent: show-config resolves all packages + paths.
      - apko show-config apko.yaml >/dev/null

  registry:import:
    desc: "Import an OCI image tarball into the cluster's in-cluster registry (cloister-cabd57 Phase 1). Use --dry-run via env CLOISTER_DRY_RUN=1 to validate without uploading."
    cmds:
      - |
        if [ -z "${IMAGE:-}" ]; then
          echo "registry:import — set IMAGE=path/to/image.tar (e.g. cloister.tar from \`task image\`)" >&2
          exit 1
        fi
        DRY=""
        if [ "${CLOISTER_DRY_RUN:-0}" = "1" ]; then DRY="--dry-run"; fi
        REG="${CLOISTER_REGISTRY:-http://localhost:8787}"
        node scripts/import-image.mjs "$IMAGE" --registry "$REG" $DRY
