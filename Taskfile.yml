version: "3"

includes:
  rs:
    taskfile: ./rs/Taskfile.yml
    dir: ./rs
  # Recipe tasks live in recipes/Taskfile.yml — the root stays an index.
  recipes:
    taskfile: ./recipes/Taskfile.yml
    dir: ./recipes
  # The dolt-grpc-demo image rail (cloister-2af014): `task demo:images:check`.
  demo:
    taskfile: ./tools/dolt-grpc-demo/Taskfile.yml
    dir: ./tools/dolt-grpc-demo

  # lint/, gen/ and dev/ own their tasks. The keys end in -tasks so none reads
  # as a task name (`lint` and `dev` are tasks). `flatten` keeps every task's name as
  # it was (`task lint:doc-links`, `task manifest`, `task smoke`), so nothing
  # that calls a task changed when they moved out of this file.
  lint-tasks:
    taskfile: ./lint/Taskfile.yml
    flatten: true
  gen-tasks:
    taskfile: ./gen/Taskfile.yml
    flatten: true
  dev-tasks:
    taskfile: ./dev/Taskfile.yml
    flatten: true

vars:
  # Use tsx as a Node loader instead of the tsx CLI. The CLI opens an IPC
  # pipe even for simple script runs, which fails in sandboxed local flows.
  NODE_TSX: node --import tsx

tasks:
  deps:node:
    desc: "Install Node dependencies from pnpm-lock.yaml. CI and local bootstrap use this; verification gates assume deps are already present and stay offline."
    cmds:
      # `task install` is also used from non-interactive shells and fresh
      # machines. pnpm otherwise aborts before replacing a stale
      # node_modules directory when no TTY is available.
      - CI=true pnpm install --frozen-lockfile
    sources:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
    generates:
      - node_modules/.modules.yaml

  build:
    desc: Bundle Worker for Cloudflare / wrangler dev
    deps: [manifest]
    cmds:
      - pnpm exec wrangler build
    sources:
      - src/**/*.ts
      - tsconfig.json
    generates:
      - .wrangler/tmp/build-*/index.js

  harness:sandbox:build:
    desc: "Build the cloister-harness confinement binary (S1). Gate: a nono API bump or a bad edit fails here instead of silently breaking `SANDBOX=nono task harness:dev`. Builds the nono (Seatbelt/Landlock) + sigstore closure into ITS OWN target dir (tools/harness-sandbox/target) — NOT shared with rs/target's host-extras nono build, since cargo namespaces compiled artifacts per target dir. CI caches tools/harness-sandbox/target separately (ci.yml) so a warm run is fast; cold is ~4min. Wired into `verify:strict`."
    dir: tools/harness-sandbox
    cmds:
      - cargo build --release
    sources:
      - src/**/*.rs
      - Cargo.toml
      - Cargo.lock
    generates:
      - target/release/cloister-harness

  # `spike:libkrun` + `spike:libkrun:mediated` lived here and are DELETED with
  # tools/libkrun-spike (cloister-5624e8). They proved ADR-0044/0046's
  # mediate-below-stock-libkrun thesis on demand, and that proof has moved: LLO
  # embeds libkrun via FFI (ley-line-open-f839c1) rather than booting it from a
  # shell script, and ley-line-open-984acf ships the entitled macOS worker.
  # ADR-0049's 2026-07-31 amendment is the decision — cloister keeps policy,
  # authorization, audit and the CLI; LLO owns the execution runtime. Do not
  # re-add a spike here; extend LLO's backend and consume it over execution/v1.

  cluster:emit:
    desc: "Generate every committed cluster artifact from cluster.toml through the Cloister CLI."
    cmds:
      - node bin/cloister.mjs cluster generate --dir .
    sources:
      - cluster.toml
      - cluster.lock.toml
      - cli/lib/cluster/**/*.mjs
    generates:
      - src/generated/cluster.ts
      - cloister.capnp
      - cluster.compose.yaml

  # ── cluster.toml source of truth (ADR-0025, cloister-ae06f3) ──────────────
  #
  # `cloister cluster generate` owns the forward transaction: it reads and
  # validates cluster.toml once, then atomically updates every committed
  # projection. Task targets are aliases, not an independent pipeline.
  #
  # `cluster:toml:export` is a repository-only reverse export for migration
  # and diagnosis. It is not part of ordinary generation.
  cluster:toml:
    desc: "Operator workflow alias — generate canonical cluster.toml and every projection through the Cloister CLI."
    cmds:
      - node bin/cloister.mjs cluster generate --dir .
    sources:
      - cluster.toml
      - cluster.lock.toml
      - cli/lib/cluster/**/*.mjs
      - src/generated/cluster.zod.ts
    generates:
      - src/generated/cluster.ts
      - cloister.capnp
      - cluster.compose.yaml

  cluster:toml:export:
    desc: "Reverse leg — render canonical TOML from src/generated/cluster.ts. Writes to stdout; pass `-- --write <path>` to land at a file."
    cmds:
      - "{{.NODE_TSX}} cli/lib/cluster/cluster-to-toml.mjs {{.CLI_ARGS}}"
    sources:
      - src/generated/cluster.ts
      - cli/lib/cluster/cluster-to-toml.mjs
      - cli/lib/cluster/cluster-to-toml.mjs

  cluster:toml:roundtrip:
    desc: "Compatibility name for the first-party no-write generation check. Verifies every committed projection matches cluster.toml."
    cmds:
      - node bin/cloister.mjs cluster generate --check --dir .

  test:cluster-toml:
    desc: "Bidi TOML pipeline contract tests (cloister-ae06f3) — node:test under tsx loader so the product cluster library can import src/generated/cluster.zod.ts."
    cmds:
      - "{{.NODE_TSX}} --test cli/test/cluster/cluster-toml-roundtrip.test.mjs"
    sources:
      - cli/test/cluster/cluster-toml-roundtrip.test.mjs
      - cli/lib/cluster/toml-to-cluster.mjs
      - cli/lib/cluster/cluster-to-toml.mjs
      - src/generated/cluster.zod.ts

  test:artifacts:
    desc: "ADR-0067 L1 — every registered artifact validates against its VENDORED schema and matches its committed golden. Portable: no sibling checkout needed, which is the point — the strongest confinement check before this was local-only and therefore absent from the machine where drift would go unnoticed."
    cmds:
      - "{{.NODE_TSX}} --test dev/test/artifact-conformance.test.mjs"
    sources:
      - dev/artifact-registry.mjs
      - gen/lib/json-schema-subset.mjs
      - dev/test/artifact-conformance.test.mjs
      - cli/lib/harness/launch.mjs
      - test/fixtures/llo-confinement-v1/*
      - test/fixtures/golden/*

  test:harness-shim:
    desc: "harness-shim CertSource contract (cloister-f2338f) — node:test under tsx, NOT vitest: the shim is a host-side Node program and the vitest suite runs inside workerd, where node:http.createServer is not implemented."
    cmds:
      - "{{.NODE_TSX}} --test lint/test/harness-shim-cert-source.test.mjs"
    sources:
      - lint/test/harness-shim-cert-source.test.mjs
      - src/harness-shim/index.ts
      - src/harness-shim/lease-signer.ts

  emit:cloister-capnp:
    desc: "Compatibility alias — generate cloister.capnp and the other cluster.toml projections through the Cloister CLI."
    cmds:
      - node bin/cloister.mjs cluster generate --dir .
    sources:
      - cluster.toml
      - cluster.lock.toml
      - cli/lib/cluster/emit-cloister-capnp.mjs
      - cli/lib/cluster/toml-to-cluster.mjs
    generates:
      - cloister.capnp

  emit:cloister-capnp:drift:
    desc: "Compatibility name for the first-party no-write generation check. Verifies cloister.capnp and the other cluster.toml projections."
    cmds:
      - node bin/cloister.mjs cluster generate --check --dir .

  test:emit-cloister-capnp:
    desc: "Phase 2 of cloister-345ad1 — contract tests for the product-owned capnp renderer."
    cmds:
      - "{{.NODE_TSX}} --test cli/test/cluster/emit-cloister-capnp.test.mjs"
    sources:
      - cli/test/cluster/emit-cloister-capnp.test.mjs
      - cli/lib/cluster/emit-cloister-capnp.mjs
      - cli/lib/cluster/toml-to-cluster.mjs

  cluster:resolve:
    desc: "ADR-0026 Phase 1b — resolve cluster.toml [inputs.*] refs (file://, https://) + write cluster.lock.toml with content-addressed digests. Operator runs this after editing cluster.toml; commits both files. Per cloister-cf7a3b."
    cmds:
      - node bin/cloister.mjs cluster resolve --dir .
    sources:
      - cluster.toml
      - cli/lib/cluster/resolve-inputs.mjs
    generates:
      - cluster.lock.toml

  inputs:pull:
    desc: "ADR-0026 Phase 1c — preview and explicitly acquire the OCI images pinned by cluster.lock.toml. Interactive runs ask confirmation; automation passes --yes. Mutable refs are rejected unless --allow-unpinned is separately acknowledged. `task inputs:pull -- --print` previews without pulling."
    cmds:
      - node bin/cloister.mjs artifacts pull {{.CLI_ARGS}}
    sources:
      - cluster.lock.toml
      - cli/commands/artifacts-pull.mjs
      - cli/lib/oci-artifact.mjs

  cluster:up:
    desc: "Run the cluster locally via nerdctl/podman/docker compose. Delegates to `cloister cluster up` — the SAME verb a scaffolded cluster uses, so this repo's cluster and one you own behave identically. Runtime detection and COMPOSE_CMD live in the CLI, not here."
    deps: [cluster:emit]
    cmds:
      - node bin/cloister.mjs cluster up --dir . {{.CLI_ARGS}}

  cluster:down:
    desc: "Tear down the local cluster (preserves volumes — pass `-- --destroy` to also remove them). Delegates to `cloister cluster down`; DESTROY=1 still works via the shim below for muscle memory."
    cmds:
      - |
        ARGS="{{.CLI_ARGS}}"
        # DESTROY=1 predates the flag and is kept working rather than broken:
        # an operator who learned it should not discover the change by having a
        # teardown silently NOT destroy what they expected.
        if [ "${DESTROY:-0}" = "1" ]; then ARGS="$ARGS --destroy"; fi
        exec node bin/cloister.mjs cluster down --dir . $ARGS

  cluster:test:
    desc: "Tier 1 integration matrix (cloister-1b1124) — builds + smokes all 5 sibling OCI images then boots cluster.capnp via task cluster:up. Opt-in, not part of `task lint`. ~5-10 min cold; SKIP_BUILDS=1 reuses loaded images. See dev/integration-test.sh."
    cmds:
      - bash dev/integration-test.sh

  test:
    # `llo:wasm` is required because src/wire/signet-verify.ts imports
    # rs/target/llo-wasm/leyline_sign.wasm; without it vitest-pool-workers
    # fails every test file at module init. It is LLO's published release
    # asset, digest-pinned in schema-bridge.lock.json — no longer compiled
    # here (cloister-dbe9c3).
    #
    # `rs:sign:host` runs the host-binary integration + adversarial test
    # suites (cloister-99165e, ADR-0019). Wired into `task test` so the
    # threat-model §15 adversarial tests (upstream in LLO at
    # `rs/ll-open/sign/tests/host_adversarial.rs`) block CI when red.
    # The tests pin invariants from the trust-root-friend pre-merge
    # review (adversarial-cycle 2026-05-12); they are the spec of
    # correct behavior. Without this wire-up, the failing tests don't
    # gate the merge — which defeats the entire point of the gate.
    desc: Run tests inside workerd (real DOs, real SQLite)
    deps: [manifest, rs:test, llo:wasm]
    cmds:
      - pnpm exec vitest run
    # Content-hash cache (Task `method: checksum`): skip the workerd suite when
    # none of its inputs changed. The invalidation set is deliberately broad —
    # the code under test, the tests, the vitest/miniflare config surface
    # (vitest.config.ts reads wrangler.toml), the generated manifest (src/generated
    # is under src/**), the capnp schema, and the wasm the suite loads at module
    # init. Over-inclusive by design: a listed-but-irrelevant change just re-runs
    # the suite; a real change is never missed. CI runs on a fresh checkout with a
    # cold cache, so it always executes the full suite regardless (cloister-8e40ad).
    #
    # The dependency tree is part of the system under test, not just its build
    # input: vitest-pool-workers runs the suite THROUGH miniflare, so a bump to
    # miniflare or anything beneath it changes what the tests actually exercise.
    # package.json alone misses that — pnpm 10 declares overrides in
    # pnpm-workspace.yaml, and a transitive bump moves only the lockfile. Found
    # by the CVE-2026-48779 ws override, which reported "up to date" and skipped
    # the whole suite on the one change that most needed running (cloister-035655).
    sources:
      - src/**/*.ts
      - test/**/*.ts
      - vitest.config.ts
      - wrangler.toml
      - config.capnp
      - tsconfig.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - manifest/**/*.capnp
      - rs/target/llo-wasm/leyline_sign.wasm

  test:watch:
    desc: Watch mode
    deps: [manifest, llo:wasm]
    cmds:
      - pnpm exec vitest

  type-check:
    desc: TypeScript type check (no emit)
    deps: [manifest]
    cmds:
      - pnpm exec tsc --noEmit
    # Content-hash cache (Task `method: checksum`, the v3 default): re-check only
    # when a compiled input actually changes. tsc --noEmit follows tsconfig.json;
    # the globs below are generous on purpose (over-inclusive is safe — it can
    # only cause an unnecessary re-run, never a missed one). cloister-8e40ad.
    #
    # The resolved dependency tree is a compiled input: tsc reads .d.ts files out
    # of node_modules, so a version bump changes the types being checked without
    # touching a single source file. package.json alone does NOT capture that —
    # pnpm 10 declares overrides in pnpm-workspace.yaml, and a transitive bump
    # moves only the lockfile. Both are listed so a dependency-only change cannot
    # pass this gate vacuously (cloister-035655).
    sources:
      - src/**/*.ts
      - test/**/*.ts
      - tsconfig.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

  install:
    desc: "Install Cloister, its locked Node dependencies, and the experimental compatibility runtime through the first-party CLI."
    cmds:
      - node bin/cloister.mjs install

  test:install:image:
    desc: "Prove the documented first install and Linux confinement boundary in a cache-free image."
    cmds:
      - docker build --file test/install-image/Dockerfile --tag cloister-install-test:local .

  uninstall:
    desc: "Remove only this checkout's installed Cloister command. Keeps runtime files for safety."
    cmds:
      - node bin/cloister.mjs uninstall

  dev:bootstrap:
    desc: "Alias for `cloister dev bootstrap`. Generates the gitignored local development environment."
    cmds:
      - node bin/cloister.mjs dev bootstrap

  dev:
    desc: "Alias for `cloister dev serve`. Starts the local Worker on :8787."
    cmds:
      - node bin/cloister.mjs dev serve

  serve:local:
    desc: Run via workerd directly (requires build:local first)
    cmds:
      - npx workerd serve dist/config.capnp --experimental

  test:harness-binary:
    desc: "Kernel-confinement tests for the cloister-harness BINARY — the artifact that actually ships (cloister-e22a56). Distinct from `nono-isolation`, which drives the `nono` CLI: that is a different artifact at a different version, so it says nothing about the library pinned in tools/harness-sandbox/Cargo.toml. Measured: the installed CLI was 0.56.0 while the pin moved to 0.70, and the CLI suite stayed green throughout. DEPENDS on harness:sandbox:build so the binary exists — wiring this into `lint` instead would make it skip forever, because `lint` is ordered before the build."
    deps: [harness:sandbox:build]
    cmds:
      - node --test tools/harness-sandbox/test/cloister-harness-binary.test.mjs
    sources:
      - tools/harness-sandbox/src/main.rs
      - tools/harness-sandbox/Cargo.toml
      - tools/harness-sandbox/test/cloister-harness-binary.test.mjs

  harness:dev:
    desc: "Compatibility alias for `cloister run --repo $PWD`. Prefer `--harness`; `--target` remains accepted with a warning."
    cmds:
      - node bin/cloister.mjs run --repo "$PWD" {{.CLI_ARGS}}

  harness:dev:setup:
    desc: "Compatibility alias for setup-only `cloister run`."
    cmds:
      - node bin/cloister.mjs run --repo "$PWD" --setup-only {{.CLI_ARGS}}

  cluster:emit:check-drift:
    desc: "First-party no-write generation check for cluster.compose.yaml and every other committed cluster.toml projection."
    cmds:
      - node bin/cloister.mjs cluster generate --check --dir .

  test:lint-scripts:
    desc: "Run node:test suites for lint + CLI scripts (cloister-ac30e7, cloister-ca1dab, cloister-addcdd, cloister-0d5e0f, cloister-9bfbf6, cloister-cf7a3b). Each area keeps its tests beside it (cli/test, lint/test, gen/test, dev/test) — node-native, NOT vitest (these tests shell out via child_process which workerd doesn't have). Also runs the nono harness-isolation suite (cloister-24717d; self-skips when the nono CLI is not installed) plus its outer-sandbox contract (cloister-6f7e77), which pins that an unwritable $HOME degrades to a scoped skip instead of taking the whole file down."
    cmds:
      - node bin/cloister.mjs dev test --dir .
    # Content-hash cache. This suite tests the CLI, rails and generators + their fixtures + several
    # committed surfaces the tests read directly (git-hooks.test reads Taskfile.yml
    # + the hook; gen-adr-index reads docs/adr; lint-recipes reads recipes;
    # resolve/lockfile tests read cluster.toml/.lock; e2e reads the capnp schema).
    # Over-inclusive on purpose — a src/-only change skips this whole suite; any
    # change under a listed path re-runs it. CI cold-checkout always runs it.
    sources:
      - cli/**/*.mjs
      - lint/**/*.mjs
      - gen/**/*.mjs
      - dev/**/*.mjs
      - test/fixtures/**
      - tools/harness-sandbox/test/**/*.mjs
      # The demo's cluster.toml + committed cluster.lock.toml (cloister-2af014),
      # which cluster-up and demo-locks tests read.
      - tools/dolt-grpc-demo/**/*.toml
      - tools/dolt-grpc-demo/**/*.sh
      - tools/dolt-grpc-demo/microvm/apko-*.yaml
      - tools/dolt-grpc-demo/k8s/*.yaml
      - docs/adr/**/*.md
      - recipes/**
      - dev/git-hooks/**
      - src/generated/llo-execution-tools.json
      - llo-execution-contract.lock.json
      - Taskfile.yml
      - lint/Taskfile.yml
      - gen/Taskfile.yml
      - dev/Taskfile.yml
      - cluster.toml
      - cluster.lock.toml
      - cloister.capnp
      - manifest/**/*.capnp

  init:
    desc: "Scaffold a starter cluster from a recipe (cloister-ca1dab). Usage: task init -- --recipe <name> --out <dir> [--port N]. Without args, prints --help."
    cmds:
      - node bin/cloister.mjs init {{.CLI_ARGS | default "--help"}}

  add:
    desc: "Add an input to cluster.toml + resolve it into cluster.lock.toml (cloister-66b6a6 / ADR-0026 Phase 2). Usage: task add -- <ref> [--name N] [--version V] [--provides cap]... [--requires cap].... Supports file://, https://, github://owner/repo[/path]@<git-ref>."
    cmds:
      - "node bin/cloister.mjs add {{.CLI_ARGS | default \"--help\"}}"

  runtime:plan:
    desc: "Emit a digest-pinned cloister/host-runtime/v1 plan for one external bundle. Usage: task runtime:plan -- <bundle> --workspace /absolute/path [--output /absolute/plan.json]."
    cmds:
      - "node bin/cloister.mjs runtime plan {{.CLI_ARGS | default \"--help\"}}"

  runtime:build:
    desc: "Compatibility alias: install the named, digest-checked experimental execution runtime."
    cmds:
      - node bin/cloister.mjs runtime install

  runtime:doctor:
    desc: "Report the selected runtime provider, its maturity, prerequisites, and storage health without installing or changing anything."
    cmds:
      - "node bin/cloister.mjs runtime doctor {{.CLI_ARGS}}"

  runtime:run:
    desc: "Run a digest-pinned host plan through the selected runtime provider. Usage: task runtime:run -- /absolute/plan.json."
    cmds:
      - "node bin/cloister.mjs runtime run {{.CLI_ARGS}}"

  runtime:storage:init:
    desc: "Provision execution storage through the LLO provider (needs CLOISTER_LLO_CONTROL_SOCKET). The compatibility provider has no storage step: `cloister runtime install` creates its microVM store."
    cmds:
      - "node bin/cloister.mjs runtime storage init {{.CLI_ARGS | default \"--help\"}}"

  runtime:storage:status:
    desc: "Read the selected provider's storage readiness without changing it."
    cmds:
      - "node bin/cloister.mjs runtime storage status {{.CLI_ARGS}}"

  lint:
    desc: "Fast gate — tsc + worker tests + plugin tests + mermaid + paths + timing + bundle-isolation + tenant-docs + cluster-toml contracts + upstream-pin coherence (lint:upstream-pins) + cluster-zod runtime validation. Runs ≤2s. Use this in inner-loop dev. For Tier 1 integration (image builds + cluster boot), see `task cluster:test` (opt-in, slower)."
    # `cluster:zod:verify` runtime-validates cluster.ts against ClusterSchema.
    # Previously only in `task verify`; promoted to `task lint` after a
    # cedcf3 Phase 1 schema-change drifted past lint and only surfaced
    # under `task verify`. Inner-loop catches schema-vs-runtime drift now.
    deps: [type-check, test, mermaid:lint, lint:paths, lint:timing, lint:bundle-isolation, lint:capability-scheme, lint:app-protocol, lint:tenant-docs, lint:lockfile-drift, lint:doc-links, adr:index:check, lint:recipes, test:lint-scripts, test:cluster-toml, test:harness-shim, test:artifacts, test:emit-cloister-capnp, lint:vault-id-source, lint:shim, lint:no-dev-mode, lint:schema-claim, lint:lease-gate-source, lint:silent-swallow, lint:log-shape, lint:trust-env-locality, lint:dev-escape, lint:harness-target-literals, lint:spec-citation, lint:sibling-bead-refs, lint:smell-rule-kinship, lint:binding-parity, lint:conflict-markers, lint:structured-parse, lint:origin-derivation, config:check, cluster:zod:verify, identity:zod:check-drift, cluster:zod:check-drift, cloister:zod:check-drift, lint:upstream-pins, cluster:emit:check-drift, cluster:toml:roundtrip, cluster:jsonschema:check-drift, cluster:toml:schema:check, cli:docs:check, lint:harness-types]

  verify:
    desc: Strict gate — `lint` + every external-process equivalence harness + Rust supply-chain audit + host-extras feature build + cluster.toml drift gate + cloister.capnp drift gate (cloister-345ad1). Slower (spawns capnp CLI + Node servers; runs cargo audit/deny + builds the nono closure); use in CI / pre-push.
    cmds:
      - task: lint
      - task: verify:strict

  verify:strict:
    desc: "Strict-only gates run after `lint`: external-process equivalence, stub smoke, Rust audit/host-extras, and generated drift checks."
    deps: [wire:verify-roundtrip, smoke:leyline-stub, rs:verify, harness:sandbox:build, test:harness-binary, cluster:toml:roundtrip, emit:cloister-capnp:drift]

  ci:
    desc: "Run the strict local CI gate once. `task verify` runs `task lint` first, then the strict-only extras, matching the main-push CI superset without running lint twice. Per cloister-8e40ad, `task lint` invokes `test:lint-scripts` which includes the e2e manifest pipeline (real fixture .capnp files driven through gen/build-manifest.mjs, asserting happy + unhappy paths). Adding a new validator or schema invariant means adding a fixture here — never re-implementing the check in CI YAML."
    cmds:
      - 'echo "[ci] Running the exact gate CI runs. See .github/workflows/ci.yml for the workflow spec."'
      - task: verify

  pre-push:
    desc: "Pre-push gate — the strict verify gate, once. Wire into .git/hooks/pre-push via `task install-hooks` (or run `task pre-push` manually) to catch CI failures before the push, not after. Relies on Task's content-hash cache (`method: checksum`): an unchanged tree is a near-instant no-op, only changed tasks re-run. CI runs the same gate cold, so a cached local pass can't mask a real failure."
    deps: [verify]

  install-hooks:
    desc: "Symlink dev/git-hooks/* into .git/hooks/. Run once per clone so the pre-push gate fires automatically before every `git push`. The hook runs `task pre-push` and trusts Task's content-hash cache (`method: checksum`) — an unchanged tree is a no-op; a real edit re-runs the affected task. (Content hashing replaced the old `--force` mtime-bypass, which was slow and only needed in the timestamp-cache era.)"
    cmds:
      - |
        set -e
        HOOK_DIR="$(git rev-parse --git-dir)/hooks"
        for hook in dev/git-hooks/*; do
          name="$(basename "$hook")"
          target="$HOOK_DIR/$name"
          if [ -e "$target" ] && [ ! -L "$target" ]; then
            echo "▸ $target exists and is NOT a symlink — back it up + re-run, or move aside manually."
            exit 1
          fi
          ln -sf "$(pwd)/$hook" "$target"
          echo "▸ wired $target -> $hook"
        done
        echo "▸ done. Hooks fire on next git operation."
