    # suites (cloister-99165e, ADR-0019). Wired into `task test` so the
    # threat-model §15 adversarial tests at
    # `rs/crates/sign/tests/host_adversarial.rs` block CI when red. The
    # tests pin invariants from the trust-root-friend pre-merge review
    # (adversarial-cycle 2026-05-12); they are the spec of correct
    # behavior. Without this wire-up, the failing tests don't gate the
