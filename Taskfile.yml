  add:
    desc: "Add an input to cluster.toml + resolve it into cluster.lock.toml (cloister-66b6a6 / ADR-0026 Phase 2). Usage: task add -- <ref> [--name N] [--version V] [--provides cap]... [--requires cap].... Supports file://, https://, github://owner/repo[/path]@<git-ref>."
    cmds:
      - pnpm exec tsx scripts/cli-add.mjs {{.CLI_ARGS | default "--help"}}

  lint:
    desc: "Fast gate — tsc + worker tests + plugin tests + mermaid + paths + timing + bundle-isolation + tenant-docs + cluster-toml contracts + cargo-pin lint + cluster-zod runtime validation. Runs ≤2s. Use this in inner-loop dev. For Tier 1 integration (image builds + cluster boot), see `task cluster:test` (opt-in, slower)."
    # `cluster:zod:verify` runtime-validates cluster.ts against ClusterSchema.
    # Previously only in `task verify`; promoted to `task lint` after a
    # cedcf3 Phase 1 schema-change drifted past lint and only surfaced
    # under `task verify`. Inner-loop catches schema-vs-runtime drift now.
    deps: [type-check, test, test:plugin, mermaid:lint, lint:paths, lint:timing, lint:bundle-isolation, lint:capability-scheme, lint:capability-mapping-coverage, lint:app-protocol, lint:tenant-docs, lint:lockfile-drift, lint:doc-links, lint:doc-counts, lint:recipes, test:lint-scripts, test:cluster-toml, test:emit-cloister-capnp, lint:cargo-pins, lint:vault-id-source, cluster:zod:verify]

  verify:cred-iso-conformance:
    desc: "Run cloister/credential-isolation/v1 Python ref-impl conformance vectors (cloister-138082, cred-iso audit R-3). Asserts byte-equality between the Python reference and the pinned test vectors. Stdlib-only — no deps to install. A divergence between Python and any other implementation (TS, Rust, Go) is a finding worth a bead; do NOT auto-fix the Python to match — the spec is the contract."
    dir: cloister-spec/credential-isolation/v1/ref-impl-py
    cmds:
      - python3 conformance/run.py
    sources:
      - cloister-spec/credential-isolation/v1/ref-impl-py/credisolation/*.py
      - cloister-spec/credential-isolation/v1/ref-impl-py/conformance/run.py
      - cloister-spec/credential-isolation/v1/test-vectors/*.json

  verify:
    desc: Strict gate — `lint` + every external-process equivalence harness + Rust supply-chain audit + host-extras feature build + cluster.toml drift gate + cloister.capnp drift gate (cloister-345ad1). Slower (spawns capnp CLI + Node servers; runs cargo audit/deny + builds the nono closure); use in CI / pre-push.
    deps: [lint, wire:verify-roundtrip, smoke:leyline-stub, rs:audit, rs:sign:host-extras, cluster:toml:roundtrip, emit:cloister-capnp:drift, verify:cred-iso-conformance]

  done:
    desc: "Pre-PR readiness gate (cloister-0d5e0f) — runs every drop-in rule under `done-rules/` (mache-smell-rules-shaped). Block-severity failures exit 1; warns pass. Adding a check is one JSON file; no Taskfile edit needed. Set DONE_RULES_DIR to override the rules dir."
    cmds:
      - node scripts/done-runner.mjs

  ci:
    desc: "Run the strict local CI gate once. `task verify` already depends on `task lint`, matching the main-push CI superset without running lint twice. Per cloister-8e40ad, `task lint` invokes `test:lint-scripts` which includes the e2e manifest pipeline (real fixture .capnp files driven through scripts/build-manifest.mjs, asserting happy + unhappy paths). Adding a new validator or schema invariant means adding a fixture here — never re-implementing the check in CI YAML."
    cmds:
      - 'echo "[ci] Running the exact gate CI runs. See .github/workflows/ci.yml for the workflow spec."'
      - task: verify

  pre-push:
    desc: "Pre-push gate — strict verify once, with hook-level Taskfile cache bypass. Wire into .git/hooks/pre-push via `task install-hooks` (or run `task pre-push` manually) to catch CI failures before the push, not after."
    deps: [verify]

  install-hooks:
    desc: "Symlink scripts/git-hooks/* into .git/hooks/. Run once per clone so the pre-push gate fires automatically before every `git push`. The hook itself bypasses Taskfile mtime caching via `task --force pre-push` so test logic changes can't silently slip through when sources haven't visibly changed."
    cmds:
      - |
        set -e
        HOOK_DIR="$(git rev-parse --git-dir)/hooks"
        for hook in scripts/git-hooks/*; do
          name="$(basename "$hook")"
          target="$HOOK_DIR/$name"
          if [ -e "$target" ] && [ ! -L "$target" ]; then
            echo "▸ $target exists and is NOT a symlink — back it up + re-run, or move aside manually."
            exit 1
          fi
          ln -sf "$(pwd)/$hook" "$target"
          echo "▸ wired $target -> $hook"
        done
        echo "▸ done. Hooks fire on next git operation."

  smoke:
    desc: End-to-end smoke — spins up leyline + cloister, exercises the full chain
    cmds:
      - bash scripts/e2e-smoke.sh

  # ── OCI packaging (melange + apko) ───────────────────────────────────────
  #
  # `task apk:keygen` once, then `task image` whenever you want to rebuild.
  # Output: cloister.tar — an OCI image you can `docker load` or push.

  apk:keygen:
    desc: Generate the melange signing key (one-time setup)
    cmds:
      - melange keygen melange.rsa
    status:
      - test -f melange.rsa
      - test -f melange.rsa.pub

  apk:
    desc: Build cloister APK via melange (release-style, signed)
    deps: [apk:keygen]
    cmds:
      - mkdir -p ./packages
      - |
        melange build melange.yaml \
          --signing-key melange.rsa \
          --arch "$(uname -m | sed 's/aarch64/aarch64/;s/x86_64/x86_64/')" \
          --out-dir ./packages

  image:
    desc: Compose the cloister OCI image via apko (depends on `task apk`)
    deps: [apk]
    vars:
      # Default to the package version so `task cluster:up` (which references
      # `cloister:0.1.0` in cluster.compose.yaml) finds the freshly-built
      # image. Override with TAG=latest for ad-hoc local pushes.
      TAG: '{{.TAG | default "0.1.0"}}'
    cmds:
      # `task apk` only builds the host arch; apko.yaml's `archs: [x86_64,
      # aarch64]` is the release-shape declaration. Pass `--arch host` so
      # apko narrows to whatever the local melange step produced — keeps
      # local-dev images buildable without setting up cross-arch apks.
      # Multi-arch publishes still use apko's release pipeline (CI).
      - "apko build --arch \"$(uname -m | sed 's/arm64/aarch64/;s/amd64/x86_64/')\" apko.yaml cloister:{{.TAG}} cloister.tar --keyring-append melange.rsa.pub"
      - 'echo "Built cloister.tar — run \"task image:load\" to load+retag in one step (or do it manually: docker load < cloister.tar && docker tag cloister:{{.TAG}}-<arch> cloister:{{.TAG}})"'

  image:load:
    desc: "Build, load, and retag the cloister image so cluster.compose.yaml's bare TAG resolves (cloister-280136)"
    deps: [image]
    vars:
      TAG: '{{.TAG | default "0.1.0"}}'
    cmds:
      - "docker load < cloister.tar"
      # apko's docker-tar output is tagged `<image>:<TAG>-<arch>` (e.g.
      # `cloister:0.1.0-arm64`). cluster.compose.yaml references the
      # bare `cloister:0.1.0` — retag so it resolves on both arm and
      # x86 hosts without compose-file edits. Multi-arch publishes
      # via CI do their own manifest-list tagging; this is local-dev only.
      - |
        ARCH_SUFFIX="$(uname -m | sed 's/arm64/arm64/;s/x86_64/amd64/;s/aarch64/arm64/')"
        # apko's local-load tag uses the OS-arch convention, not Linux-arch
        SOURCE_TAG="cloister:{{.TAG}}-${ARCH_SUFFIX}"
        # Try common variants; the first one that exists wins.
        for candidate in "cloister:{{.TAG}}-arm64" "cloister:{{.TAG}}-amd64" "cloister:{{.TAG}}-aarch64" "cloister:{{.TAG}}-x86_64"; do
          if docker image inspect "$candidate" >/dev/null 2>&1; then
            docker tag "$candidate" "cloister:{{.TAG}}"
            echo "[image:load] tagged $candidate → cloister:{{.TAG}}"
            exit 0
          fi
        done
        echo "[image:load] FATAL: no arch-tagged cloister:{{.TAG}}-* image found after docker load" >&2
        echo "[image:load] available cloister:* images:" >&2
        docker images cloister --format '  {{`{{.Repository}}:{{.Tag}}`}}' >&2
        exit 1

  image:run:
    desc: "Build, load, and run the cloister OCI image locally (cloister-a3681d). One-stop for `I want to validate it works in the container` — chains image → image:load → docker run with /data/do as a named volume + 8787 forwarded. Foreground; Ctrl+C stops it. Extra args via `task image:run -- -d` pass through to `docker run` (-d to detach, --name foo, etc.)."
    deps: [image:load]
    vars:
      TAG: '{{.TAG | default "0.1.0"}}'
    cmds:
      # Foreground by default so operators see logs. The named volume
      # (cloister-do) keeps DO storage across runs; --rm cleans the
      # container itself. CLI_ARGS pass through to `docker run` so the
      # user can add -d, --env, --name, etc. without editing the Taskfile.
      - 'docker run --rm -p 8787:8787 -v cloister-do:/data/do {{.CLI_ARGS | default ""}} cloister:{{.TAG}}'

  image:check:
    desc: Validate melange.yaml + apko.yaml syntax without running a real build
    deps: [apk:keygen]
    cmds:
      # melange has no `lint` for YAML — `compile` parses the recipe end-to-end
      # and emits the resolved build script (--arch is required).
      - melange compile melange.yaml --arch "$(uname -m)" >/dev/null
      # apko equivalent: show-config resolves all packages + paths.
      - apko show-config apko.yaml >/dev/null

  registry:import:
    desc: "Import an OCI image tarball into the cluster's in-cluster registry (cloister-cabd57 Phase 1). Use --dry-run via env CLOISTER_DRY_RUN=1 to validate without uploading."
    cmds:
      - |
        if [ -z "${IMAGE:-}" ]; then
          echo "registry:import — set IMAGE=path/to/image.tar (e.g. cloister.tar from \`task image\`)" >&2
          exit 1
        fi
        DRY=""
        if [ "${CLOISTER_DRY_RUN:-0}" = "1" ]; then DRY="--dry-run"; fi
        REG="${CLOISTER_REGISTRY:-http://localhost:8787}"
        node scripts/import-image.mjs "$IMAGE" --registry "$REG" $DRY
