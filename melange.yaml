# melange.yaml — build cloister as an APK
#
# cloister is a workerd Worker, not a native binary. The package bundles:
#   /usr/share/cloister/index.js   — wrangler-built worker bundle
#   /usr/share/cloister/config.capnp — workerd runtime config
#   /usr/bin/workerd               — the Cloudflare Workers runtime
#
# Usage:
#   melange build melange.yaml --signing-key melange.rsa \
#     --arch x86_64,aarch64 --out-dir ./packages
#
# The workerd binary is fetched from the @cloudflare/workerd-linux-* npm
# tarballs because Wolfi doesn't ship a workerd APK. Pinned to match what
# the source tree uses at build time.

package:
  name: cloister
  version: 0.1.0
  epoch: 0
  description: "cloister — SSE/HTTP edge router for the ART constellation"
  copyright:
    - license: AGPL-3.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - libgcc

environment:
  contents:
    # Wolfi base — matches what notme/mache/rosary/llo's melange configs
    # use. Without these, `melange build` aborts with "must provide at
    # least one repository" before any build step runs. Fix: surfaced
    # by the cloister-1b1124 integration matrix run 2026-05-11.
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - ca-certificates-bundle
      - nodejs
      - npm
      - tar
      - gzip
      # Cap'n Proto compiler — needed because `task manifest` runs
      # `capnp eval` to compile cloister.capnp → JSON. Without this, the
      # build would fail at the manifest-generation step.
      - capnp
      # go-task — Taskfile is the golden path (ADR-0001). melange's build
      # pipeline calls `task build:local` rather than re-implementing the
      # bundle steps inline, so the local-dev path and the OCI-image path
      # share the same logic. If `task` changes, melange picks it up
      # automatically; no two-source-of-truth drift.
      - go-task

# Pin workerd to the version the cloister tree builds against. Bump in
# lockstep with the @cloudflare/workerd-* dep in package.json.
var-transforms:
  - from: ${{package.version}}
    match: .*
    replace: $0
    to: cloister-version

vars:
  workerd-version: "1.20250718.0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/agentic-research/cloister
      tag: v${{package.version}}

  - name: Install pnpm
    runs: |
      npm install -g pnpm@10

  - name: Install + bundle the worker (via Taskfile — golden path)
    runs: |
      # Mirror the local-dev golden path so build logic lives in one place
      # (Taskfile.yml). `task build:local` is `manifest` (capnp → typed TS)
      # then `wrangler build --outdir dist`. If either step changes, melange
      # picks it up without edits to this file.
      pnpm install --frozen-lockfile
      task build:local
      test -f dist/index.js

  - name: Stage worker artifacts
    runs: |
      install -Dm644 dist/index.js \
        "${{targets.destdir}}/usr/share/cloister/dist/index.js"
      install -Dm644 config.capnp \
        "${{targets.destdir}}/usr/share/cloister/config.capnp"

  - name: Fetch workerd binary for this arch
    runs: |
      ARCH=$(uname -m)
      case "$ARCH" in
        x86_64)  NPM_PKG="@cloudflare/workerd-linux-64" ;;
        aarch64) NPM_PKG="@cloudflare/workerd-linux-arm64" ;;
        *) echo "unsupported arch: $ARCH"; exit 1 ;;
      esac
      WORKERD_VER="${{vars.workerd-version}}"
      npm pack --silent "${NPM_PKG}@${WORKERD_VER}"
      # npm pack writes a tarball named after the scope/package.
      TARBALL=$(ls cloudflare-workerd-linux-*.tgz | head -1)
      tar -xzf "$TARBALL"
      install -Dm755 package/bin/workerd \
        "${{targets.destdir}}/usr/bin/workerd"

test:
  pipeline:
    - runs: |
        /usr/bin/workerd --version
        test -f /usr/share/cloister/dist/index.js
        test -f /usr/share/cloister/config.capnp

update:
  enabled: true
  github:
    identifier: agentic-research/cloister
    strip-prefix: v
