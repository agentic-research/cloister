# melange.yaml — build cloister as an APK
#
# cloister is a workerd Worker, not a native binary. The package bundles:
#   /usr/share/cloister/index.js   — wrangler-built worker bundle
#   /usr/share/cloister/config.capnp — workerd runtime config
#   /usr/bin/workerd               — the Cloudflare Workers runtime
#
# Usage:
#   melange build melange.yaml --signing-key melange.rsa \
#     --arch x86_64,aarch64 --out-dir ./packages
#
# The workerd binary is fetched from the @cloudflare/workerd-linux-* npm
# tarballs because Wolfi doesn't ship a workerd APK. Pinned to match what
# the source tree uses at build time.

package:
  name: cloister
  version: 0.1.0
  epoch: 0
  description: "cloister — SSE/HTTP edge router for the ART constellation"
  copyright:
    - license: AGPL-3.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - libgcc

environment:
  contents:
    # Wolfi base — matches what notme/mache/rosary/llo's melange configs
    # use. Without these, `melange build` aborts with "must provide at
    # least one repository" before any build step runs. Fix: surfaced
    # by the cloister-1b1124 integration matrix run 2026-05-11.
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox          # provides tar + gzip (matches notme/mache convention)
      - build-base
      - ca-certificates-bundle
      - nodejs
      - npm
      # NOTE (cloister-0854b7): the melange build path used to depend on
      # `capnp` + `go-task` so it could run `task manifest` + `task
      # build:local`. Wolfi doesn't ship `capnp`. Rather than switch
      # base images (Alpine has it, but ABI-differs from the rest of
      # the substrate's Wolfi-based siblings), `src/generated/{manifest,
      # tool-schemas,cluster}.ts` are now TRACKED in git as the
      # deterministic codegen outputs they are. The OCI build invokes
      # `wrangler build` directly (see the pipeline step below); no
      # capnp at build time, no task runner needed. Drift between
      # source + generated is gated in CI by .github/workflows/
      # generated-drift.yml.

# Pin workerd to the version the cloister tree builds against. Bump in
# lockstep with the @cloudflare/workerd-* dep in package.json.
var-transforms:
  - from: ${{package.version}}
    match: .*
    replace: $0
    to: cloister-version

vars:
  workerd-version: "1.20250718.0"

pipeline:
  # No git-checkout step — melange populates the workspace from the
  # build context (cwd) on its own. Matches notme/mache convention; the
  # public-repo + release-tag clone form (used by rosary) is only right
  # once cloister has a public repo + release tags. Until then, this
  # builds the local tree.

  - name: Install pnpm
    runs: |
      npm install -g pnpm@10

  - name: Install + bundle the worker (wrangler direct — no capnp needed)
    runs: |
      # Generated TS modules (src/generated/{manifest,tool-schemas,cluster}.ts)
      # are checked in per cloister-0854b7, so the OCI build skips capnp +
      # task-runner entirely. Local-dev still uses `task build:local` which
      # regenerates first; CI drift check at .github/workflows/generated-drift.yml
      # keeps the checked-in artifacts honest.
      #
      # CI=true: melange's runs are non-interactive; pnpm aborts on node_modules
      # cleanup without it. The workspace is populated from the host build
      # context so a host-side node_modules can pre-exist.
      export CI=true
      # Start clean so the host's node_modules layout can't leak into the build.
      rm -rf node_modules
      pnpm install --frozen-lockfile
      # wrangler 3.x has no standalone `build`; `deploy --dry-run --outdir`
      # is the supported bundler entry point.
      pnpm exec wrangler deploy --dry-run --outdir dist
      test -f dist/index.js

  - name: Stage worker artifacts
    runs: |
      install -Dm644 dist/index.js \
        "${{targets.destdir}}/usr/share/cloister/dist/index.js"
      install -Dm644 config.capnp \
        "${{targets.destdir}}/usr/share/cloister/config.capnp"
      # wrangler emits any imported wasm modules as content-addressed
      # siblings of index.js (e.g. leyline-sign verifier). Stage them
      # alongside index.js so the worker can wire them at startup.
      for w in dist/*.wasm; do
        [ -f "$w" ] || continue
        install -Dm644 "$w" \
          "${{targets.destdir}}/usr/share/cloister/dist/$(basename "$w")"
      done

  - name: Fetch workerd binary for this arch
    runs: |
      ARCH=$(uname -m)
      case "$ARCH" in
        x86_64)  NPM_PKG="@cloudflare/workerd-linux-64" ;;
        aarch64) NPM_PKG="@cloudflare/workerd-linux-arm64" ;;
        *) echo "unsupported arch: $ARCH"; exit 1 ;;
      esac
      WORKERD_VER="${{vars.workerd-version}}"
      npm pack --silent "${NPM_PKG}@${WORKERD_VER}"
      # npm pack writes a tarball named after the scope/package.
      TARBALL=$(ls cloudflare-workerd-linux-*.tgz | head -1)
      tar -xzf "$TARBALL"
      install -Dm755 package/bin/workerd \
        "${{targets.destdir}}/usr/bin/workerd"

test:
  pipeline:
    - runs: |
        /usr/bin/workerd --version
        test -f /usr/share/cloister/dist/index.js
        test -f /usr/share/cloister/config.capnp

update:
  enabled: true
  github:
    identifier: agentic-research/cloister
    strip-prefix: v
