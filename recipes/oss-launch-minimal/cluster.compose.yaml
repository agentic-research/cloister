# AUTO-GENERATED by cloister cluster generate. Do NOT edit by hand.
# Regenerate via `cloister cluster generate` after editing cluster.toml.
#
# Cluster: cloister-oss-minimal v0.1.0
# 2 bundle(s), 1 wire(s)
#
# No bundle declares a placement, so every external bundle is run here.
# Once one does, only bundles placed "compose" for env "compose" are.
#
# Not pinned by digest, so each runs whatever its tag names when compose starts it (ADR-0083):
#   - cloister:0.1.0 (cloister-router)
#   - mache:0.8.0 (mache)
# `cloister cluster resolve` pins an image that names a registry. A bare name is a local build,
# which a committed file cannot pin.

name: cloister-oss-minimal

services:
  cloister-router:
    image: cloister:0.1.0
    pull_policy: never
    container_name: cloister-cloister-router
    labels:
      - "cloister.bundle=cloister-router"
      - "cloister.tier=hypervisor"
      - "cloister.description=cloister:0.1.0 — Gateway + Durable Object state (BeadStore, TrustStore, BlobStore)"
    networks:
      - solo-cloister-router
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - uds-run-cloister-uds:/run/cloister-uds
      - cloister-do:/data/do
    environment:
      - "MACHE_BUNDLE=http://127.0.0.1:7532"

  mache:
    image: mache:0.8.0
    pull_policy: never
    container_name: cloister-mache
    labels:
      - "cloister.bundle=mache"
      - "cloister.tier=cluster"
      - "cloister.description=mache:0.8.0 — Code intelligence — symbol search, definitions, callgraph"
    command:
      - "serve"
      - "--http"
      - "localhost:7532"
    network_mode: "service:cloister-router"

volumes:
  uds-run-cloister-uds:
    # /run/cloister-uds — held by cloister-router
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "mode=1777"
  cloister-do:
    driver: local
    # SQLite DO storage — survives container restarts; backup target

networks:
  solo-cloister-router:
    # cloister-router alone
    driver: bridge
