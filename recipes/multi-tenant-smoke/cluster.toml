[metadata]
name = "cloister-multi-tenant-smoke"
version = "0.1.0"

# ── Per ADR-0030 §A2: two cluster-tier tenants behind the substrate's
#    SNI + path-prefix dispatch. The router (hypervisor-tier) does NOT
#    serve `/mcp`; instead, it dispatches every request to the matching
#    tenant's workerd via a service binding. Each tenant runs its OWN
#    workerd image and serves its OWN routes.
#
#    This recipe is the smallest demonstration of multi-tenancy as an
#    operator-facing surface. Stand up two trivial tenant bundles that
#    echo their identity; route the request via `tenantDispatch`. Real
#    deployments swap the echo bundles for actual tenant workerds.

[[bundles]]
description = "Gateway + Durable Object state (BeadStore, TrustStore, BlobStore)"
holdsCredential = [ "VAULT_KEK_SOURCE", "VAULT_STORE" ]
hypervisorRationale = "Multi-tenant dispatcher. Routes every request to the matching tenant's workerd via SNI or path-prefix per ADR-0030 §A2. Singleton: the only TCP listener for external traffic. Three-criterion test per ADR-0011."
kind = "external"
name = "cloister-router"
tier = "hypervisor"
workerdServiceName = "cloister"

  [bundles.external]
  args = [ ]
  env = [ ]
  httpPort = 8_787
  image = "cloister:0.1.0"
  ipcSocket = "/run/cloister-uds/router.sock"

[[bundles]]
description = "Tenant alice — echoes inbound request URLs as proof of routing"
holdsCredential = [ ]
hypervisorRationale = ""
kind = "external"
name = "alice-tenant"
tier = "cluster"
workerdServiceName = ""

  [bundles.external]
  args = [ ]
  env = [ ]
  httpPort = 0
  image = "cloister:0.1.0"
  ipcSocket = "/run/cloister-uds/alice.sock"

[[bundles]]
description = "Tenant bob — echoes inbound request URLs as proof of routing"
holdsCredential = [ ]
hypervisorRationale = ""
kind = "external"
name = "bob-tenant"
tier = "cluster"
workerdServiceName = ""

  [bundles.external]
  args = [ ]
  env = [ ]
  httpPort = 0
  image = "cloister:0.1.0"
  ipcSocket = "/run/cloister-uds/bob.sock"

[[wires]]
binding = "T_ALICE"
from = "cloister-router"
to = "alice-tenant"
transport = "uds"

[[wires]]
binding = "T_BOB"
from = "cloister-router"
to = "bob-tenant"
transport = "uds"

[[routes]]
kind = "health"
path = "/health"

# ── The multi-tenant dispatch route — ADR-0030 §A2.
#
#    `path = "/"` is the catch-all match target. The TenantDispatchRoute
#    runtime (`src/routes/tenant-dispatch.ts`) inspects the request's
#    host or path against the tenants table:
#      - SNI mode: exact host-header match → O(1) Map lookup.
#      - Path-prefix mode: full-walk first-match (no early break per
#        threat-model §13.7.6(b), cloister-92e846).
#    Match wins → request forwards to the named binding. No match → 256-
#    byte constant-time 404 byte-equivalent with disclosure's 404
#    (threat-model §13.7.1).
[[routes]]
kind = "tenantDispatch"
path = "/"

  [[routes.tenantDispatch.tenants]]
  name       = "alice"
  mode       = "sni"
  matchValue = "alice.cluster.example"
  binding    = "T_ALICE"

  [[routes.tenantDispatch.tenants]]
  name       = "bob"
  mode       = "path-prefix"
  matchValue = "/t/bob"
  binding    = "T_BOB"

[gateway.actor]
algorithm = "ed25519"

[gateway.metadata]
name = "cloister-multi-tenant-smoke"
version = "0.1.0"

[gateway.policy]
maxCertLifetimeSeconds = 300
minAlgorithm = "ed25519"
requireInterlock = false

[storage]
doStoragePath = "/data/do"
