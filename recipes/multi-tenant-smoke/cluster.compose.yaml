# AUTO-GENERATED by cloister cluster generate. Do NOT edit by hand.
# Regenerate via `cloister cluster generate` after editing cluster.toml.
#
# Cluster: cloister-multi-tenant-smoke v0.1.0
# 3 bundle(s), 2 wire(s)
#
# No bundle declares a placement, so every external bundle is run here.
# Once one does, only bundles placed "compose" for env "compose" are.
#
# Not pinned by digest, so each runs whatever its tag names when compose starts it (ADR-0083):
#   - cloister:0.1.0 (cloister-router, alice-tenant, bob-tenant)
# `cloister cluster resolve` pins an image that names a registry. A bare name is a local build,
# which a committed file cannot pin.

name: cloister-multi-tenant-smoke

services:
  cloister-router:
    image: cloister:0.1.0
    pull_policy: never
    container_name: cloister-cloister-router
    labels:
      - "cloister.bundle=cloister-router"
      - "cloister.tier=hypervisor"
      - "cloister.description=cloister:0.1.0 — Gateway + Durable Object state (BeadStore, TrustStore, BlobStore)"
    networks:
      - solo-cloister-router
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - uds-run-cloister-uds:/run/cloister-uds
      - uds-run-cloister-uds-alice:/run/cloister-uds/alice
      - uds-run-cloister-uds-bob:/run/cloister-uds/bob
      - cloister-do:/data/do
    environment:
      - "T_ALICE=/run/cloister-uds/alice/alice.sock"
      - "T_BOB=/run/cloister-uds/bob/bob.sock"

  alice-tenant:
    image: cloister:0.1.0
    pull_policy: never
    container_name: cloister-alice-tenant
    labels:
      - "cloister.bundle=alice-tenant"
      - "cloister.tier=cluster"
      - "cloister.description=cloister:0.1.0 — Tenant alice — echoes inbound request URLs as proof of routing"
    networks:
      - solo-alice-tenant
    volumes:
      - uds-run-cloister-uds-alice:/run/cloister-uds/alice

  bob-tenant:
    image: cloister:0.1.0
    pull_policy: never
    container_name: cloister-bob-tenant
    labels:
      - "cloister.bundle=bob-tenant"
      - "cloister.tier=cluster"
      - "cloister.description=cloister:0.1.0 — Tenant bob — echoes inbound request URLs as proof of routing"
    networks:
      - solo-bob-tenant
    volumes:
      - uds-run-cloister-uds-bob:/run/cloister-uds/bob

volumes:
  uds-run-cloister-uds:
    # /run/cloister-uds — held by cloister-router
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "mode=1777"
  uds-run-cloister-uds-alice:
    # /run/cloister-uds/alice — held by alice-tenant, cloister-router
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "mode=1777"
  uds-run-cloister-uds-bob:
    # /run/cloister-uds/bob — held by bob-tenant, cloister-router
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "mode=1777"
  cloister-do:
    driver: local
    # SQLite DO storage — survives container restarts; backup target

networks:
  solo-alice-tenant:
    # alice-tenant alone
    driver: bridge
  solo-bob-tenant:
    # bob-tenant alone
    driver: bridge
  solo-cloister-router:
    # cloister-router alone
    driver: bridge
