# AUTO-GENERATED by cloister cluster generate. Do NOT edit by hand.
# Regenerate via `cloister cluster generate` after editing cluster.toml.
#
# Cluster: art-default v0.1.0
# 4 bundle(s), 3 wire(s)
# 1 input(s); tenancy resolved per ADR-0030 §A5
#
# No bundle declares a placement, so every external bundle is run here.
# Once one does, only bundles placed "compose" for env "compose" are.
#
# Not pinned by digest, so each runs whatever its tag names when compose starts it (ADR-0083):
#   - cloister:0.1.0 (cloister-router)
#   - notme:0.1.0 (notme-identity)
#   - mache:0.8.0 (mache)
#   - rosary:0.2.0 (rosary)
# `cloister cluster resolve` pins an image that names a registry. A bare name is a local build,
# which a committed file cannot pin.

name: art-default

services:
  cloister-router:
    image: cloister:0.1.0
    pull_policy: never
    container_name: cloister-cloister-router
    labels:
      - "cloister.bundle=cloister-router"
      - "cloister.tier=hypervisor"
      - "cloister.description=cloister:0.1.0 — Gateway + Durable Object state (BeadStore, TrustStore, BlobStore)"
      - "cloister.colocated-inputs=llo"
    networks:
      - wire-cloister-router-notme-identity
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - uds-run-cloister-uds:/run/cloister-uds
      - cloister-do:/data/do
    environment:
      - "MACHE_BUNDLE=http://127.0.0.1:7532"
      - "ROSARY_BUNDLE=/run/cloister-uds/rosary.sock"
      - "NOTME=http://notme-identity:8788"

  notme-identity:
    image: notme:0.1.0
    pull_policy: never
    container_name: cloister-notme-identity
    labels:
      - "cloister.bundle=notme-identity"
      - "cloister.tier=hypervisor"
      - "cloister.description=notme:0.1.0 — Identity authority — Signet master CA, lease cert mint"
    networks:
      - wire-cloister-router-notme-identity
    # not published: httpPort 8788 is reached through this bundle's wires only. A [[bundles.ports]] row for it with expose = "edge" publishes it on 127.0.0.1

  mache:
    image: mache:0.8.0
    pull_policy: never
    container_name: cloister-mache
    labels:
      - "cloister.bundle=mache"
      - "cloister.tier=cluster"
      - "cloister.description=mache:0.8.0 — Code intelligence — symbol search, definitions, callgraph"
    command:
      - "serve"
      - "--http"
      - "localhost:7532"
    network_mode: "service:cloister-router"

  rosary:
    image: rosary:0.2.0
    pull_policy: never
    container_name: cloister-rosary
    labels:
      - "cloister.bundle=rosary"
      - "cloister.tier=cluster"
      - "cloister.description=rosary:0.2.0 — Bead orchestrator — `rsry_bead_*` MCP tools, agent dispatch"
    command:
      - "mcp"
      - "--ipc-socket"
      - "/run/cloister-uds/rosary.sock"
    networks:
      - solo-rosary
    volumes:
      - uds-run-cloister-uds:/run/cloister-uds

volumes:
  uds-run-cloister-uds:
    # /run/cloister-uds — held by cloister-router, rosary
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "mode=1777"
  cloister-do:
    driver: local
    # SQLite DO storage — survives container restarts; backup target

networks:
  solo-rosary:
    # rosary alone
    driver: bridge
  wire-cloister-router-notme-identity:
    # cloister-router → notme-identity
    driver: bridge
