# apko.yaml — assemble cloister OCI image
#
# apko build apko.yaml cloister:latest cloister.tar \
#   --keyring-append melange.rsa.pub
#
# Result: distroless OCI image — workerd + cloister bundle, nothing else.
# No shell, no package manager. Minimal attack surface.
# SBOM auto-generated when using `apko publish`.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # The cloister APK comes from the local melange build output.
    - "@local ./packages"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - melange.rsa.pub
  packages:
    - ca-certificates-bundle
    - wolfi-baselayout
    - cloister@local
    # Optional — uncomment to bake cloudflared into the image for
    # self-hosted deployments that want CF Tunnel egress without a
    # separate sidecar container. See docs/deployment/off-platform-peers.md
    # for the recommended sidecar pattern (lets you upgrade cloudflared
    # and cloister independently). cloister-bf0913 / ADR-0007.
    # - cloudflared

accounts:
  groups:
    - groupname: cloister
      gid: 65532
  users:
    - username: cloister
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  # workerd's local-disk DO storage path; matches config.capnp's `do-storage`
  # service entry. Mount /data as a volume in production deployments.
  CLOISTER_DATA: /data

paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /data/do
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

entrypoint:
  command: /usr/bin/workerd

# Default cmd: serve the bundled config with experimental features (DOs).
# Override at run time with `docker run cloister serve <other-config>`.
cmd: serve --experimental /usr/share/cloister/config.capnp

archs:
  - x86_64
  - aarch64

# Per-origin layering: packages from the same upstream share a layer.
# Reduces delta pulls by ~70% on updates (only changed layers re-download).
layering:
  strategy: origin

annotations:
  org.opencontainers.image.title: cloister
  org.opencontainers.image.description: "cloister: SSE/HTTP edge router for the ART constellation"
  org.opencontainers.image.source: https://github.com/agentic-research/cloister
  org.opencontainers.image.licenses: AGPL-3.0
