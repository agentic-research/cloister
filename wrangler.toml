name = "cloister"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ── WebAssembly modules ───────────────────────────────────────────────────
# Bundles `.wasm` files imported via TS into the Worker as
# `WebAssembly.Module` objects. cloister-bd5241 ships leyline-sign as a
# wasm32 build (LLO `rs/ll-open/sign/`, git dep pinned in
# `rs/crates/cas/Cargo.toml`) — CMS/PKCS#7 + Ed25519 verifier
# loadable from src/wire/signet-verify.ts. Build via `task rs:sign:wasm`.
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

# ── Durable Objects ───────────────────────────────────────────────────────
# BeadStore:  bundle-layer, per-repo (idFromName(repo)), holds work-item state.
# TrustStore: hypervisor-layer, singleton per cluster, holds trust state
#             (peer_lease_counters today, peer_attestations + vault planned
#             per ADR-0010 / ADR-0011). Added 2026-05-09 after the
#             adversarial review of the BeadStore/TrustStore split.
# BlobStore:  hypervisor-layer, singleton per cluster, content-addressed
#             substrate per ADR-0003 phase 1. Cross-DO bead_create handoff
#             (ADR-0012) relies on idempotent put. Added 2026-05-09
#             (cloister-960f68).
[durable_objects]
bindings = [
  { name = "BEAD_STORE",  class_name = "BeadStore"  },
  { name = "TRUST_STORE", class_name = "TrustStore" },
  { name = "BLOB_STORE",  class_name = "BlobStore"  },
  # CredentialVault — hypervisor-layer singleton vault. Envelope-encrypted
  # credentials (HKDF + AES-256-GCM), per-service allowedSubs enforcement,
  # plaintext-stays-in-DO proxying. Per ADR-0010 + ADR-0013. Lifted from
  # notme/vault per cloister-9ad9eb (2026-05-09). Library code in
  # vault/src/{vault,crypto,handler}.ts; DO wrapper in src/vault-store.ts.
  { name = "VAULT_STORE", class_name = "CredentialVault" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BeadStore"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TrustStore"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["BlobStore"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["CredentialVault"]

# v5: BeadStore.beads.content_hash column for ADR-0012 content-addressed
# handoff (cloister-492c08). The cross-DO bead_create orchestrator
# (src/routes/bead-create-orchestrator.ts) writes canonical bead bytes
# to BlobStore first, then stores the resulting digest on the bead row
# so disclosure + verification can link bead rows ↔ peer_attestations
# rows by content_hash. No new DO classes — the column is added at
# DO-init time via an idempotent ALTER TABLE in BeadStore.initSchema().
# This tag documents the migration even though workerd doesn't have an
# automatic ALTER-runner for non-class schema changes.
[[migrations]]
tag = "v5"

# ── Service bindings (workerd Workers) ────────────────────────────────────
# notme-bot: agent identity authority — Ed25519 certs, JWT minting, passkeys
# Local dev: run `wrangler dev` in ../notme/worker/ first (port 8788)
# Prod: automatically routes to deployed notme-bot Worker
[[services]]
binding = "NOTME"
service = "notme-bot"

# Delegated OAuth JWT signing (notme ADR-015, notme PR #62 / cloister-5f7e5c).
#
# An RPC entrypoint, NOT a fetch binding, and NOT the same key as `NOTME` above.
# notme replaced `POST /internal/sign-jwt` with a 404 whose body names this
# binding shape, for the reason it had already given when it declined
# `/internal/sign-receipt`: an `/internal/` path prefix is publicly routable and
# is therefore not an access control. That refusal is recorded in
# src/types.ts:155; this is the second instance of the same pattern, and the one
# cloister never migrated.
#
# The key behind it is DELEGATED, deliberately not the Interlace/CA master —
# notme's own access tokens (typ "at+jwt", iss "https://auth.notme.bot") are
# signed with the master, so signing arbitrary header.payload bytes with it is
# an authentication bypass rather than a forgery oracle. Key separation is the
# control; no amount of claim validation substitutes for it, because a JWT
# payload has no schema to canonicalize against.
[[services]]
binding = "NOTME_JWT"
service = "notme-bot"
entrypoint = "JwtSigner"

# ── Non-workerd services (HTTP proxy, local dev only) ─────────────────────
# signet         (Go)   — key exchange / identity layer, port TBD
# ley-line-open  (Rust) — daemon serves MCP on `--mcp-port`, default 8384
# rosary         (Rust) — orchestrator MCP server, stdio or port 8383
# mache          (Go)   — code intelligence FUSE, port TBD
# crumb          (Go)   — knowledge capture, port TBD
#
# These run as local processes and are proxied via *_URL vars in [vars].
# In production, point them at notme-proxy's UDS-backed HTTP endpoint so
# traffic carries an attested bridge cert.

[vars]
ROSARY_MCP_URL  = "http://localhost:8383/mcp"
LLO_MCP_URL     = "http://localhost:8384/mcp"   # `leyline daemon --mcp-port 8384`
CANONICAL_HOURS_MCP_URL = "http://localhost:2000/mcp"   # `task dev` (eve dev) in canonical-hours, default port per its server.json — eve picks the next free port if 2000 is taken, adjust to match
SIGNET_URL      = ""   # not yet deployed, TBD
# cloister-companion (ADR-0005). Empty disables LeylineNetToolBackend.
# For local dev: `task companion:stub` starts a stub on :8385 that mimics
# the wire contract (capnp ToolCall in, capnp ToolResult out).
COMPANION_URL   = "http://localhost:8385/mcp"
# mache (Go FUSE/MCP). Local dev: `mache serve --http :7532`.
# Used by the mache_* backend with dynamicTools=true (ADR-0006).
MACHE_MCP_URL   = "http://localhost:7532/mcp"
# CredentialVault KEK URL — picks where the vault DO resolves its KEK
# from. MUST be a non-empty URL spec per ADR-0014 v2 (amendment
# 2026-05-12, cloister-125199). The vault-DO constructor throws on
# empty/missing with an actionable error pointing at `task dev:bootstrap`
# for local work or `wrangler secret put VAULT_KEK_SOURCE` for prod.
#
# Schemes (see vault/src/kek-source.ts HELPER_SCHEMES):
#   keychain://, secret-tool://, op://, apple-password://, keyring://
#   http(s)://helper/  — all route via KEK_HELPER (leyline-sign-helper)
#   file:///path       — workerd disk-service binding
#   env://NAME         — age-encrypted carrier (never plaintext)
#
# The legacy `VAULT_KEK_SECRET` text binding was removed in v2.
# Plaintext key material is not representable in committed config.
VAULT_KEK_SOURCE = ""

# ── Interlace lease pipeline activation (ADR-0007) ─────────────────────────
# Empty default = lease gate INACTIVE (dev mode). Operators activate by
# setting non-empty values via `.env.local` (sourced by `task dev`) or
# `wrangler secret put` in production. Per cloister-e14804: must be
# declared here so the dev runtime exposes them as `env.X` — wrangler
# doesn't auto-thread shell env to the worker.
INTERLACE_ROOT_PUBKEY            = ""    # base64 Ed25519 master pubkey; non-empty turns lease gate ON
INTERLACE_MASTER_PUBKEY          = ""    # alias used by some code paths; keep in sync with ROOT
INTERLACE_DISCLOSURE_HMAC_KEY    = ""    # HMAC for disclosure-endpoint cursor signing

# ── Interlace 0.2.0 receipts (cloister-ae713f) ─────────────────────────────
# Empty default = no emission (Phase 1 dev/test posture). Production
# operators flip these to enable per-2xx receipt emission. Phase 2
# cutover (peers fail-closed on missing receipts) is operator action,
# not a code change.
RECEIPT_SIGNING_KEY  = ""    # base64-std 64-byte keypair (seed || pub) for receipt signer
RECEIPT_EPOCH        = ""    # numeric epoch stamp aligned to lease cert epoch
