version: "3"

env:
  # Verification gates should not depend on machine-global Cargo wrappers
  # such as sccache. Sandboxed local flows can deny wrapper IPC even though
  # plain rustc works, and reproducibility matters more here than cache speed.
  RUSTC_WRAPPER: ""

tasks:
  test:
    desc: "Rust gates required before worker tests: wasm artifacts + host test suites. Sequenced to avoid Cargo package/artifact lock contention."
    cmds:
      - task: cas:wasm
      - task: sign:host
      - task: cas:test
      - task: host-runtime:test
      - task: workspace:test

  workspace:test:
    desc: "Run the whole workspace with the llo-execution feature on, because feature unification changed a confinement digest that per-crate runs missed (cloister-d95ff5)."
    cmds:
      - cargo test --workspace --features cloister-host-runtime/llo-execution

  verify:
    desc: "Verify-only Rust gates. Runs after root `task lint`, so it avoids racing lint's Rust prerequisites."
    cmds:
      - task: sign:host-extras
      # The opt-in execution backend must still COMPILE, or the feature rots
      # unbuilt and the opt-in becomes a broken one. Ordered BEFORE audit
      # deliberately: audit runs on the DEFAULT feature set, which is the set
      # this gate exists to keep clean (threat model §17.1 amendment).
      - task: host-runtime:llo
      - task: audit

  sign:
    desc: "Build-check LLO's leyline-sign crate (native, default features). Crate pulled via the git dep pinned in rs/crates/cas/Cargo.toml (bead cloister-8f4d3f). LLO owns the unit tests upstream; cloister's boundary check is that the crate compiles cleanly in cloister's dep-resolution graph plus the TS-side integration test in test/wire/signet-verify.test.ts."
    cmds:
      - cargo build -p leyline-sign

  # `sign:wasm` (cargo-building leyline-sign for wasm32) is gone: the Worker
  # now imports LLO's published, digest-pinned leyline_sign.wasm via the root
  # `llo:wasm` task (cloister-dbe9c3). cas:wasm stays until LLO's
  # leyline_cas_ffi.wasm exports what cloister-cas adds (ley-line-open-dbacd2).

  sign:host:
    desc: "Build-check LLO's leyline-sign crate with the host feature (cloister-99165e). The host feature is enabled via the target-cfg dep row in rs/crates/cas/Cargo.toml (cargo forbids `--features feat -p external-pkg`). LLO owns the host-side unit + adversarial test suites upstream (rs/ll-open/sign/tests/); cloister's job here is verifying the crate compiles with the host closure the ADR-0019 helper needs."
    cmds:
      - cargo build -p leyline-sign

  host-runtime:llo:
    desc: "Build-check cloister-host-runtime WITH the llo-execution feature (cloister-17e502 / threat model §17.1). The default build deliberately links no execution backend, so the backend only compiles here — without this task the feature would rot unbuilt, which is how an opt-in becomes a broken one."
    cmds:
      - cargo build -p cloister-host-runtime --features llo-execution
      - cargo test -p cloister-host-runtime --features llo-execution

  sign:host-extras:
    desc: "Build-check LLO's leyline-sign crate with host + host-extras (cloister-2a0faa). Exercises the opt-in nono closure flagged in threat-model §17.1. host-extras is enabled inline here — passed via the workspace member (cloister-cas) so cargo accepts it for the git dep, using cargo's transitive-feature syntax `<dep>/<feat>`."
    cmds:
      - cargo build --features 'leyline-sign/host-extras'

  sign:helper:
    desc: "Build the leyline-sign-helper binary (cloister-99165e). Native target; host feature enabled by cas's target-cfg dep row. Crate source lives in LLO."
    cmds:
      - cargo build --release --bin leyline-sign-helper -p leyline-sign
      - 'echo "binary: $(pwd)/target/release/leyline-sign-helper ($(wc -c < target/release/leyline-sign-helper) bytes)"'

  cas:wasm:
    desc: "Build cloister-cas (LLO leyline-cas-ffi bridge) for wasm32 (cloister-713b4e). Requires `rustup target add wasm32-unknown-unknown` once."
    cmds:
      - cargo build --release --target wasm32-unknown-unknown -p cloister-cas
      - 'echo "wasm artifact: $(pwd)/target/wasm32-unknown-unknown/release/cloister_cas.wasm ($(wc -c < target/wasm32-unknown-unknown/release/cloister_cas.wasm) bytes)"'
    sources:
      - crates/cas/src/**/*.rs
      - crates/cas/Cargo.toml
    generates:
      - target/wasm32-unknown-unknown/release/cloister_cas.wasm

  cas:test:
    desc: "Test the cloister-cas bridge crate. Native tests only; wasm32 behavior is covered by the upstream leyline-cas-ffi test suite."
    cmds:
      - cargo test -p cloister-cas

  host-runtime:test:
    desc: "ADR-0049 native host-runtime: typed launch-plan validation, exact backend selection, fail-closed microVM availability, and the canonical LLO-backed filesystem mediator."
    cmds:
      - cargo test -p cloister-host-runtime
    sources:
      - crates/host-runtime/**/*.rs
      - crates/host-runtime/Cargo.toml
      - Cargo.lock

  host-runtime:build:
    desc: "Build the Cloister host-runtime operator binary. Backed by ley-line-open execution/v1 in-process (cloister-17e502) — no krunvm/buildah subprocess."
    cmds:
      - cargo build --release -p cloister-host-runtime
    sources:
      - crates/host-runtime/**/*.rs
      - crates/host-runtime/Cargo.toml
      - Cargo.lock
    generates:
      - target/release/cloister-host-runtime

  audit:
    desc: "Supply-chain audit for the Rust workspace. Asserts toolchain pin matches ADR-0019; runs cargo audit over EVERY committed Cargo.lock (rs/ plus discovered tools/*) + cargo deny over the helper's transitive closure."
    cmds:
      # Preflight (fail-loud, never skip). This is a SECURITY gate — if
      # cargo-audit / cargo-deny are missing, a bare `cargo audit` prints a
      # cryptic "no such command" and, worse, an operator might be tempted to
      # make it non-fatal, silently turning the supply-chain check into a
      # no-op. So: detect missing tools, name them, give the install line, and
      # exit non-zero. Missing tool ⇒ cannot verify ⇒ MUST NOT pass.
      - |
        missing=""
        command -v cargo-audit >/dev/null 2>&1 || missing="$missing cargo-audit"
        command -v cargo-deny  >/dev/null 2>&1 || missing="$missing cargo-deny"
        if [ -n "$missing" ]; then
          echo "rs:audit: supply-chain gate cannot run — missing tool(s):$missing" >&2
          for t in $missing; do echo "  install: cargo install $t" >&2; done
          exit 1
        fi
      - 'grep -q ''channel = "1.95.0"'' rust-toolchain.toml || (echo "rs/rust-toolchain.toml: channel != 1.95.0 — see ADR-0019 §Implementation pins"; exit 1)'
      - cargo audit --deny warnings
      # Every OTHER committed Cargo.lock, under this same .cargo/audit.toml
      # policy (cargo audit reads it from the working dir). Discovered, not
      # listed: after #266 cleared quinn-proto/rustls here, the same crates
      # stayed vulnerable in tools/harness-sandbox/Cargo.lock for weeks because
      # this gate only read rs/Cargo.lock (cloister-6ecd70). Finding none means
      # discovery broke, not that the tree is clean — so that fails too.
      - |
        locks=$(git -C .. ls-files '*Cargo.lock' ':!rs/Cargo.lock')
        if [ -z "$locks" ]; then
          echo "rs:audit: found no Cargo.lock outside rs/ — expected tools/harness-sandbox; lockfile discovery is broken" >&2
          exit 1
        fi
        for lock in $locks; do
          echo "rs:audit: ../$lock"
          cargo audit --deny warnings -f "../$lock"
        done
      - cargo deny check
