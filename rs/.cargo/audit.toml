# cargo-audit configuration for the rs/ workspace (read by `task rs:audit`,
# which runs `cargo audit --deny warnings` from this directory).
#
# Every entry here is a DOCUMENTED RESIDUAL, never a silencing: it names the
# advisory, why cloister cannot fix it, and the bead that removes it. Delete the
# entry when that bead lands — an ignore that outlives its cause hides the next
# advisory against the same crate.

[advisories]
ignore = [
  # Unmaintained (informational, not a vulnerability): the zbus 4 stack —
  # zvariant 4.2.0, zbus_names 3.0.0, zvariant_derive 4.2.0. Reached only on
  # Linux, through ley-line-open's leyline-sign -> keyring 3 -> secret-service 4
  # -> zbus 4. keyring 3 caps that semver, so no cloister-side `cargo update`
  # can move it; the fix is LLO moving off keyring 3 / zbus 4, tracked as
  # ley-line-open-275db8. Present on cloister main before the v0.21.1 adoption.
  "RUSTSEC-2026-0370",
  "RUSTSEC-2026-0371",
  "RUSTSEC-2026-0372",
  # VULNERABILITY, not informational: libsqlite3-sys 0.37.0 bundles SQLite
  # < 3.54.0 (CVE-2026-119375 / GHSA-72w2-rjgg-q729). Opening a database
  # together with a crafted `-wal` of a different page size returns
  # uninitialized page-cache memory. Local vector only, and only for a process
  # that opens a db + wal pair a less-trusted party could have written — here,
  # cloister-host-runtime opening an arena through leyline-fs, so the residual
  # risk is a confined run with write access to an arena directory. Reached
  # through ley-line-open's leyline-fs / leyline-schema -> rusqlite 0.39; the
  # fix is rusqlite 0.41 (libsqlite3-sys 0.39), a semver-breaking bump only LLO
  # can make, tracked as ley-line-open-6ef210 (cloister-6ecd70). Delete this
  # entry when cloister pins an LLO release carrying it.
  "RUSTSEC-2026-0459",
]
