[package]
name = "cloister-cas"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Wasm32 bridge crate exposing LLO's leyline-cas-ffi (BLAKE3 substrate) + workspace anchor for leyline-sign (CMS/Ed25519 verify) so cloister's wasm build graph resolves both LLO crates by SHA (beads cloister-713b4e + cloister-8f4d3f)."

[lib]
# Same triple as LLO's leyline-sign — cdylib emits the .wasm artifact
# cloister's wrangler bundles via the [[rules]] type = "CompiledWasm"
# rule; staticlib/rlib are retained for in-workspace consumers +
# future native test harnesses.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Pinned to the SHA that landed leyline-cas-ffi in LLO + the license
# field addition (ley-line-open-f2239c, SHA 593ee61). Updating this
# rev is a deliberate, reviewable act — the substrate (BLAKE3 lock,
# Σ §3.4) is the load-bearing thing; a rev bump means the algorithm
# changed and the cross-runtime fixture suite must re-verify.
# allow-git for this URL is set in rs/deny.toml. The `version` field
# alongside the git+rev is required for cargo-deny's wildcards rule
# (per cloister-eefd45 — git-only deps are treated as wildcards).
leyline-cas-ffi = { git = "https://github.com/agentic-research/ley-line-open", rev = "74db5a9725631ad9ef7076a6c1e7a5467bf31d2d", version = "0.11.3", package = "leyline-cas-ffi" }

# leyline-core supplies PartitionSpec (ADR-0032's tagged fold). cloister
# BRIDGES it per ADR-0035 rather than reimplementing — the scheme must be
# folded INTO the address, and getting that wrong is unverifiable rather
# than merely wrong. Pin the rev deliberately: PARTITION_CONTEXT is
# protocol-visible, so a rev that changes it invalidates every address.
#
# This is a THIRD pinned version of leyline-core in the dep graph
# (leyline-cas-ffi transitively pulls 0.4.5, leyline-schema-bridge pulls
# 0.8.0) — cargo-deny's multiple-versions check is "warn", not "deny", and
# the alternative (bumping leyline-cas-ffi's rev to unify on 0.10.4) would
# change the BLAKE3 substrate crate itself, which per the comment above
# means the algorithm changed and the cross-runtime fixture suite must
# re-verify — a separate, reviewable act, not a side effect of adding a
# partition-fold dependency (cloister-bc5640). Kept in the plain
# [dependencies] table (not the wasm32-excluded host-only target section
# below) so the wasm32 build graph resolves it too.
leyline-core = { git = "https://github.com/agentic-research/ley-line-open", rev = "74db5a9725631ad9ef7076a6c1e7a5467bf31d2d", version = "0.11.3", package = "leyline-core" }

# Pinned to LLO v0.7.6 (release commit a6eba83, bead ley-line-open-c79ea8 /
# PR #196 + #197) — the release that adds the confinementDigest Interlace
# cert extension (OID 1.3.6.1.4.1.99999.1.7). This rev is what teaches the
# wasm's `claims_to_json` to emit the `"cd"` key that cloister's §7 verify
# (cloister-c80953) parses. Previous pin was rev 6d13126 / v0.6.0 (PR #160,
# ley-line-open-7226e3 — the merge that consolidated cloister's
# `rs/crates/sign/` fork into LLO's `rs/ll-open/sign/`). Adding leyline-sign
# as a dep here brings it into cloister's workspace resolution graph so
# `cargo build -p leyline-sign --target wasm32-unknown-unknown` emits
# `leyline_sign.wasm` (consumed by `src/wire/signet-verify.ts`) from
# LLO's crate, and the ADR-0019 `leyline-sign-helper` binary builds
# via `cargo build --features host --bin leyline-sign-helper
# -p leyline-sign`. The crate is NOT `pub use`-d from cloister-cas'
# lib.rs, so leyline-sign's symbols do not land in `cloister_cas.wasm`
# — the two .wasm artifacts stay independent. Per bead cloister-8f4d3f.
# Base dep — no features. Wasm32 builds use only this row (leyline-sign's
# own `#[cfg(all(feature="host", not(target_arch = "wasm32")))]` gate would
# drop host code even if it were enabled here, but leaving the base dep
# host-less keeps the wasm dep graph free of tokio/mio/keyring transitives
# that fail to compile on wasm32).
leyline-sign = { git = "https://github.com/agentic-research/ley-line-open", rev = "74db5a9725631ad9ef7076a6c1e7a5467bf31d2d", version = "0.11.3", package = "leyline-sign" }

# Native-only: enable `host` so `cargo build --bin leyline-sign-helper
# -p leyline-sign` + `cargo test -p leyline-sign --features host`
# (invoked by `rs:sign:helper` / `rs:sign:host`) work without cargo's
# "cannot specify features for packages outside of workspace" refusal
# — cargo permits `--features` only for workspace members, so the
# host feature must be pre-enabled via a dep declaration. The
# `cfg(not(target_arch = "wasm32"))` gate keeps the tokio/mio/keyring
# transitive closure out of the wasm dep graph.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
leyline-sign = { git = "https://github.com/agentic-research/ley-line-open", rev = "74db5a9725631ad9ef7076a6c1e7a5467bf31d2d", version = "0.11.3", package = "leyline-sign", features = ["host"] }

# LLO's schema-bridge capnp-plugin crate, anchored here for the same
# reason as leyline-sign above: naming it as a workspace-graph dep makes
# `cargo build -p leyline-schema-bridge --bin capnpc-schema-bridge-{zod,go}`
# resolve, emitting the two plugins into `rs/target/release/` (consumed by
# the Taskfile `cluster:*` / `identity:*` codegen + drift targets via
# `capnp compile -o./rs/target/release/capnpc-schema-bridge-…`). Lifted
# from cloister's deleted `tools/schema-bridge` per ADR-0036 Phase 2 (LLO
# PR #222, bead ley-line-open-0806dc); cloister-side repoint is bead
# cloister-a7346b. It is NOT `pub use`-d from cloister-cas' lib.rs — a
# codegen tool, never linked into any cloister artifact. Native-cfg-gated
# because it is a build-time host tool (capnp/thiserror closure); wasm32
# builds of cloister_cas.wasm must not pull it. `version` accompanies the
# git+rev for cargo-deny's wildcards rule (same as the deps above).
leyline-schema-bridge = { git = "https://github.com/agentic-research/ley-line-open", rev = "74db5a9725631ad9ef7076a6c1e7a5467bf31d2d", version = "0.11.3", package = "leyline-schema-bridge" }

[dev-dependencies]
# Used in the bridge crate's tests to cross-check the re-exported FFI's
# output against `blake3::hash` directly. Matches the upstream cas-ffi
# crate's dev-dep convention.
blake3 = "1"

# For examples/confinement-digest.rs — the §6 canonical serializer for
# cloister/confinement/v1 ConfinementManifests (cloister-a34edc). serde_json's
# default Map is a sorted BTreeMap (preserve_order off), which gives §6.2's
# ASCII-sorted keys; to_string_pretty gives 2-space indent.
serde_json = "1"

# For `examples/mint-dev-cert.rs` (the ADR-0042 dev-cert minter, re-homed here
# after PR #119 dropped the leyline-sign fork it used to live in). Versions are
# pinned to match LLO's leyline-sign (rev a6eba83 / v0.7.6) so the `SigningKey` type
# unifies across the crate boundary into `mint_test_cert`; ed25519-dalek 3.x
# needs no `rand_core` feature here since the minter uses `from_bytes` (seeded
# from rand 0.8's OsRng), not the removed `generate`.
ed25519-dalek = "3"
rand = "0.8"
sha2 = "0.11"
base64 = "0.22"
