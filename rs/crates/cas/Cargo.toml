[package]
name = "cloister-cas"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Wasm32 bridge crate exposing leyline-cas-ffi for cloister's bundle pipeline (bead cloister-713b4e)"

[lib]
# Same triple as crates/sign — cdylib emits the .wasm artifact cloister's
# wrangler bundles via the [[rules]] type = "CompiledWasm" rule;
# staticlib/rlib are retained for symmetry with the sign crate (in-
# workspace consumers + future native test harnesses).
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Pinned to the SHA that landed leyline-cas-ffi in LLO (PR #54).
# Updating this rev is a deliberate, reviewable act — the substrate
# (BLAKE3 lock, Σ §3.4) is the load-bearing thing; a rev bump means
# the algorithm changed and the cross-runtime fixture suite must
# re-verify. allow-git for this URL is set in rs/deny.toml.
leyline-cas-ffi = { git = "https://github.com/agentic-research/ley-line-open", rev = "afdb358dbf377c61e89d0b761b9b41533a675af8", package = "leyline-cas-ffi" }

[dev-dependencies]
# Used in the bridge crate's tests to cross-check the re-exported FFI's
# output against `blake3::hash` directly. Matches the upstream cas-ffi
# crate's dev-dep convention.
blake3 = "1"
