[package]
name = "cloister-host-runtime"
version = "0.0.1"
edition = "2021"
description = "Native confinement and microVM execution boundary for Cloister tools"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "cloister_host_runtime"

[[bin]]
name = "cloister-host-runtime"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
leyline-fs = { git = "https://github.com/agentic-research/ley-line-open", rev = "74db5a9725631ad9ef7076a6c1e7a5467bf31d2d", version = "0.11.3", package = "leyline-fs", default-features = false }

[dev-dependencies]
tempfile = "3"
