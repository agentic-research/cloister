[package]
name = "leyline-sign"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

# `leyline-sign-helper` — sign-only trust-anchor-helper daemon (ADR-0019).
#
# Native-only binary; gated behind the `host` feature to keep
# `cargo build --target wasm32-unknown-unknown -p leyline-sign` building
# the wasm verifier byte-identically to before (see Taskfile rs:sign:wasm).
# Per ADR-0019 §"Implementation language and location" + cloister-99165e.
[[bin]]
name = "leyline-sign-helper"
path = "src/bin/helper.rs"
required-features = ["host"]

[features]
default = []
# Host-side feature — pulls in the HTTP server, OS-keystore client, signing
# pipeline, rate limiter, and CLI. Disabled on wasm32 builds; gated by
# `#[cfg(all(feature = "host", not(target_arch = "wasm32")))]` at every
# module boundary so toggling this feature does not change the wasm
# artifact (cloister-99165e Taskfile rs:sign:wasm contract).
#
# `host` covers the three baseline schemes: `keychain://`,
# `secret-tool://`, `keyring://`, and `file://`. The keyring backend is
# wired directly to the `keyring` crate (no nono mediation) so the
# default deploy avoids the sigstore-verify / aws-lc-rs / landlock
# transitive closure flagged by the 2026-05-13 adversarial cycle row
# 17.1.
host = [
  "dep:keyring",
  "dep:zeroize",
  "dep:axum",
  "dep:tokio",
  "dep:tower",
  "dep:tower-http",
  "dep:serde",
  "dep:serde_json",
  "dep:base64ct",
  "dep:clap",
  "dep:tracing",
  "dep:tracing-subscriber",
]

# `host-extras` is additive: enables the `op://` (1Password CLI) and
# `apple-password://` (macOS `security` CLI) schemes. These schemes use
# `nono::keystore` for URI validation and dispatch logic, which is what
# drags in the sigstore-verify / aws-lc-rs / landlock closure. Operators
# who need 1Password / Apple Passwords integration opt in via
# `--features host,host-extras`; the default deploy stays minimal.
#
# Subprocess shims for `op` / `security` remain cloister-side (in
# `host::keystore::run_subprocess_with_trim`) so the PATH-hijack
# defense + `env_clear` allow-list (trust-root-friend F3 / 2026-05-13
# cycle §17.3) apply under host-extras too.
host-extras = [
  "host",
  "dep:nono",
]

[dependencies]
cms = { version = "0.2", default-features = false }
der = { version = "0.7", features = ["derive", "oid", "alloc"] }
x509-cert = { version = "0.2", default-features = false }
spki = { version = "0.7", features = ["alloc"] }
const-oid = { version = "0.9", features = ["db"] }
ed25519-dalek = { version = "~2.1", features = ["rand_core"] }  # tilde-pin: ADR-0019 §"Implementation pins" requires 2.1.x (math-friend's constant-time + alg-substitution defense)
sha2 = "0.10"
thiserror = "1.0"
log = "0.4"
libc = "0.2"

# Host-feature deps. Each is `optional = true` so the wasm32 build does
# NOT pull them in (the wasm artifact must remain byte-identical when
# the host feature is added — verified by `task rs:sign:wasm`).
#
# `keyring` — direct dep for the default `host` feature (post-2026-05-13
# cycle: avoids the sigstore-verify closure that came with nono).
# Platform features pinned per nono 0.54's verified-in-practice choices:
# `apple-native` on macOS, `sync-secret-service` on Linux (see the
# target-cfg sections below).
keyring             = { version = "3", optional = true }
zeroize             = { version = "1", optional = true, features = ["alloc"] }
# `nono` — only pulled in under `host-extras`. Provides URI validators
# + load_secret_by_ref dispatcher for the `op://` and `apple-password://`
# schemes. The sigstore-verify / aws-lc-rs / landlock closure flagged
# in 2026-05-13 §17.1 is the cost of opting in.
nono                = { version = "0.54", optional = true, default-features = false, features = ["system-keyring"] }
axum                = { version = "0.7", optional = true, default-features = false, features = ["http1", "tokio", "macros", "json", "query"] }
tokio               = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "signal", "time", "net", "sync"] }
tower               = { version = "0.5", optional = true, default-features = false, features = ["util"] }
tower-http          = { version = "0.6", optional = true, default-features = false, features = ["limit", "timeout"] }
serde               = { version = "1", optional = true, features = ["derive"] }
serde_json          = { version = "1", optional = true }
base64ct            = { version = "1", optional = true, features = ["alloc"] }
clap                = { version = "4", optional = true, features = ["derive"] }
tracing             = { version = "0.1", optional = true }
tracing-subscriber  = { version = "0.3", optional = true, features = ["env-filter", "fmt"] }

# Platform-specific keyring features. macOS uses the Security framework
# directly; Linux uses libsecret synchronously. Both run inside
# `spawn_blocking` so the sync variant is correct.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"], optional = true }

[dev-dependencies]
rand = "0.8"
hex = "0.4"
base64 = "0.22"
# Host-side tests use reqwest + tokio; cfg-gated so wasm build doesn't drag them.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "sync"] }
tempfile = "3"
