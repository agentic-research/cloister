args = ["python3", "-c", "import time\ntime.sleep(10**9)\n"]


[[wires]]
binding = "LISTENER_SOCK"
from = "caller"
to = "listener"
transport = "uds"

[[wires]]
binding = "SHARED_A_SOCK"
from = "caller"
to = "shared-a"
transport = "uds"

[[wires]]
binding = "T_ALICE"
from = "caller"
to = "tenant"
transport = "uds"

[[wires]]
binding = "T_BOB"
from = "caller"
to = "tenant"
transport = "uds"

[[routes]]
kind = "tenantDispatch"
path = "/"

[[routes.tenantDispatch.tenants]]
binding = "T_ALICE"
matchValue = "alice.example"
mode = "sni"
name = "alice"

[[routes.tenantDispatch.tenants]]
binding = "T_BOB"
matchValue = "/t/bob"
mode = "path-prefix"
name = "bob"

[[wires]]
binding = "WEB_URL"
from = "caller"
to = "web"
transport = "uds"

[[wires]]
binding = "ROUTER_WEB_URL"
from = "cloister-router"
to = "web"
transport = "uds"

[[wires]]
binding = "INNER_URL"
from = "caller"
to = "inner"
transport = "uds"

[[connections]]
from = "api"
name = "store"
appProtocol = "art.http"
minStrength = "capability"

[[connections.targets]]
env = "compose"
bundle = "store"
port = "main"
