# The input to `task smoke:compose-hold` (dev/compose-hold.mjs): a small
# cluster that is emitted as a compose file, started, and then tried.
#
# It exists to show that what `cloister cluster graph` says about a wire under
# compose is true of running containers (ADR-0075 §4.1). Each bundle is one
# public Python image that either serves a Unix socket or does nothing.
#
#   caller    ──▶ listener    declared, and listener has a directory of its
#                             own: caller connects, no one else can
#   bystander  ✗  listener    binds its own socket elsewhere, has no wire:
#                             the path does not exist in its container
#   idle       ✗  listener    binds nothing, dials nothing: the same
#   caller    ──▶ shared-a    declared, but shared-b binds in the same
#                             directory: the graph says `none` and names
#                             shared-b, and shared-b really can connect

[metadata]
name = "compose-hold"
version = "0.0.1"

[storage]

[[bundles]]
name = "listener"
kind = "external"
tier = "cluster"

[bundles.external]
image = "mcr.microsoft.com/cbl-mariner/base/python@sha256:d1dd9c1296ec1a311efc2dd35d74a9c8f2be3c5e264d9a26c847b1123807312c"
args = ["python3", "-c", "import socket,sys\ns=socket.socket(socket.AF_UNIX)\ns.bind(sys.argv[1])\ns.listen()\nwhile True:\n    c,_=s.accept()\n    c.sendall(b\"ok\")\n    c.close()\n", "/run/hold/listener/l.sock"]
ipcSocket = "/run/hold/listener/l.sock"

[[bundles]]
name = "caller"
kind = "external"
tier = "cluster"

[bundles.external]
image = "mcr.microsoft.com/cbl-mariner/base/python@sha256:d1dd9c1296ec1a311efc2dd35d74a9c8f2be3c5e264d9a26c847b1123807312c"
args = ["python3", "-c", "import time\ntime.sleep(10**9)\n"]

[[bundles]]
name = "bystander"
kind = "external"
tier = "cluster"

[bundles.external]
image = "mcr.microsoft.com/cbl-mariner/base/python@sha256:d1dd9c1296ec1a311efc2dd35d74a9c8f2be3c5e264d9a26c847b1123807312c"
args = ["python3", "-c", "import socket,sys\ns=socket.socket(socket.AF_UNIX)\ns.bind(sys.argv[1])\ns.listen()\nwhile True:\n    c,_=s.accept()\n    c.sendall(b\"ok\")\n    c.close()\n", "/run/hold/bystander/b.sock"]
ipcSocket = "/run/hold/bystander/b.sock"

[[bundles]]
name = "idle"
kind = "external"
tier = "cluster"

[bundles.external]
image = "mcr.microsoft.com/cbl-mariner/base/python@sha256:d1dd9c1296ec1a311efc2dd35d74a9c8f2be3c5e264d9a26c847b1123807312c"
args = ["python3", "-c", "import time\ntime.sleep(10**9)\n"]

[[bundles]]
name = "shared-a"
kind = "external"
tier = "cluster"

[bundles.external]
image = "mcr.microsoft.com/cbl-mariner/base/python@sha256:d1dd9c1296ec1a311efc2dd35d74a9c8f2be3c5e264d9a26c847b1123807312c"
args = ["python3", "-c", "import socket,sys\ns=socket.socket(socket.AF_UNIX)\ns.bind(sys.argv[1])\ns.listen()\nwhile True:\n    c,_=s.accept()\n    c.sendall(b\"ok\")\n    c.close()\n", "/run/hold/shared/a.sock"]
ipcSocket = "/run/hold/shared/a.sock"

[[bundles]]
name = "shared-b"
kind = "external"
tier = "cluster"

[bundles.external]
image = "mcr.microsoft.com/cbl-mariner/base/python@sha256:d1dd9c1296ec1a311efc2dd35d74a9c8f2be3c5e264d9a26c847b1123807312c"
args = ["python3", "-c", "import socket,sys\ns=socket.socket(socket.AF_UNIX)\ns.bind(sys.argv[1])\ns.listen()\nwhile True:\n    c,_=s.accept()\n    c.sendall(b\"ok\")\n    c.close()\n", "/run/hold/shared/b.sock"]
ipcSocket = "/run/hold/shared/b.sock"

[[wires]]
binding = "LISTENER_SOCK"
from = "caller"
to = "listener"
transport = "uds"

[[wires]]
binding = "SHARED_A_SOCK"
from = "caller"
to = "shared-a"
transport = "uds"
