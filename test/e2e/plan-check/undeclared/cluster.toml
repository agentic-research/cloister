[metadata]
name = "plan-check"
version = "0.0.0"

[storage]
[[bundles]]
name = "caller"
kind = "external"
tier = "cluster"

[bundles.external]
image = "registry.k8s.io/e2e-test-images/agnhost:2.53"
entryPoint = "/agnhost"
args = [ "pause" ]

[[bundles.external.env]]
name = "SERVER_URL"
connection = "server"

[[bundles.external.env]]
name = "LOG_LEVEL"
value = "info"

[[bundles.external.env]]
name = "DB_PASSWORD"
secret = "db-password"
secretKey = "latest"

[[bundles.placements]]
env = "prod"
kind = "kubernetes"

[[bundles]]
name = "server"
kind = "external"
tier = "cluster"

[bundles.external]
image = "registry.k8s.io/e2e-test-images/agnhost:2.53"
entryPoint = "/agnhost"
args = [ "netexec", "--http-port=8080" ]

[[bundles.ports]]
name = "http"
port = 8080
appProtocol = "art.http"
expose = "cluster"

[[bundles.placements]]
env = "prod"
kind = "kubernetes"

[[bundles]]
name = "probe"
kind = "external"
tier = "cluster"

[bundles.external]
image = "registry.k8s.io/e2e-test-images/agnhost:2.53"
entryPoint = "sh"
args = [ "-c", "curl -fsS --max-time 20 \"$SERVER_URL/hostname\"" ]
runs = "job"
env = []

[[bundles.placements]]
env = "prod"
kind = "kubernetes"

[[connections]]
from = "caller"
name = "server"
appProtocol = "art.http"

[[connections.targets]]
env = "prod"
bundle = "server"
port = "http"
