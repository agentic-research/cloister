[metadata]
name = "art-default"
version = "0.1.0"

[[bundles]]
description = "Gateway + Durable Object state (BeadStore, TrustStore, BlobStore)"
holdsCredential = [ "VAULT_KEK_SOURCE", "VAULT_STORE" ]
hypervisorRationale = "Mediates trust (lease verification, attestation rows, cross-DO handoff per ADR-0012). Compromise blast radius is multi-bundle (holds VAULT_STORE + every DO namespace). Singleton: the only TCP listener for external traffic (/mcp, /interlace/peers/{fp}). Three-criterion test per ADR-0011."
kind = "external"
name = "cloister-router"
tier = "hypervisor"
workerdServiceName = "cloister"

[bundles.external]
executionMode = "process"
executionModeRationale = "workerd keeps Workers in V8 isolates and starts no microVMs, so it can run inside one, keeping its isolates (ADR-0080). It needs, to run as a guest: its wires as declared connections, with the broker joining a connection between two placements and carrying its outbound fetches and its key helper on the host (ley-line-open-e2c5ce); Durable Object storage that survives a run (ley-line-open#600); and a service run with no wall-clock ceiling (ley-line-open-e6b1bb)."
httpPort = 8787
image = "cloister:0.1.0"
ipcSocket = "/run/cloister-uds/router.sock"

[[bundles.ports]]
appProtocol = "art.http"
expose = "edge"
name = "mcp"
port = 8787

[[bundles]]
description = "Identity authority — Signet master CA, lease cert mint"
hypervisorRationale = "Identity authority: mints lease certs against the master CA. Mediates trust (every authenticated request transits a lease this bundle minted). Compromise blast radius is cluster-wide (forge any peer's identity). Singleton per cluster (one master CA). Three-criterion test per ADR-0011, expanded in ADR-0018."
kind = "external"
name = "notme-identity"
tier = "hypervisor"

[bundles.external]
executionMode = "process"
executionModeRationale = "It holds the Signet master CA, the strongest case for isolation in the cluster. Its entryPoint is known: notme's image runs /usr/bin/workerd serve /app/config.capnp --experimental. It needs, to run as a guest: its listener (8788) as a declared port, reached across placements, with its key fetches and GitHub calls, through the broker (ley-line-open-e2c5ce); Durable Object storage that survives a run (ley-line-open#600); and a service run with no wall-clock ceiling (ley-line-open-e6b1bb). Tracked in cloister-5fe44f."
httpPort = 8788

[[bundles]]
description = "cloister-companion — UDS bridge for workerd (X-Cloister-Transport: uds) and mTLS forward proxy holding the bridge cert"
hypervisorRationale = "Holds the bridge cert + private key in process memory and presents them on outbound TLS, so no Worker ever holds a credential (notme/proxy README, two-plane model). Every attested egress and every UDS dial from workerd transits this bundle, so it mediates trust and its compromise blast radius is every upstream the cluster reaches. Singleton per host: one socket, one cert. Three-criterion test per ADR-0011; companion role per ADR-0005 (cloister-46fc1a, cloister-4cdba5)."
kind = "external"
name = "notme-proxy"
tier = "hypervisor"

[bundles.external]
executionMode = "process"
executionModeRationale = "It holds the bridge credential and mediates every attested egress. It already listens on TCP (--listen), which is how a guest is handed a channel (confinement/v1 §6). It needs, to run as a guest: its outbound mTLS through the broker (ley-line-open-e2c5ce); a path for the bridge credential into a guest (ADR-0076, Part B); its dial to rosary joined across placements until rosary is a guest too; a service run with no wall-clock ceiling (ley-line-open-e6b1bb); and its entryPoint declared (cloister-701b33)."
ipcSocket = "/run/cloister-uds/companion.sock"

[[bundles]]
description = "Code intelligence — symbol search, definitions, callgraph"
kind = "external"
name = "mache"
tier = "cluster"

[bundles.external]
args = [ "serve", "--http", "127.0.0.1:7532", "--path", "/work" ]
entryPoint = "/usr/local/bin/mache"
executionMode = "microvm"
httpPort = 7532
workspace = "write"

[[bundles.placements]]
env = "local"
kind = "microvm"

[[bundles.placements]]
env = "compose"
kind = "compose"
sharesNetworkOf = "cloister-router"

[[bundles.ports]]
appProtocol = "art.http"
expose = "cluster"
name = "mcp"
port = 7532

[[bundles]]
description = "Bead orchestrator — `rsry_bead_*` MCP tools, agent dispatch"
kind = "external"
name = "rosary"
tier = "cluster"

[bundles.external]
args = [ "mcp", "--ipc-socket", "/run/cloister-uds/rosary/rosary.sock" ]
executionMode = "process"
executionModeRationale = "It starts each agent by running cloister run as a host process (rosary:src/cloister_provider.rs). It needs, to run as a guest: that spawn turned into a request to cloister over a declared channel, so cloister starts the agent's run; its git worktrees as a workspace (ADR-0078) and its Keychain use as a vault slice (ADR-0010); its cluster transport (rsry mcp --ipc-socket), which listens only on a Unix socket, handed to it inside the guest (ley-line-open#601); and a service run with no wall-clock ceiling (ley-line-open-e6b1bb)."
ipcSocket = "/run/cloister-uds/rosary/rosary.sock"

[[wires]]
binding = "MACHE_BUNDLE"
from = "cloister-router"
to = "mache"
transport = "uds"

[[wires]]
binding = "ROSARY_BUNDLE"
from = "cloister-router"
to = "rosary"
transport = "uds"

[[wires]]
binding = "NOTME"
from = "cloister-router"
to = "notme-identity"
transport = "uds"

[[wires]]
binding = "COMPANION"
from = "cloister-router"
to = "notme-proxy"
transport = "uds"

[[wires]]
binding = "ROSARY_SOCKET"
from = "notme-proxy"
to = "rosary"
transport = "uds"

[inputs.llo]
ref = "github://agentic-research/ley-line-open/server.json@de638aeaf77133e6c14125a0f59f5f6b0acade00"
version = "0.30.0"
urlBinding = "LLO_MCP_URL"
serviceBinding = "LSP_MCP"

[inputs.notme]
ref = "github://agentic-research/notme/server.json@4bae2defb4eaf61046eac99ed23894ff51bf8d9a"
version = "0.2.0"

[inputs.mache]
ref = "github://agentic-research/mache/server.json@a585418c2eb11d32e2b166091716645c731bbcdc"
version = "0.17.0"
urlBinding = "MACHE_MCP_URL"
serviceBinding = "MACHE_MCP"

[inputs.rosary]
ref = "github://agentic-research/rosary/server.json@7ca39874672104d8e75cece51f9f0d3d2d9b8503"
version = "0.8.1"
urlBinding = "ROSARY_MCP_URL"
serviceBinding = "ROSARY_BUNDLE"

[inputs.canonical-hours]
ref = "github://agentic-research/canonical-hours/server.json@f7321b3c088a9fef61908225cadbfaab981c1c05"
version = "0.1.0"
urlBinding = "CANONICAL_HOURS_MCP_URL"

[[routes]]
kind = "health"
path = "/health"

[[routes]]
kind = "wellKnownInterlace"
path = "/.well-known/interlace/index.json"

[[routes]]
kind = "disclosure"
path = "/interlace/peers/:fp"

[[routes]]
kind = "wellKnownIdentityBridge"
path = "/.well-known/identity-bridge"

[[routes]]
kind = "ociRegistry"
path = "/v2"

[[routes]]
kind = "wellKnownMcpRegistry"
path = "/.well-known/mcp-registry"

[[routes]]
kind = "caBundle"
path = "/interlace/ca-bundle"

[[routes]]
kind = "vaultProxy"
path = "/vault/proxy"

[routes.vaultProxy]
bundleIdName = "cloister-router"

[[routes]]
kind = "serviceBindingProxy"
path = "/identity"

[routes.serviceBindingProxy]
binding = "NOTME"
stripPrefix = "/identity"
upstreamHost = "notme-bot"

[[routes]]
kind = "mcp"
path = "/mcp"

[[routes.mcp.backends]]
handlesPrefix = "bead_"
kind = "durableObject"
name = "bead"

[routes.mcp.backends.durableObject]
binding = "BEAD_STORE"
keyArg = "repo"

[[routes.mcp.backends.durableObject.tools]]
description = "Create a new bead (work item) in the store for the given repo."
inputSchemaJson = ""
name = "bead_create"

[[routes.mcp.backends.durableObject.tools]]
description = "Update fields on an existing bead."
inputSchemaJson = ""
name = "bead_update"

[[routes.mcp.backends.durableObject.tools]]
description = "Full-text search beads by title/description."
inputSchemaJson = ""
name = "bead_search"

[[routes.mcp.backends.durableObject.tools]]
description = "List beads, optionally filtered by state."
inputSchemaJson = ""
name = "bead_list"

[[routes.mcp.backends.durableObject.tools]]
description = "Mark a bead as done."
inputSchemaJson = ""
name = "bead_close"

[[routes.mcp.backends.durableObject.tools]]
description = "Add a comment to a bead."
inputSchemaJson = ""
name = "bead_comment"

[gateway.actor]
algorithm = "ed25519"
pubkeyBinding = "INTERLACE_MASTER_PUBKEY"

[[gateway.harnessTargets]]
apiKeyEnv = "ANTHROPIC_API_KEY"
authModes = [ "custody", "audit" ]
baseUrlEnv = "ANTHROPIC_BASE_URL"
executable = "claude"
name = "claude-code"
provenance = "https://github.com/anthropics/claude-code"
service = "anthropic"
stateDir = ".claude"
stateDirEnv = "CLAUDE_CONFIG_DIR"
stripEnv = [ "ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN" ]
subscriptionTokenEnv = "CLAUDE_CODE_OAUTH_TOKEN"

[[gateway.harnessTargets]]
apiKeyEnv = "OPENAI_API_KEY"
authModes = [ "custody" ]
baseUrlEnv = "OPENAI_BASE_URL"
name = "codex"
provenance = "https://github.com/openai/codex"
service = "openai"
stateDir = ".codex"
stateDirEnv = "CODEX_HOME"
stripEnv = [ "OPENAI_API_KEY", "OPENAI_AUTH_TOKEN" ]

[gateway.metadata]
metaNamespace = "art.cloister/v1"
name = "cloister-art"
version = "0.1.0"

[gateway.policy]
maxCertLifetimeSeconds = 300
minAlgorithm = "ed25519"
requireInterlock = true

[[gateway.skills]]
digest = "sha256:8940e07ea53b215ca934ea72539bcdc9878c74c659e1e13c5d7254220cd6a488"
name = "pr-board"

[[gateway.vaultProxyServices]]
defaultAllowedSubs = []
injection = "headerNamed"
name = "anthropic"
rateLimitPerMinute = 120
upstreamBaseUrl = "https://api.anthropic.com"

[gateway.vaultProxyServices.headerNamed]
name = "x-api-key"

[[gateway.vaultProxyServices]]
defaultAllowedSubs = []
injection = "authorizationBearer"
name = "openai"
rateLimitPerMinute = 120
upstreamBaseUrl = "https://api.openai.com"

[storage]
doStoragePath = "/data/do"
