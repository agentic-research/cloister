[metadata]
name = "art-default"
version = "0.1.0"

[[bundles]]
description = "Gateway + Durable Object state (BeadStore, TrustStore, BlobStore)"
holdsCredential = [ "VAULT_KEK_SOURCE", "VAULT_STORE" ]
hypervisorRationale = "Mediates trust (lease verification, attestation rows, cross-DO handoff per ADR-0012). Compromise blast radius is multi-bundle (holds VAULT_STORE + every DO namespace). Singleton: the only TCP listener for external traffic (/mcp, /interlace/peers/{fp}). Three-criterion test per ADR-0011."
kind = "external"
name = "cloister-router"
tier = "hypervisor"
workerdServiceName = "cloister"

  [bundles.external]
  httpPort = 8_787
  image = "cloister:0.1.0"
  ipcSocket = "/run/cloister-uds/router.sock"

[[bundles]]
description = "Identity authority — Signet master CA, lease cert mint"
hypervisorRationale = "Identity authority: mints lease certs against the master CA. Mediates trust (every authenticated request transits a lease this bundle minted). Compromise blast radius is cluster-wide (forge any peer's identity). Singleton per cluster (one master CA). Three-criterion test per ADR-0011, expanded in ADR-0018."
kind = "external"
name = "notme-identity"
tier = "hypervisor"

  [bundles.external]
  httpPort = 8_788
  image = "notme:0.1.0"

[[bundles]]
description = "Code intelligence — symbol search, definitions, callgraph"
kind = "external"
name = "mache"
tier = "cluster"

  [bundles.external]
  args = [ "serve", "--http", "localhost:7532" ]
  httpPort = 7_532
  image = "mache:0.13.0"

[[bundles]]
description = "Bead orchestrator — `rsry_bead_*` MCP tools, agent dispatch"
kind = "external"
name = "rosary"
tier = "cluster"

  [bundles.external]
  args = [ "mcp", "--ipc-socket", "/run/cloister-uds/rosary.sock" ]
  image = "rosary:0.2.0"
  ipcSocket = "/run/cloister-uds/rosary.sock"

[[wires]]
binding = "MACHE_BUNDLE"
from = "cloister-router"
to = "mache"
transport = "uds"

[[wires]]
binding = "ROSARY_BUNDLE"
from = "cloister-router"
to = "rosary"
transport = "uds"

[[wires]]
binding = "NOTME"
from = "cloister-router"
to = "notme-identity"
transport = "uds"

[inputs.llo]
ref = "io.github.org/agentic-research/ley-line-open@main"
version = "0.4.5"
from = "file:///Users/jamesgardner/remotes/art/ley-line-open/server.json"
urlBinding = "LLO_MCP_URL"
serviceBinding = "LSP_MCP"

[inputs.mache]
ref = "io.github.org/agentic-research/mache@main"
version = "0.13.0"
from = "file:///Users/jamesgardner/remotes/art/mache/server.json"
urlBinding = "MACHE_MCP_URL"
serviceBinding = "MACHE_MCP"

[inputs.rosary]
ref = "io.github.org/agentic-research/rosary@main"
version = "0.4.0"
from = "file:///Users/jamesgardner/remotes/art/rosary/server.json"
urlBinding = "ROSARY_MCP_URL"
serviceBinding = "ROSARY_MCP"

[[routes]]
kind = "health"
path = "/health"

[[routes]]
kind = "wellKnownInterlace"
path = "/.well-known/interlace/index.json"

[[routes]]
kind = "disclosure"
path = "/interlace/peers/:fp"

[[routes]]
kind = "wellKnownIdentityBridge"
path = "/.well-known/identity-bridge"

[[routes]]
kind = "ociRegistry"
path = "/v2"

[[routes]]
kind = "wellKnownMcpRegistry"
path = "/.well-known/mcp-registry"

[[routes]]
kind = "caBundle"
path = "/interlace/ca-bundle"

[[routes]]
kind = "vaultProxy"
path = "/vault/proxy"

  [routes.vaultProxy]
  bundleIdName = "cloister-router"

[[routes]]
kind = "serviceBindingProxy"
path = "/identity"

  [routes.serviceBindingProxy]
  binding = "NOTME"
  stripPrefix = "/identity"
  upstreamHost = "notme-bot"

[[routes]]
kind = "mcp"
path = "/mcp"

[[routes.mcp.backends]]
handlesPrefix = "bead_"
kind = "durableObject"
name = "bead"

  [routes.mcp.backends.durableObject]
  binding = "BEAD_STORE"
  keyArg = "repo"

    [[routes.mcp.backends.durableObject.tools]]
    description = "Create a new bead (work item) in the store for the given repo."
    inputSchemaJson = ""
    name = "bead_create"

    [[routes.mcp.backends.durableObject.tools]]
    description = "Update fields on an existing bead."
    inputSchemaJson = ""
    name = "bead_update"

    [[routes.mcp.backends.durableObject.tools]]
    description = "Full-text search beads by title/description."
    inputSchemaJson = ""
    name = "bead_search"

    [[routes.mcp.backends.durableObject.tools]]
    description = "List beads, optionally filtered by state."
    inputSchemaJson = ""
    name = "bead_list"

    [[routes.mcp.backends.durableObject.tools]]
    description = "Mark a bead as done."
    inputSchemaJson = ""
    name = "bead_close"

    [[routes.mcp.backends.durableObject.tools]]
    description = "Add a comment to a bead."
    inputSchemaJson = ""
    name = "bead_comment"

[[routes.mcp.backends]]
handlesPrefix = "rsry_"
kind = "mcpProxy"
name = "rsry"

  [routes.mcp.backends.mcpProxy]
  claims = [
  "rsry_bead_create",
  "rsry_bead_search",
  "rsry_bead_close",
  "rsry_bead_update",
  "rsry_bead_comment",
  "rsry_bead_comment_list",
  "rsry_bead_comment_update",
  "rsry_bead_comment_delete",
  "rsry_bead_link",
  "rsry_bead_import",
  "rsry_list_beads",
  "rsry_status",
  "rsry_active",
  "rsry_dispatch",
  "rsry_dispatch_record",
  "rsry_dispatch_history",
  "rsry_scan",
  "rsry_review",
  "rsry_run_once",
  "rsry_decompose",
  "rsry_decade_list",
  "rsry_decade_create",
  "rsry_thread_list",
  "rsry_thread_create",
  "rsry_thread_assign",
  "rsry_thread_reparent",
  "rsry_workspace_create",
  "rsry_workspace_checkpoint",
  "rsry_workspace_cleanup",
  "rsry_workspace_merge",
  "rsry_repo_list",
  "rsry_repo_register",
  "rsry_pipeline_query",
  "rsry_pipeline_upsert",
  "rsry_ticket_load"
]
  dynamicTools = true
  protocolMode = ""
  requiresSession = true
  serviceBinding = "ROSARY_BUNDLE"
  stripPrefix = ""
  tools = [ ]
  urlBinding = "ROSARY_MCP_URL"

[gateway.actor]
algorithm = "ed25519"
fingerprint = "sha256:placeholder-pinned-at-deploy-time"
pubkeyBinding = "INTERLACE_MASTER_PUBKEY"

[gateway.metadata]
name = "cloister-art"
version = "0.1.0"

[gateway.policy]
maxCertLifetimeSeconds = 300
minAlgorithm = "ed25519"
requireInterlock = true

[[gateway.vaultProxyServices]]
defaultAllowedSubs = [ ]
injection = "headerNamed"
name = "anthropic"
rateLimitPerMinute = 120
upstreamBaseUrl = "https://api.anthropic.com"

  [gateway.vaultProxyServices.headerNamed]
  name = "x-api-key"

[storage]
doStoragePath = "/data/do"
