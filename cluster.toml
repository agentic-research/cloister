[metadata]
name = "art-default"
version = "0.1.0"

[[bundles]]
description = "Gateway + Durable Object state (BeadStore, TrustStore, BlobStore). executionMode = \"process\": this IS the workerd host, so it is not itself a microVM payload. Stated rather than left ambient per ADR-0048 (cloister-54b834)."
holdsCredential = [ "VAULT_KEK_SOURCE", "VAULT_STORE" ]
hypervisorRationale = "Mediates trust (lease verification, attestation rows, cross-DO handoff per ADR-0012). Compromise blast radius is multi-bundle (holds VAULT_STORE + every DO namespace). Singleton: the only TCP listener for external traffic (/mcp, /interlace/peers/{fp}). Three-criterion test per ADR-0011."
kind = "external"
name = "cloister-router"
tier = "hypervisor"
workerdServiceName = "cloister"

[bundles.external]
executionMode = "process"
executionModeRationale = "STRUCTURAL and permanent. This IS the workerd host, and the hypervisor cannot be placed inside its own guest. No future work removes this exemption."
httpPort = 8787
image = "cloister:0.1.0"
ipcSocket = "/run/cloister-uds/router.sock"

[[bundles]]
description = "Identity authority — Signet master CA, lease cert mint"
hypervisorRationale = "Identity authority: mints lease certs against the master CA. Mediates trust (every authenticated request transits a lease this bundle minted). Compromise blast radius is cluster-wide (forge any peer's identity). Singleton per cluster (one master CA). Three-criterion test per ADR-0011, expanded in ADR-0018."
kind = "external"
name = "notme-identity"
tier = "hypervisor"

[bundles.external]
executionMode = "process"
executionModeRationale = "UNDECIDED, and the only exemption with no known blocker. This bundle holds the Signet master CA and mints lease certs, so it carries the highest-value secret in the cluster and the strongest case for isolation. Unlike notme-proxy and rosary it binds a TCP port rather than a UDS, so the krunvm UDS gap (cloister-66badb) does NOT apply to it. What stops it is only the missing entryPoint, so task runtime:plan cannot emit a plan in either mode (cloister-701b33). That makes it the cheapest exemption to withdraw and the most valuable one to withdraw. Nobody chose no-isolation here; nobody chose anything. Tracked in cloister-5fe44f."
httpPort = 8788

[[bundles]]
description = "cloister-companion — UDS bridge for workerd (X-Cloister-Transport: uds) and mTLS forward proxy holding the bridge cert"
hypervisorRationale = "Holds the bridge cert + private key in process memory and presents them on outbound TLS, so no Worker ever holds a credential (notme/proxy README, two-plane model). Every attested egress and every UDS dial from workerd transits this bundle, so it mediates trust and its compromise blast radius is every upstream the cluster reaches. Singleton per host: one socket, one cert. Three-criterion test per ADR-0011; companion role per ADR-0005 (cloister-46fc1a, cloister-4cdba5)."
kind = "external"
name = "notme-proxy"
tier = "hypervisor"

[bundles.external]
executionMode = "process"
executionModeRationale = "STRUCTURAL today, for a reason I initially got wrong. Holds the bridge cert and private key and mediates every attested egress, so the hypervisorRationale in this same entry says its compromise blast radius is every upstream the cluster reaches. This field first read: same shape as mache, which IS microvm, so no evident structural blocker, only unfinished packaging. That was WRONG. mache binds a TCP port; this bundle is UDS-only, and the krunvm host runtime cannot express that at all: krunvm.rs:769 hard-errors when confinement.port.bind == 0 and the crate has zero UDS support (cloister-66badb). So microvm is not available to it yet, independent of the missing entryPoint (cloister-701b33). Both are prerequisites."
ipcSocket = "/run/cloister-uds/companion.sock"

[[bundles]]
description = "Code intelligence — symbol search, definitions, callgraph"
kind = "external"
name = "mache"
tier = "cluster"

[[bundles.confinement.fs.allow]]
path = "/workspace"
mode = "rw"

[bundles.confinement.port]
address = "127.0.0.1"
bind = 7532

[bundles.external]
args = [ "serve", "--http", "127.0.0.1:7532", "--path", "/workspace" ]
entryPoint = "/usr/local/bin/mache"
executionMode = "microvm"
httpPort = 7532

[[bundles]]
description = "Bead orchestrator — `rsry_bead_*` MCP tools, agent dispatch. executionMode is deliberately \"process\", not \"microvm\": rosary dispatches host subprocess agents (claude/codex/gemini) and touches git worktrees + Keychain, none of which survive VM isolation. Stated rather than left ambient, per ADR-0048 (cloister-cb735c)."
kind = "external"
name = "rosary"
tier = "cluster"

[bundles.external]
args = [ "mcp", "--ipc-socket", "/run/cloister-uds/rosary.sock" ]
executionMode = "process"
executionModeRationale = "STRUCTURAL, and this field previously recorded it wrong. It first said the exemption was CONTINGENT because rosary-56b557 would make cloister a ComputeProvider and remove the host-subprocess requirement. That work shipped (rosary #464, CloisterProvider) and the requirement did not go away. CloisterProvider confines the DISPATCHED AGENT -- each agent now runs under cloister run rather than as a bare host subprocess, which is a real gain for those agents -- but rosary itself is what spawns them, so this bundle still needs host-process capability. Confining what a process spawns is not the same as confining the process. Independently fatal to a flip today: this bundle is UDS-only, and rs/crates/host-runtime/src/krunvm.rs:769 hard-errors when confinement.port.bind == 0, with zero UDS support in the crate (cloister-66badb). Withdraw this only when the long-running MCP bundle no longer needs to spawn, not when its agents are confined."
ipcSocket = "/run/cloister-uds/rosary.sock"

[[wires]]
binding = "MACHE_BUNDLE"
from = "cloister-router"
to = "mache"
transport = "uds"

[[wires]]
binding = "ROSARY_BUNDLE"
from = "cloister-router"
to = "rosary"
transport = "uds"

[[wires]]
binding = "NOTME"
from = "cloister-router"
to = "notme-identity"
transport = "uds"

[[wires]]
binding = "COMPANION"
from = "cloister-router"
to = "notme-proxy"
transport = "uds"

[inputs.llo]
ref = "github://agentic-research/ley-line-open/server.json@32e9dab2c3c39b949112ae7fc4dd0619e711f7d9"
version = "0.17.0"
urlBinding = "LLO_MCP_URL"
serviceBinding = "LSP_MCP"

[inputs.notme]
ref = "github://agentic-research/notme/server.json@4bae2defb4eaf61046eac99ed23894ff51bf8d9a"
version = "0.2.0"

[inputs.mache]
ref = "github://agentic-research/mache/server.json@a585418c2eb11d32e2b166091716645c731bbcdc"
version = "0.17.0"
urlBinding = "MACHE_MCP_URL"
serviceBinding = "MACHE_MCP"

[inputs.rosary]
ref = "github://agentic-research/rosary/server.json@7ca39874672104d8e75cece51f9f0d3d2d9b8503"
version = "0.8.1"
urlBinding = "ROSARY_MCP_URL"
serviceBinding = "ROSARY_BUNDLE"

[inputs.canonical-hours]
ref = "github://agentic-research/canonical-hours/server.json@f7321b3c088a9fef61908225cadbfaab981c1c05"
version = "0.1.0"
urlBinding = "CANONICAL_HOURS_MCP_URL"

[[routes]]
kind = "health"
path = "/health"

[[routes]]
kind = "wellKnownInterlace"
path = "/.well-known/interlace/index.json"

[[routes]]
kind = "disclosure"
path = "/interlace/peers/:fp"

[[routes]]
kind = "wellKnownIdentityBridge"
path = "/.well-known/identity-bridge"

[[routes]]
kind = "ociRegistry"
path = "/v2"

[[routes]]
kind = "wellKnownMcpRegistry"
path = "/.well-known/mcp-registry"

[[routes]]
kind = "caBundle"
path = "/interlace/ca-bundle"

[[routes]]
kind = "vaultProxy"
path = "/vault/proxy"

[routes.vaultProxy]
bundleIdName = "cloister-router"

[[routes]]
kind = "serviceBindingProxy"
path = "/identity"

[routes.serviceBindingProxy]
binding = "NOTME"
stripPrefix = "/identity"
upstreamHost = "notme-bot"

[[routes]]
kind = "mcp"
path = "/mcp"

[[routes.mcp.backends]]
handlesPrefix = "bead_"
kind = "durableObject"
name = "bead"

[routes.mcp.backends.durableObject]
binding = "BEAD_STORE"
keyArg = "repo"

[[routes.mcp.backends.durableObject.tools]]
description = "Create a new bead (work item) in the store for the given repo."
inputSchemaJson = ""
name = "bead_create"

[[routes.mcp.backends.durableObject.tools]]
description = "Update fields on an existing bead."
inputSchemaJson = ""
name = "bead_update"

[[routes.mcp.backends.durableObject.tools]]
description = "Full-text search beads by title/description."
inputSchemaJson = ""
name = "bead_search"

[[routes.mcp.backends.durableObject.tools]]
description = "List beads, optionally filtered by state."
inputSchemaJson = ""
name = "bead_list"

[[routes.mcp.backends.durableObject.tools]]
description = "Mark a bead as done."
inputSchemaJson = ""
name = "bead_close"

[[routes.mcp.backends.durableObject.tools]]
description = "Add a comment to a bead."
inputSchemaJson = ""
name = "bead_comment"

[gateway.actor]
algorithm = "ed25519"
pubkeyBinding = "INTERLACE_MASTER_PUBKEY"

[[gateway.harnessTargets]]
apiKeyEnv = "ANTHROPIC_API_KEY"
authModes = [ "custody", "audit" ]
baseUrlEnv = "ANTHROPIC_BASE_URL"
executable = "claude"
name = "claude-code"
provenance = "https://github.com/anthropics/claude-code"
service = "anthropic"
stateDir = ".claude"
stateDirEnv = "CLAUDE_CONFIG_DIR"
stripEnv = [ "ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN" ]

[[gateway.harnessTargets]]
apiKeyEnv = "OPENAI_API_KEY"
authModes = [ "custody" ]
baseUrlEnv = "OPENAI_BASE_URL"
name = "codex"
provenance = "https://github.com/openai/codex"
service = "openai"
stateDir = ".codex"
stateDirEnv = "CODEX_HOME"
stripEnv = [ "OPENAI_API_KEY", "OPENAI_AUTH_TOKEN" ]

[gateway.metadata]
metaNamespace = "art.cloister/v1"
name = "cloister-art"
version = "0.1.0"

[gateway.policy]
maxCertLifetimeSeconds = 300
minAlgorithm = "ed25519"
requireInterlock = true

[[gateway.skills]]
digest = "sha256:8940e07ea53b215ca934ea72539bcdc9878c74c659e1e13c5d7254220cd6a488"
name = "pr-board"

[[gateway.vaultProxyServices]]
defaultAllowedSubs = []
injection = "headerNamed"
name = "anthropic"
rateLimitPerMinute = 120
upstreamBaseUrl = "https://api.anthropic.com"

[gateway.vaultProxyServices.headerNamed]
name = "x-api-key"

[[gateway.vaultProxyServices]]
defaultAllowedSubs = []
injection = "authorizationBearer"
name = "openai"
rateLimitPerMinute = 120
upstreamBaseUrl = "https://api.openai.com"

[storage]
doStoragePath = "/data/do"
