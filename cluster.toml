[metadata]
name = "art-default"
version = "0.1.0"

[[bundles]]
description = "Gateway + Durable Object state (BeadStore, TrustStore, BlobStore)"
holdsCredential = [ "VAULT_KEK_SOURCE", "VAULT_STORE" ]
hypervisorRationale = "Mediates trust (lease verification, attestation rows, cross-DO handoff per ADR-0012). Compromise blast radius is multi-bundle (holds VAULT_STORE + every DO namespace). Singleton: the only TCP listener for external traffic (/mcp, /interlace/peers/{fp}). Three-criterion test per ADR-0011."
kind = "external"
name = "cloister-router"
tier = "hypervisor"
workerdServiceName = "cloister"

[bundles.external]
executionMode = "process"
executionModeRationale = "CONTINGENT, and recorded wrong until now as permanent. It read that this IS the workerd host, and the hypervisor cannot be placed inside its own guest. Those are two hypervisors: the gateway is the V8-isolate one, and a microVM's is libkrun, which ley-line-open runs; the gateway starts no guests. workerd in a microVM keeps its isolates and gains a kernel boundary (ADR-0078). What stops it is engineering. Each wire to a bundle becomes a declared connection, and a connection between two placements needs the broker (ley-line-open-e2c5ce), as do its outbound fetches and its key helper on the host. Its Durable Object storage must survive a run (ley-line-open#600). A service run is stopped at the wall-clock ceiling until ley-line-open-e6b1bb."
httpPort = 8787
image = "cloister:0.1.0"
ipcSocket = "/run/cloister-uds/router.sock"

[[bundles.ports]]
appProtocol = "art.http"
expose = "edge"
name = "mcp"
port = 8787

[[bundles]]
description = "Identity authority — Signet master CA, lease cert mint"
hypervisorRationale = "Identity authority: mints lease certs against the master CA. Mediates trust (every authenticated request transits a lease this bundle minted). Compromise blast radius is cluster-wide (forge any peer's identity). Singleton per cluster (one master CA). Three-criterion test per ADR-0011, expanded in ADR-0018."
kind = "external"
name = "notme-identity"
tier = "hypervisor"

[bundles.external]
executionMode = "process"
executionModeRationale = "CONTINGENT. It holds the Signet master CA, so it has the strongest case for isolation in the cluster. This read that only a missing entryPoint stopped it, and there is more. The entryPoint is known: notme's image runs /usr/bin/workerd serve /app/config.capnp --experimental. What remains is engineering. runtime import and runtime plan refuse a bundle pinned through a multi-image producer's [[inputs.notme.ociBundles]], as this one is. Its listener (8788) becomes a declared port, which the gateway reaches across placements through the broker (ley-line-open-e2c5ce), as do its key fetches and GitHub calls. Its Durable Object storage must survive a run (ley-line-open#600). A service run is stopped at the wall-clock ceiling until ley-line-open-e6b1bb. Tracked in cloister-5fe44f."
httpPort = 8788

[[bundles]]
description = "cloister-companion — UDS bridge for workerd (X-Cloister-Transport: uds) and mTLS forward proxy holding the bridge cert"
hypervisorRationale = "Holds the bridge cert + private key in process memory and presents them on outbound TLS, so no Worker ever holds a credential (notme/proxy README, two-plane model). Every attested egress and every UDS dial from workerd transits this bundle, so it mediates trust and its compromise blast radius is every upstream the cluster reaches. Singleton per host: one socket, one cert. Three-criterion test per ADR-0011; companion role per ADR-0005 (cloister-46fc1a, cloister-4cdba5)."
kind = "external"
name = "notme-proxy"
tier = "hypervisor"

[bundles.external]
executionMode = "process"
executionModeRationale = "CONTINGENT, and the blocker this cited is gone. It read that the krunvm backend could not serve a bundle that listens only on a Unix socket. #262 replaced that backend with ley-line-open's execution API, which carries socket channels (confinement/v1 §6) and presents one to a guest as TCP on its loopback, and this proxy already listens on TCP (--listen). What remains is engineering. Its outbound mTLS goes through the broker (ley-line-open-e2c5ce). The bridge credential it holds has no path into a guest until ADR-0076 Part B. Its dial to rosary, a process bundle, crosses placements. A service run is stopped at the wall-clock ceiling until ley-line-open-e6b1bb. Its entryPoint is undeclared (cloister-701b33)."
ipcSocket = "/run/cloister-uds/companion.sock"

[[bundles]]
description = "Code intelligence — symbol search, definitions, callgraph"
kind = "external"
name = "mache"
tier = "cluster"

[bundles.external]
args = [ "serve", "--http", "127.0.0.1:7532", "--path", "/work" ]
entryPoint = "/usr/local/bin/mache"
executionMode = "microvm"
httpPort = 7532
workspace = "write"

[[bundles.placements]]
env = "local"
kind = "microvm"

[[bundles.placements]]
env = "compose"
kind = "compose"
sharesNetworkOf = "cloister-router"

[[bundles.ports]]
appProtocol = "art.http"
expose = "cluster"
name = "mcp"
port = 7532

[[bundles]]
description = "Bead orchestrator — `rsry_bead_*` MCP tools, agent dispatch"
kind = "external"
name = "rosary"
tier = "cluster"

[bundles.external]
args = [ "mcp", "--ipc-socket", "/run/cloister-uds/rosary/rosary.sock" ]
executionMode = "process"
executionModeRationale = "CONTINGENT, on engineering. rosary starts each agent by running cloister run as a host process (rosary:src/cloister_provider.rs), so it needs to spawn. That becomes a request to cloister over a declared channel, so cloister starts the agent's run instead of rosary forking it. Its git worktrees are a workspace (ADR-0078), and its Keychain use is a vault slice (ADR-0010). Its cluster transport (rsry mcp --ipc-socket) listens only on a Unix socket, and the microVM tier presents a channel to a guest only as TCP on its loopback, so either rosary listens on TCP or ley-line-open presents a socket inside the guest (ley-line-open#601). The krunvm limit this cited is gone: #262 replaced that backend with ley-line-open's execution API. A service run is stopped at the wall-clock ceiling until ley-line-open-e6b1bb."
ipcSocket = "/run/cloister-uds/rosary/rosary.sock"

[[wires]]
binding = "MACHE_BUNDLE"
from = "cloister-router"
to = "mache"
transport = "uds"

[[wires]]
binding = "ROSARY_BUNDLE"
from = "cloister-router"
to = "rosary"
transport = "uds"

[[wires]]
binding = "NOTME"
from = "cloister-router"
to = "notme-identity"
transport = "uds"

[[wires]]
binding = "COMPANION"
from = "cloister-router"
to = "notme-proxy"
transport = "uds"

[[wires]]
binding = "ROSARY_SOCKET"
from = "notme-proxy"
to = "rosary"
transport = "uds"

[inputs.llo]
ref = "github://agentic-research/ley-line-open/server.json@de638aeaf77133e6c14125a0f59f5f6b0acade00"
version = "0.30.0"
urlBinding = "LLO_MCP_URL"
serviceBinding = "LSP_MCP"

[inputs.notme]
ref = "github://agentic-research/notme/server.json@4bae2defb4eaf61046eac99ed23894ff51bf8d9a"
version = "0.2.0"

[inputs.mache]
ref = "github://agentic-research/mache/server.json@a585418c2eb11d32e2b166091716645c731bbcdc"
version = "0.17.0"
urlBinding = "MACHE_MCP_URL"
serviceBinding = "MACHE_MCP"

[inputs.rosary]
ref = "github://agentic-research/rosary/server.json@7ca39874672104d8e75cece51f9f0d3d2d9b8503"
version = "0.8.1"
urlBinding = "ROSARY_MCP_URL"
serviceBinding = "ROSARY_BUNDLE"

[inputs.canonical-hours]
ref = "github://agentic-research/canonical-hours/server.json@f7321b3c088a9fef61908225cadbfaab981c1c05"
version = "0.1.0"
urlBinding = "CANONICAL_HOURS_MCP_URL"

[[routes]]
kind = "health"
path = "/health"

[[routes]]
kind = "wellKnownInterlace"
path = "/.well-known/interlace/index.json"

[[routes]]
kind = "disclosure"
path = "/interlace/peers/:fp"

[[routes]]
kind = "wellKnownIdentityBridge"
path = "/.well-known/identity-bridge"

[[routes]]
kind = "ociRegistry"
path = "/v2"

[[routes]]
kind = "wellKnownMcpRegistry"
path = "/.well-known/mcp-registry"

[[routes]]
kind = "caBundle"
path = "/interlace/ca-bundle"

[[routes]]
kind = "vaultProxy"
path = "/vault/proxy"

[routes.vaultProxy]
bundleIdName = "cloister-router"

[[routes]]
kind = "serviceBindingProxy"
path = "/identity"

[routes.serviceBindingProxy]
binding = "NOTME"
stripPrefix = "/identity"
upstreamHost = "notme-bot"

[[routes]]
kind = "mcp"
path = "/mcp"

[[routes.mcp.backends]]
handlesPrefix = "bead_"
kind = "durableObject"
name = "bead"

[routes.mcp.backends.durableObject]
binding = "BEAD_STORE"
keyArg = "repo"

[[routes.mcp.backends.durableObject.tools]]
description = "Create a new bead (work item) in the store for the given repo."
inputSchemaJson = ""
name = "bead_create"

[[routes.mcp.backends.durableObject.tools]]
description = "Update fields on an existing bead."
inputSchemaJson = ""
name = "bead_update"

[[routes.mcp.backends.durableObject.tools]]
description = "Full-text search beads by title/description."
inputSchemaJson = ""
name = "bead_search"

[[routes.mcp.backends.durableObject.tools]]
description = "List beads, optionally filtered by state."
inputSchemaJson = ""
name = "bead_list"

[[routes.mcp.backends.durableObject.tools]]
description = "Mark a bead as done."
inputSchemaJson = ""
name = "bead_close"

[[routes.mcp.backends.durableObject.tools]]
description = "Add a comment to a bead."
inputSchemaJson = ""
name = "bead_comment"

[gateway.actor]
algorithm = "ed25519"
pubkeyBinding = "INTERLACE_MASTER_PUBKEY"

[[gateway.harnessTargets]]
apiKeyEnv = "ANTHROPIC_API_KEY"
authModes = [ "custody", "audit" ]
baseUrlEnv = "ANTHROPIC_BASE_URL"
executable = "claude"
name = "claude-code"
provenance = "https://github.com/anthropics/claude-code"
service = "anthropic"
stateDir = ".claude"
stateDirEnv = "CLAUDE_CONFIG_DIR"
stripEnv = [ "ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN" ]
subscriptionTokenEnv = "CLAUDE_CODE_OAUTH_TOKEN"

[[gateway.harnessTargets]]
apiKeyEnv = "OPENAI_API_KEY"
authModes = [ "custody" ]
baseUrlEnv = "OPENAI_BASE_URL"
name = "codex"
provenance = "https://github.com/openai/codex"
service = "openai"
stateDir = ".codex"
stateDirEnv = "CODEX_HOME"
stripEnv = [ "OPENAI_API_KEY", "OPENAI_AUTH_TOKEN" ]

[gateway.metadata]
metaNamespace = "art.cloister/v1"
name = "cloister-art"
version = "0.1.0"

[gateway.policy]
maxCertLifetimeSeconds = 300
minAlgorithm = "ed25519"
requireInterlock = true

[[gateway.skills]]
digest = "sha256:8940e07ea53b215ca934ea72539bcdc9878c74c659e1e13c5d7254220cd6a488"
name = "pr-board"

[[gateway.vaultProxyServices]]
defaultAllowedSubs = []
injection = "headerNamed"
name = "anthropic"
rateLimitPerMinute = 120
upstreamBaseUrl = "https://api.anthropic.com"

[gateway.vaultProxyServices.headerNamed]
name = "x-api-key"

[[gateway.vaultProxyServices]]
defaultAllowedSubs = []
injection = "authorizationBearer"
name = "openai"
rateLimitPerMinute = 120
upstreamBaseUrl = "https://api.openai.com"

[storage]
doStoragePath = "/data/do"
