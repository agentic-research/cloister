name: art-default

services:
  cloister-router:
    image: cloister:0.1.0
    pull_policy: never
    container_name: cloister-cloister-router
    labels:
      - "cloister.bundle=cloister-router"
      - "cloister.tier=hypervisor"
      - "cloister.description=cloister:0.1.0 — Gateway + Durable Object state (BeadStore, TrustStore, BlobStore)"
      - "cloister.colocated-inputs=llo"
    ports:
      - "8787:8787"
    volumes:
      - cloister-uds:/run/cloister-uds
      - cloister-do:/data/do
    environment:
      - "MACHE_BUNDLE=http://127.0.0.1:7532"
      - "ROSARY_BUNDLE=/run/cloister-uds/rosary.sock"
      - "NOTME=http://notme-identity:8788"

  notme-identity:
    image: notme:0.1.0
    pull_policy: never
    container_name: cloister-notme-identity
    labels:
      - "cloister.bundle=notme-identity"
      - "cloister.tier=hypervisor"
      - "cloister.description=notme:0.1.0 — Identity authority — Signet master CA, lease cert mint"
    ports:
      - "8788:8788"
    volumes:
      - cloister-uds:/run/cloister-uds

  mache:
    image: mache:0.8.0
    pull_policy: never
    container_name: cloister-mache
    labels:
      - "cloister.bundle=mache"
      - "cloister.tier=cluster"
      - "cloister.description=mache:0.8.0 — Code intelligence — symbol search, definitions, callgraph"
    command:
      - "serve"
      - "--http"
      - "localhost:7532"
    network_mode: "service:cloister-router"
    volumes:
      - cloister-uds:/run/cloister-uds

  rosary:
    image: rosary:0.2.0
    pull_policy: never
    container_name: cloister-rosary
    labels:
      - "cloister.bundle=rosary"
      - "cloister.tier=cluster"
      - "cloister.description=rosary:0.2.0 — Bead orchestrator — `rsry_bead_*` MCP tools, agent dispatch"
    command:
      - "mcp"
      - "--ipc-socket"
      - "/run/cloister-uds/rosary.sock"
    volumes:
      - cloister-uds:/run/cloister-uds

volumes:
  cloister-uds:
    driver: local
    # tmpfs is fine — UDS sockets are ephemeral; recreated on container start
  cloister-do:
    driver: local
    # SQLite DO storage — survives container restarts; backup target
