# Runs the bundles placed "compose" for env "compose".

name: art-default

services:
  cloister-router:
    image: cloister:0.1.0
    pull_policy: never
    container_name: cloister-cloister-router
    labels:
      - "cloister.bundle=cloister-router"
      - "cloister.tier=hypervisor"
      - "cloister.description=cloister:0.1.0 — Gateway + Durable Object state (BeadStore, TrustStore, BlobStore)"
      - "cloister.colocated-inputs=llo,notme,canonical-hours"
    networks:
      - wire-cloister-router-notme-identity
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - uds-run-cloister-uds:/run/cloister-uds
      - uds-run-cloister-uds-rosary:/run/cloister-uds/rosary
      - cloister-do:/data/do
    environment:
      - "MACHE_BUNDLE=http://127.0.0.1:7532"
      - "ROSARY_BUNDLE=/run/cloister-uds/rosary/rosary.sock"
      - "NOTME=http://notme-identity:8788"
      - "COMPANION=/run/cloister-uds/companion.sock"

  notme-identity:
    image: ghcr.io/agentic-research/notme@sha256:56fd69dd51e5f4269f11cd541245e061ca54acd3f6f8ea52b12155b7f421b95b
    pull_policy: never
    container_name: cloister-notme-identity
    labels:
      - "cloister.bundle=notme-identity"
      - "cloister.tier=hypervisor"
      - "cloister.description=ghcr.io/agentic-research/notme@sha256:56fd69dd51e5f4269f11cd541245e061ca54acd3f6f8ea52b12155b7f421b95b — Identity authority — Signet master CA, lease cert mint"
    networks:
      - wire-cloister-router-notme-identity
    # not published: httpPort 8788 is reached through this bundle's wires only. A [[bundles.ports]] row for it with expose = "edge" publishes it on 127.0.0.1

  notme-proxy:
    image: ghcr.io/agentic-research/notme-proxy@sha256:fdfa077c3eecfb568879393e10c8ee7e81f04b41c31e25fb8bc479f63cffac64
    pull_policy: never
    container_name: cloister-notme-proxy
    labels:
      - "cloister.bundle=notme-proxy"
      - "cloister.tier=hypervisor"
      - "cloister.description=ghcr.io/agentic-research/notme-proxy@sha256:fdfa077c3eecfb568879393e10c8ee7e81f04b41c31e25fb8bc479f63cffac64 — cloister-companion — UDS bridge for workerd (X-Cloister-Transport: uds) and mTLS forward proxy holding the bridge cert"
    networks:
      - solo-notme-proxy
    volumes:
      - uds-run-cloister-uds:/run/cloister-uds
      - uds-run-cloister-uds-rosary:/run/cloister-uds/rosary
    environment:
      - "ROSARY_SOCKET=/run/cloister-uds/rosary/rosary.sock"

  mache:
    image: ghcr.io/agentic-research/mache@sha256:8620a0dc2d4c2ae7f6cc1f0ee68d6823a8bc9af6a8cf01d332c08738d9203ac7
    pull_policy: never
    container_name: cloister-mache
    labels:
      - "cloister.bundle=mache"
      - "cloister.tier=cluster"
      - "cloister.description=ghcr.io/agentic-research/mache@sha256:8620a0dc2d4c2ae7f6cc1f0ee68d6823a8bc9af6a8cf01d332c08738d9203ac7 — Code intelligence — symbol search, definitions, callgraph"
      - "cloister.colocated-inputs=mache"
    command:
      - "serve"
      - "--http"
      - "127.0.0.1:7532"
      - "--path"
      - "/work"
    network_mode: "service:cloister-router"
    volumes:
      - type: bind
        source: "${CLOISTER_WORKSPACE:-.}"
        target: /work

  rosary:
    image: ghcr.io/agentic-research/rosary@sha256:38aadea5d94b5f96ea43d9decd3c6f46f97c71a765fc73afd5f44387c21800ad
    pull_policy: never
    container_name: cloister-rosary
    labels:
      - "cloister.bundle=rosary"
      - "cloister.tier=cluster"
      - "cloister.description=ghcr.io/agentic-research/rosary@sha256:38aadea5d94b5f96ea43d9decd3c6f46f97c71a765fc73afd5f44387c21800ad — Bead orchestrator — `rsry_bead_*` MCP tools, agent dispatch"
      - "cloister.colocated-inputs=rosary"
    command:
      - "mcp"
      - "--ipc-socket"
      - "/run/cloister-uds/rosary/rosary.sock"
    networks:
      - solo-rosary
    volumes:
      - uds-run-cloister-uds-rosary:/run/cloister-uds/rosary

volumes:
  uds-run-cloister-uds:
    # /run/cloister-uds — held by cloister-router, notme-proxy
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "mode=1777"
  uds-run-cloister-uds-rosary:
    # /run/cloister-uds/rosary — held by rosary, cloister-router, notme-proxy
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "mode=1777"
  cloister-do:
    driver: local
    # SQLite DO storage — survives container restarts; backup target

networks:
  solo-notme-proxy:
    # notme-proxy alone
    driver: bridge
  solo-rosary:
    # rosary alone
    driver: bridge
  wire-cloister-router-notme-identity:
    # cloister-router → notme-identity
    driver: bridge
