# The microVM demo with Dolt from its PUBLISHED image (cloister-727354):
# dolthub/dolt-sql-server 1.86.1, pinned by its multi-arch index digest (the
# one tools/dolt-grpc-demo/k8s/dolt.yaml uses) and pulled from Docker Hub by
# `cloister runtime import --bundle dolt` (no --layout).
# orders is built locally as in ../microvm. See README.md.
#
# dolt runs the image config's own entrypoint, `tini -- docker-entrypoint.sh`.
# Since LLO v0.30.0 arguments reach the guest byte for byte, the literal `--`
# included (ley-line-open-7410ec). Paths are absolute because a plan names an
# absolute executable. Plans carry no env: the script runs with the guest's
# HOME=/ and PATH, as root, and needs nothing else (seen live).

[metadata]
name = "dolt-grpc-demo-published"
version = "0.0.1"

[storage]
doStoragePath = "/data/do"

[[bundles]]
name = "dolt"
kind = "external"
tier = "cluster"

[bundles.external]
image = "dolthub/dolt-sql-server"
entryPoint = "/usr/bin/tini"
executionMode = "microvm"
args = ["--", "/usr/local/bin/docker-entrypoint.sh"]

[[bundles.ports]]
name = "mysql"
port = 3306
appProtocol = "art.mysql"
expose = "edge"     # published on host 127.0.0.1 by `cluster up` (ADR-0069 §2)

[[bundles]]
name = "orders"
kind = "external"
tier = "cluster"

[bundles.external]
image = "dolt-grpc-demo/orders"
entryPoint = "/usr/bin/orders"
executionMode = "microvm"
args = ["-db", "127.0.0.1:3306", "-listen", "127.0.0.1:50051"]

[[bundles.ports]]
name = "grpc"
port = 50051
appProtocol = "art.grpc"
expose = "edge"     # published on host 127.0.0.1 by `cluster up` (ADR-0069 §2)

[[connections]]
from = "orders"
name = "orders-db"
appProtocol = "art.mysql"
minStrength = "capability"

[[connections.targets]]
env = "local"
bundle = "dolt"
port = "mysql"
