# The dolt image for the microVM demo (cloister-2af014): the dolt APK built by
# melange-dolt.yaml and an empty /data (Dolt's data directory; rootfs manifest
# v2 records the empty directory itself). Nothing else:
# no shell, no package manager. Built by ./build.sh.
contents:
  # The local repository (build-images.sh's <out dir>/packages) is appended
  # with --repository-append; there is no other repository.
  packages:
    - dolt

paths:
  - path: /data
    type: directory
    permissions: 0o755

entrypoint:
  command: /usr/bin/dolt

archs:
  - aarch64
