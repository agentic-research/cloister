# Rendered manifest for the `orders` bundle (ADR-0070 §2: forwarded, kubernetes).
# The database address is written here by hand: env lowering (a connection's
# address reaching the workload as an env var) is a later slice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels:
    app: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: dolt-grpc-demo:dev
          imagePullPolicy: Never
          args:
            - -db
            - dolt.dolt.svc.cluster.local:3306
            - -listen
            - 0.0.0.0:50051
          ports:
            - name: grpc
              containerPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: orders
spec:
  selector:
    app: orders
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      appProtocol: art.grpc
