# cloister-harness — the confinement binary for `task harness:dev` (S1 of the
# harness-substrate work). A *real artifact* that applies kernel confinement
# programmatically via the `nono` crate (Seatbelt on macOS, Landlock on Linux)
# from a DECLARED policy, then execs the harness — replacing the hand-assembled
# `nono run …` CLI flags that used to live in scripts/harness-dev.mjs.
#
# Standalone native crate (like tools/mediator), OUTSIDE the rs/ wasm
# workspace: nono pulls in OS sandbox + keyring, which do not build for wasm32.
# Built with `cargo build --release` in this dir; never published.
[package]
name = "harness-sandbox"
version = "0.0.1"
edition = "2021"
description = "Apply nono kernel confinement from a declared policy, then exec the harness. The 'actual binary' for cloister's harness-substrate isolation."
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "cloister-harness"
path = "src/main.rs"

[dependencies]
# The SAME nono the CLI (`nono run`) uses and that LLO's leyline-sign pins —
# but consumed as a library: nono::Sandbox::apply(&CapabilitySet) applies the
# confinement in-process, and nono::keystore resolves credential URIs. Default
# features include `system-keyring` for keychain:// resolution on macOS.
nono = "0.70"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# LLO's leyline-sign, pinned to v0.7.6 (rev a6eba83) — the release that adds the
# confinementDigest Interlace cert extension (OID 1.3.6.1.4.1.99999.1.7). The
# runner calls `verify_cert_chain` to authenticate the workload's identity cert
# against the CA master pubkey and extract the committed digest (§7). Base dep,
# native — NO `host` feature (that gates the tokio/keyring helper-binary closure
# this binary does not need). SAME rev as rs/crates/cas/Cargo.toml so the digest
# semantics and cert format match end-to-end.
leyline-sign = { git = "https://github.com/agentic-research/ley-line-open", rev = "a6eba83a5672dd75a0ea64f34abd9dde1030250f", version = "0.7.6", package = "leyline-sign" }

# BLAKE3-256 of the §7-canonical confinement/v1 manifest — the substrate digest
# the runner recomputes and compares against the cert commitment. `blake3::hash`
# is proven byte-equal to cloister's leyline-cas-ffi hash (cloister-cas test
# `hash_via_re_export_matches_blake3`), so this stays a light dep rather than
# pulling the FFI crate into this standalone binary.
blake3 = "1"

# Decode the base64 cert DER (url-safe) + master pubkey (standard) the policy
# carries for the §8 commitment check.
base64 = "0.22"

[dev-dependencies]
# Mint a real Interlace cert in-process for the §7 accept/tamper tests, exactly
# as rs/crates/cas/examples/mint-dev-cert.rs does — `mint_test_cert` lives in
# leyline-sign's intentionally-public `cert_chain::tests_helpers`. Versions match
# LLO's leyline-sign so the `SigningKey` type unifies across the crate boundary.
ed25519-dalek = "3"
rand = "0.8"
