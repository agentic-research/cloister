[package]
name = "schema-bridge"
version = "0.0.1"
edition = "2021"
description = "Capnp + JSON-extension schemas → zod / TS / JSON Schema. Fail-fast codegen."
license = "AGPL-3.0-or-later"
publish = false

# One plugin binary per output format: capnp's PATH-search resolves
# `-o<plugin>` to `capnpc-<plugin>`, so dispatch lives in the BINARY
# NAME rather than an env var. main.rs reads argv[0] basename, strips
# the `capnpc-schema-bridge-` prefix, parses the remainder as
# OutputFormat. Bead cloister-75f6d5 adds the `capnpc-schema-bridge-go`
# entry alongside. All bins compile from the same main.rs.
[[bin]]
name = "capnpc-schema-bridge-zod"
path = "src/main.rs"

[lib]
name = "schema_bridge"
path = "src/lib.rs"

[dependencies]
capnp = "0.21"
thiserror = "2.0"

[dev-dependencies]
indoc = "2.0"
