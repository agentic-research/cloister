name: credential-isolation-spec-drift
# Gates the cloister-spec/credential-isolation/v1/ test vectors against
# their pinned SHA-256 set and the Python reference implementation
# (per cloister-954f21, the L7 substrate-IDL conformance suite).
#
# Mirrors the pattern in interlace-spec-drift.yml — kept as a SEPARATE
# workflow because the two specs have independent version cycles
# (interlace-spec is at 0.1.0 / 0.2.0-draft; credential-isolation/v1
# is mid-draft). A divergence in one MUST NOT gate the other.
#
# Contract enforced here:
#   1. Every file under cloister-spec/credential-isolation/v1/test-vectors/*.json
#      matches its pinned digest in cloister-spec/credential-isolation/v1/VECTORS.sha256.
#      Drift means either the spec moved (and the version string in
#      cloister-spec/credential-isolation/v1/README.md MUST be bumped)
#      or the SHA file was regenerated intentionally and committed.
#   2. The Python reference implementation under
#      cloister-spec/credential-isolation/v1/ref-impl-py/ still produces
#      byte-equal output against the vectors. A divergence between the
#      ref impl and cloister (the TypeScript impl) is a finding worth
#      filing a bead, NOT a CI auto-fix.
#   3. Any vector change without a corresponding version-string bump in
#      cloister-spec/credential-isolation/v1/README.md fails fast.
#
# Why tracked: the spec is the contract between cloister-the-TS-impl
# and any second implementation (Rust, Python, Go, ...). Silent drift
# in the vectors would let cloister and the spec diverge invisibly,
# breaking the byte-compat guarantee the spec exists to enforce.
#
# Security note: all run: blocks execute repo-controlled scripts only.
# The only github.event.* references are pull_request.base.sha and
# pull_request.head.sha, bound via env (not interpolated into shell
# directly) and consumed only as git object names — git rejects
# anything that isn't a valid commit-ish, so they can't be exploited
# even if an attacker controlled them.

on:
  push:
    branches: [main]
    paths:
      - "cloister-spec/credential-isolation/**"
      - ".github/workflows/credential-isolation-spec-drift.yml"
  pull_request:
    branches: [main]
    paths:
      - "cloister-spec/credential-isolation/**"
      - ".github/workflows/credential-isolation-spec-drift.yml"

permissions:
  contents: read

concurrency:
  group: credential-isolation-spec-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-check:
    name: vectors + ref-impl conformance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Need at least 2 commits so the version-bump check can diff
          # against the PR base.
          fetch-depth: 2

      - name: Assert vectors match VECTORS.sha256
        run: |
          cd cloister-spec/credential-isolation/v1
          if ! sha256sum -c VECTORS.sha256; then
            echo "::error::cloister-spec/credential-isolation/v1/test-vectors/ drifted from pinned VECTORS.sha256." >&2
            echo "::error::Either:" >&2
            echo "::error::  1. The drift was unintentional - revert the vector change, OR" >&2
            echo "::error::  2. The drift is intentional - bump the spec version in cloister-spec/credential-isolation/v1/README.md" >&2
            echo "::error::     AND regenerate the SHA file with:" >&2
            echo "::error::       cd cloister-spec/credential-isolation/v1 && shasum -a 256 test-vectors/*.json > VECTORS.sha256" >&2
            echo "::error::     then commit both the vectors and VECTORS.sha256." >&2
            exit 1
          fi

      - name: Assert vector change implies README version bump
        if: github.event_name == 'pull_request'
        env:
          # SAFE: these are git SHAs (commit-ish strings). They are NOT
          # untrusted text fields — git diff rejects anything that isn't
          # a valid object name.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" --)"
          vectors_changed=0
          readme_changed=0
          for f in $changed; do
            case "$f" in
              cloister-spec/credential-isolation/v1/test-vectors/*.json) vectors_changed=1 ;;
              cloister-spec/credential-isolation/v1/README.md) readme_changed=1 ;;
            esac
          done
          if [ "$vectors_changed" = "1" ] && [ "$readme_changed" = "0" ]; then
            echo "::error::A test-vector under cloister-spec/credential-isolation/v1/test-vectors/ changed but" >&2
            echo "::error::cloister-spec/credential-isolation/v1/README.md was not touched." >&2
            echo "::error::Vector changes are spec-breaking by definition - bump the version" >&2
            echo "::error::string at the top of cloister-spec/credential-isolation/v1/README.md (and likely" >&2
            echo "::error::move to cloister-spec/credential-isolation/v2/) in the same PR." >&2
            exit 1
          fi

      - name: Set up Python
        if: hashFiles('cloister-spec/credential-isolation/v1/ref-impl-py/pyproject.toml') != ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run Python reference-implementation conformance suite
        if: hashFiles('cloister-spec/credential-isolation/v1/ref-impl-py/pyproject.toml') != ''
        run: |
          cd cloister-spec/credential-isolation/v1/ref-impl-py
          # Stdlib-only — no `uv sync` step. See pyproject.toml for why.
          if ! python3 conformance/run.py; then
            echo "::error::Python reference implementation failed conformance against" >&2
            echo "::error::the pinned test vectors. Either the ref impl regressed or the" >&2
            echo "::error::spec itself moved without the ref impl being updated." >&2
            echo "::error::A divergence between this Python impl and cloister-the-TS-impl" >&2
            echo "::error::is a finding worth filing a bead - do NOT auto-fix the Python" >&2
            echo "::error::to match cloister; the spec is the contract." >&2
            exit 1
          fi
