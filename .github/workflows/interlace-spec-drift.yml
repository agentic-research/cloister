name: interlace-spec-drift
# Gates the interlace-spec/ test vectors against their pinned SHA-256 set
# and the Python reference implementation (per cloister-af1290).
#
# Contract enforced here:
#   1. Every file under interlace-spec/0.1.0/test-vectors/*.json matches
#      its pinned digest in interlace-spec/0.1.0/VECTORS.sha256. Drift
#      means either the spec moved (and the version string in
#      interlace-spec/0.1.0/README.md MUST be bumped) or the SHA file
#      was regenerated intentionally and committed.
#   2. The Python reference implementation under
#      interlace-spec/0.1.0/ref-impl-py/ still produces byte-equal
#      output against the vectors. A divergence between Python and
#      cloister is a finding worth filing a bead, not a CI auto-fix.
#   3. Any vector change without a corresponding version-string bump
#      in interlace-spec/0.1.0/README.md fails fast.
#
# Why tracked: the spec is the contract between cloister and any
# second implementation (Rust, Python, Go, ...). Silent drift in the
# vectors would let cloister and the spec diverge invisibly, breaking
# the byte-compat guarantee the spec exists to enforce.
#
# All run: blocks below execute repo-controlled scripts only; no
# untrusted github.event.* input is interpolated into shell — the
# only event references (base/head SHAs) are bound to env vars and
# git rejects anything that isn't a valid object name.

on:
  push:
    branches: [main]
    paths:
      - "interlace-spec/**"
      - ".github/workflows/interlace-spec-drift.yml"
  pull_request:
    branches: [main]
    paths:
      - "interlace-spec/**"
      - ".github/workflows/interlace-spec-drift.yml"

permissions:
  contents: read

concurrency:
  group: interlace-spec-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-check:
    name: vectors + ref-impl conformance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Need at least 2 commits so the version-bump check can diff
          # against the PR base.
          fetch-depth: 2

      - name: Assert vectors match VECTORS.sha256
        run: |
          cd interlace-spec/0.1.0
          if ! sha256sum -c VECTORS.sha256; then
            echo "::error::interlace-spec/0.1.0/test-vectors/ drifted from pinned VECTORS.sha256." >&2
            echo "::error::Either:" >&2
            echo "::error::  1. The drift was unintentional - revert the vector change, OR" >&2
            echo "::error::  2. The drift is intentional - bump the spec version in interlace-spec/0.1.0/README.md" >&2
            echo "::error::     AND regenerate the SHA file with:" >&2
            echo "::error::       cd interlace-spec/0.1.0 && shasum -a 256 test-vectors/*.json > VECTORS.sha256" >&2
            echo "::error::     then commit both the vectors and VECTORS.sha256." >&2
            exit 1
          fi

      - name: Assert vector change implies README version bump
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" --)"
          vectors_changed=0
          readme_changed=0
          for f in $changed; do
            case "$f" in
              interlace-spec/0.1.0/test-vectors/*.json) vectors_changed=1 ;;
              interlace-spec/0.1.0/README.md) readme_changed=1 ;;
            esac
          done
          if [ "$vectors_changed" = "1" ] && [ "$readme_changed" = "0" ]; then
            echo "::error::A test-vector under interlace-spec/0.1.0/test-vectors/ changed but" >&2
            echo "::error::interlace-spec/0.1.0/README.md was not touched." >&2
            echo "::error::Vector changes are spec-breaking by definition - bump the version" >&2
            echo "::error::string at the top of interlace-spec/0.1.0/README.md (and likely" >&2
            echo "::error::move to interlace-spec/0.2.0-draft/) in the same PR." >&2
            exit 1
          fi

      - name: Set up Python
        if: hashFiles('interlace-spec/0.1.0/ref-impl-py/pyproject.toml') != ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        if: hashFiles('interlace-spec/0.1.0/ref-impl-py/pyproject.toml') != ''
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          version: "0.5.x"

      - name: Run Python reference-implementation conformance suite
        if: hashFiles('interlace-spec/0.1.0/ref-impl-py/pyproject.toml') != ''
        run: |
          cd interlace-spec/0.1.0/ref-impl-py
          uv sync --frozen
          if ! uv run python conformance/run.py; then
            echo "::error::Python reference implementation failed conformance against" >&2
            echo "::error::the pinned test vectors. Either the ref impl regressed or the" >&2
            echo "::error::spec itself moved without the ref impl being updated." >&2
            echo "::error::A divergence between this Python impl and cloister-the-TS-impl" >&2
            echo "::error::is a finding worth filing a bead - do NOT auto-fix the Python" >&2
            echo "::error::to match cloister; the spec is the contract." >&2
            exit 1
          fi
