name: cloister-schema-go
# Gates the Go bindings module for the public cloister wire capnp schema
# (mirrors ley-line-open's leyline-schema-go workflow; pattern referenced
# in cloister-b94ab0).
#
# Contract enforced here:
#   Generated files in clients/go/cloister-schema/ match `regen.sh` output
#   exactly. `git diff --exit-code` fails on drift, so a schema change
#   without a regen is a CI failure, not a runtime bug.
#
# All `run:` blocks below execute repo-controlled scripts only; no
# untrusted ${{ github.event.* }} input is interpolated. Only github.ref
# is referenced, and only in the concurrency group key.

on:
  push:
    branches: [main]
    tags:
      - "clients/go/cloister-schema/v*"
    paths:
      - "clients/go/cloister-schema/**"
      - "wire/cloister.capnp"
      - "wire/go.capnp"
      - ".github/workflows/cloister-schema-go.yml"
  pull_request:
    branches: [main]
    paths:
      - "clients/go/cloister-schema/**"
      - "wire/cloister.capnp"
      - "wire/go.capnp"
      - ".github/workflows/cloister-schema-go.yml"

permissions:
  contents: read

concurrency:
  group: cloister-schema-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regen-and-test:
    name: regen-diff + go test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # SHA-pinned: actions/checkout@v6 (matches ci.yml).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # SHA-pinned: actions/setup-go@v6.4.0 (matches LLO's leyline-schema-go).
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.21"

      - name: Install capnp (>=1.3.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto
          capnp --version

      - name: Install capnpc-go
        # Pin matches go.mod's capnproto.org/go/capnp/v3 dependency, so
        # the generator and runtime stay in lockstep across regens.
        run: |
          go install capnproto.org/go/capnp/v3/capnpc-go@v3.1.0-alpha.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Regenerate Go bindings
        run: clients/go/cloister-schema/regen.sh

      - name: Assert no drift between committed bindings and regen output
        run: |
          if ! git diff --exit-code clients/go/cloister-schema/; then
            echo "::error::clients/go/cloister-schema/ has drift; run regen.sh and commit." >&2
            exit 1
          fi

      - name: go vet
        working-directory: clients/go/cloister-schema
        env:
          GOWORK: "off"
        run: go vet ./...

      - name: go test
        working-directory: clients/go/cloister-schema
        env:
          GOWORK: "off"
        run: go test ./...
