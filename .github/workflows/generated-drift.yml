name: generated-drift
# Gates that src/generated/{manifest,tool-schemas,cluster}.ts match
# what their respective build scripts produce (per cloister-0854b7), and
# that the schema-bridge Go surfaces under pkg/ match theirs.
#
# Contract enforced here:
#   Generated TS modules in src/generated/ match the output of running
#   the codegen scripts on the checked-in source schemas + zod modules.
#   git diff --exit-code fails on drift, so a schema change without a
#   regen is a CI failure, not a runtime bug.
#
# Why tracked: cloister's OCI build (melange.yaml) depends on these
# files being present so it can skip the build-time capnp dependency
# entirely. Wolfi (the base image) does not ship capnp.
#
# All run: blocks below execute repo-controlled scripts only; no
# untrusted github.event.* input is interpolated.

# Runs on EVERY push to main + every PR — intentionally NOT path-filtered.
# This is a required status check (branch protection on main), and a
# path-filtered required check that doesn't trigger blocks the PR forever
# on "Expected — waiting for status". Always-on = the check always posts.
# The drift diff itself is fast; the git diff --exit-code is the gate.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: generated-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-check:
    # DO NOT RENAME. This exact string is a REQUIRED status check in main's
    # branch protection. A required context that no job produces never posts,
    # so the PR sits on "Expected — waiting for status" forever. Renaming it to
    # mention pkg/*.go did exactly that on PR #229 — the header below already
    # said it was required, which is why the coupling is now pinned by
    # scripts/test/required-checks.test.mjs rather than by a comment.
    # Changing it means updating branch protection FIRST (admin action).
    name: regen + diff (manifest, tool-schemas, cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: "20"

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with:
          version: "10.30.3"

      - name: Install Task
        # Constellation's standard. SHA-pinned to the same commit ci.yml
        # uses; bump together with ley-line / mache. Per cloister-8e40ad:
        # CI invokes `task <name>` targets instead of duplicating the
        # underlying `pnpm exec tsx scripts/...` invocations the
        # Taskfile already owns.
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
        with:
          # Authenticate the release download to dodge anonymous GitHub API
          # rate limits on shared runner IPs — this is a required check, so a
          # flaky Task install would block merges until a manual re-run.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        # Needed only for `gofmt` + the two pkg/ drift checks below. The
        # version matches cloister-schema-go.yml so the two Go surfaces do not
        # drift on toolchain.
        with:
          go-version: "1.21"

      - name: Install capnp (build-time tool — not needed at deploy)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto
          capnp --version

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Regenerate src/generated/*.ts via task targets (source of truth)
        # Source-of-truth invocation principle (cloister-8e40ad): CI
        # invokes the SAME tasks dev + docs use. Adding a new generated
        # artifact means adding a Taskfile target, not editing this
        # workflow alongside.
        #
        # `task manifest` depends on `task tool-schemas` so calling
        # manifest runs both. `task cluster:toml` does the forward leg
        # (TOML → cluster.ts), per ADR-0025.
        run: |
          task manifest
          task cluster:toml

      - name: Assert no drift in src/generated/
        # Forward-leg drift gate. Reverse leg + cluster.toml canonical
        # check is `task cluster:toml:roundtrip` below — the same
        # task local dev runs (it's also a `task verify` dep), so a
        # developer can repro this CI check with one command.
        run: |
          if ! git diff --exit-code src/generated/; then
            echo "::error::src/generated/ has drift; regenerate locally + commit:" >&2
            echo "::error::  task manifest" >&2
            echo "::error::  task cluster:toml" >&2
            echo "::error::  git add src/generated/ && git commit" >&2
            exit 1
          fi

      - name: Assert no drift in the schema-bridge Go surfaces (pkg/)
        # THE GAP THIS CLOSES. pkg/cluster/cluster.go and
        # pkg/identity/identity.go are generated by LLO's
        # capnpc-schema-bridge-go from manifest/*.capnp. Nothing gated them:
        # `task lint` cannot, because it must run without a Go toolchain, and
        # cloister-schema-go.yml gates a DIFFERENT surface —
        # clients/go/cloister-schema/, produced by regen.sh with upstream
        # capnpc-go from wire/cloister.capnp. Two Go surfaces, two generators,
        # and only one was checked.
        #
        # The measured consequence: pkg/cluster/cluster.go was stale by four
        # fields across two structs — InputSpec.requiresSession, .connection,
        # .mutableTagReason and Gateway.harnessTargets — each added to
        # manifest/cluster.capnp by shipped work and never regenerated. Proven
        # pre-existing rather than caused by the v0.13.0 generator bump: the
        # v0.12.1 and v0.13.0 emitters produce byte-identical output, so the
        # drift was entirely cloister's own schema advancing past its bindings.
        #
        # `task schema-bridge:build` fetches the digest-pinned generators, so
        # this needs no Rust toolchain — only capnp (above) + gofmt.
        run: |
          if ! task cluster:go:check-drift; then
            echo "::error::pkg/cluster/cluster.go has drift; regenerate locally + commit:" >&2
            echo "::error::  task cluster:go --force && git add pkg/ && git commit" >&2
            exit 1
          fi
          if ! task identity:go:check-drift; then
            echo "::error::pkg/identity/identity.go has drift; regenerate locally + commit:" >&2
            echo "::error::  task identity:go --force && git add pkg/ && git commit" >&2
            exit 1
          fi

      - name: Assert no cluster.toml canonical-form drift
        # Reverse-leg drift gate (ADR-0025). `task cluster:toml:roundtrip`
        # is the SAME drift check operators run via `task verify`. CI
        # just invokes it; if the task ever gains new checks, CI
        # follows automatically. Per cloister-8e40ad.
        run: |
          if ! task cluster:toml:roundtrip; then
            echo "::error::cluster.toml diverges from canonical form; regenerate locally + commit:" >&2
            echo "::error::  task cluster:toml:export -- --write cluster.toml" >&2
            echo "::error::  git add cluster.toml && git commit" >&2
            exit 1
          fi
