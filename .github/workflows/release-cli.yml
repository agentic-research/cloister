name: release-cli
# Publishes the cloister CLI as one file, as a GitHub release asset:
# dist/cloister.mjs, which needs only Node 22, and its sha256. It runs the
# commands cli/surface.mjs marks standalone (the plan checker, `cloister
# inspect`, first; docs/plan-checker.md) and refuses the rest by name.
#
# Runs only on a pushed `cli/v*` tag, so nothing is published until a
# maintainer tags one. The tag namespace follows clients/go/cloister-schema/v*.
# actions/plan-check downloads the asset of the tag it is pinned to and
# verifies it against the digest file published here.
#
# The file is tested before it is published: gen/test/bundle.test.mjs runs
# every standalone command from an empty directory and requires output
# identical to the CLI's, and holds every other command to its refusal.
#
# No untrusted github.event input is interpolated into a run: block. The tag
# name reaches the shell as an environment variable.

on:
  push:
    tags:
      - "cli/v*"

permissions:
  contents: read

concurrency:
  # The repository's one shape (lint/test/ci-gate.test.mjs). A tag is never
  # main, and each tag is its own group, so one release never cancels another.
  group: release-cli-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  release:
    name: build, test, publish
    runs-on: ubuntu-latest
    permissions:
      # Creating a release and uploading its assets.
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Enable corepack (provides pnpm via package.json packageManager field)
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the one file
        # Builds it into a temporary directory and runs it from empty ones.
        run: node --test gen/test/bundle.test.mjs

      - name: Build the one file
        run: |
          node gen/bundle.mjs
          cd dist
          sha256sum cloister.mjs > cloister.mjs.sha256
          cat cloister.mjs.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" \
            --notes "The cloister CLI as one file that needs only Node 22: node cloister.mjs --help. It runs the commands that need no checkout, starting with the plan checker (docs/plan-checker.md). Verify: sha256sum --check cloister.mjs.sha256. In a workflow: agentic-research/cloister/actions/plan-check@$TAG" \
            dist/cloister.mjs dist/cloister.mjs.sha256
