name: release-plan-checker
# Publishes the plan checker (docs/plan-checker.md) as a GitHub release asset:
# dist/cloister-plan.mjs, one file that needs only Node 22, and its sha256.
#
# Runs only on a pushed `plan-checker/v*` tag, so nothing is published until a
# maintainer tags one. The tag namespace follows clients/go/cloister-schema/v*.
# actions/plan-check downloads the asset of the tag it is pinned to and
# verifies it against the digest file published here.
#
# The bundle is tested before it is published: gen/test/bundle-plan.test.mjs
# runs every fixture through it and requires output identical to the CLI's.
#
# No untrusted github.event input is interpolated into a run: block. The tag
# name reaches the shell as an environment variable.

on:
  push:
    tags:
      - "plan-checker/v*"

permissions:
  contents: read

concurrency:
  # The repository's one shape (lint/test/ci-gate.test.mjs). A tag is never
  # main, and each tag is its own group, so one release never cancels another.
  group: release-plan-checker-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  release:
    name: build, test, publish
    runs-on: ubuntu-latest
    permissions:
      # Creating a release and uploading its assets.
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Enable corepack (provides pnpm via package.json packageManager field)
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the bundle
        # Builds it into a temporary directory and runs every fixture through it.
        run: node --test gen/test/bundle-plan.test.mjs

      - name: Build the bundle
        run: |
          node gen/bundle-plan.mjs
          cd dist
          sha256sum cloister-plan.mjs > cloister-plan.mjs.sha256
          cat cloister-plan.mjs.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" \
            --notes "The plan checker as one file that needs only Node 22. Guide: docs/plan-checker.md. Verify: sha256sum --check cloister-plan.mjs.sha256. In a workflow: agentic-research/cloister/actions/plan-check@$TAG" \
            dist/cloister-plan.mjs dist/cloister-plan.mjs.sha256
