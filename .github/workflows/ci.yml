name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default GITHUB_TOKEN permissions are read-only at the workflow level.
# Jobs that need writes opt in explicitly (none do — lint + verify only).
# No untrusted github.event inputs interpolate into run: blocks anywhere
# in this file. Only github.event_name (enum) and github.ref (validated
# string) are used, in the verify job's branch guard and the concurrency
# group key.
permissions:
  contents: read

# Cancel previous runs on the same ref when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (tsc + worker tests + script/rail tests)
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        # Pinned to the same v4.4.0 commit constellation repos use. Bumping
        # node here probably wants a coordinated bump across the constellation.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # node:test (used by scripts/test/*.test.mjs) requires Node 18+;
          # using 20 to track the same line workerd's runtime supports.
          node-version: '20'

      - name: Enable corepack (provides pnpm via package.json packageManager field)
        # `packageManager` in package.json pins pnpm@10.30.3. Corepack ships
        # with Node and reads that field — no third-party pnpm action needed,
        # which sidesteps the pin-a-non-constellation-action question.
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install Task
        # Constellation's standard. SHA-pinned to the same commit ley-line
        # and mache use; bump together when bumping their workflows.
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
        with:
          # Authenticate the release download to dodge anonymous GitHub API
          # rate limits on shared runner IPs (setup-task otherwise flakes).
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install capnp + libdbus dev headers
        # `capnproto` — required by `task manifest` (compiles
        # cloister.capnp → src/generated/manifest.ts at build time,
        # per ADR-0004).
        # `libdbus-1-dev pkg-config` — required by `task rs:sign:host`
        # (a dep of `task test` → `task lint`). On Linux, the
        # `keyring` crate's `sync-secret-service` feature is activated
        # by the `[target.'cfg(target_os = "linux")'.dependencies]`
        # block in LLO's `rs/ll-open/sign/Cargo.toml` (pulled here via
        # the git dep pinned in rs/crates/cas/Cargo.toml). That feature pulls in
        # secret-service → zbus → libdbus-sys, whose build.rs invokes
        # `pkg-config --cflags --libs dbus-1` and panics if libdbus-1.pc
        # is missing. macOS dev boxes use the `apple-native` keyring
        # backend instead (no dbus) which is why local builds pass.
        # Per ADR-0014 the keystore backend is intentionally
        # platform-native; the Linux build environment requirement is
        # accepted cost.
        run: sudo apt-get update && sudo apt-get install -y capnproto libdbus-1-dev pkg-config

      - name: Install Rust toolchain (1.95.0 — pinned by rs/rust-toolchain.toml) + wasm32 target
        # Required by `task rs:sign:wasm` and `task rs:sign:host`, both
        # deps of `task test` → `task lint`. The wasm artifact is loaded
        # by src/wire/signet-verify.ts; without it, vitest-pool-workers
        # fails every test file at module init (cloister-bd5241).
        #
        # Install 1.95.0 explicitly (matching rs/rust-toolchain.toml,
        # pinned by ADR-0019 §"Implementation pins") to avoid a parallel
        # rustup-download race: `task lint` runs `rs:sign:host` +
        # `rs:sign:wasm` concurrently via Task's dep parallelism. If
        # the installed channel here is `stable`, cargo's rustup-proxy
        # sees the override file and BOTH parallel cargo invocations
        # race-fetch 1.95.0 into the same ~/.rustup/downloads/*.partial
        # path → one process renames the partial first, the other gets
        # ENOENT and exits 1. Installing 1.95.0 up-front means cargo
        # finds it already-resolved and skips the fetch entirely.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + git
        # Cuts ~30s off cold runs. Keyed on Cargo.lock so an rs/ deps
        # bump invalidates cleanly.
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rs/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Cache pnpm store
        # Same cache action ley-line uses; SHA-pinned to v5. Keyed on the
        # lockfile so a deps change invalidates the cache cleanly.
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Node dependencies
        # Project dependency policy lives in Taskfile.yml; workflow setup
        # still owns OS packages, toolchains, and caches.
        run: task deps:node

      - name: Pre-warm rustup toolchain
        # Belt-and-suspenders for the parallel rustup-download race.
        # `cd rs && cargo --version` triggers rustup to fully realize
        # the 1.95.0 toolchain (already installed by the prior step,
        # but `cargo --version` is what proves rustup's proxy can
        # dispatch without a fetch). If the prior step's install was
        # complete this is a no-op; if anything is still partial it
        # serializes the resolution here BEFORE Task fans out.
        run: cd rs && cargo --version && rustc --version

      - name: Lint (the inner-loop gate)
        # `task lint` chains: task manifest → task rs:sign:wasm → tsc
        # --noEmit → vitest in workerd → the script/rail node:test suites.
        #
        # NOTE: this job's `name:` above is a REQUIRED status check in main's
        # branch protection, matched by EXACT STRING. Renaming it deadlocks the
        # renaming PR — the required check never reports under its expected
        # name, so that PR can never merge (hit for real in #197). Always
        # update branch protection FIRST, then the workflow, never the reverse.
        run: task lint

  # Path filter: does this PR touch the substrate (rust / wire codec / manifest /
  # build)? If so, `verify` runs on the PR — catching verify-breaks BEFORE merge
  # (the gap that let #130 land a broken verify). Non-substrate PRs stay
  # lint-only for fast feedback. Push events always verify (shortcut below).
  changes:
    name: changes (verify path filter)
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.filter.outputs.verify }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "verify=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")
          if printf '%s\n' "$files" | grep -qE '^(rs/|src/wire/|tools/harness-sandbox/|manifest/|cluster\.capnp|Taskfile\.yml|\.github/workflows/ci\.yml)'; then
            echo "verify=true" >> "$GITHUB_OUTPUT"
          else
            echo "verify=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: verify (strict — substrate equivalence + smoke)
    # Runs on every main push AND on PRs that touch the substrate (see `changes`).
    # Non-substrate PRs stay lint-only for fast feedback.
    needs: [lint, changes]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      needs.changes.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Enable corepack
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
        with:
          # Authenticate the release download to dodge anonymous GitHub API
          # rate limits on shared runner IPs (setup-task otherwise flakes).
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install capnp + libdbus dev headers
        # See the lint job's matching step for the rationale. `task verify`
        # additionally runs `rs:sign:host-extras` (cargo test with the
        # nono closure) which also links against libdbus on Linux.
        run: sudo apt-get update && sudo apt-get install -y capnproto libdbus-1-dev pkg-config

      - name: Install Rust toolchain (1.95.0 — pinned by rs/rust-toolchain.toml) + wasm32 target
        # See the lint job's matching step for the rustup-race rationale.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + git
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rs/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Cache pnpm store
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Node dependencies
        # Project dependency policy lives in Taskfile.yml; workflow setup
        # still owns OS packages, toolchains, and caches.
        run: task deps:node

      - name: Pre-warm rustup toolchain
        # See the lint job's matching step. `task verify` fans out
        # `lint` (which runs rs:sign:host + rs:sign:wasm in parallel)
        # AND `rs:sign:host-extras` + `rs:audit`; pre-warming avoids
        # the parallel rustup-download race.
        run: cd rs && cargo --version && rustc --version

      - name: Cache harness-sandbox target (nono/sigstore closure — ~4min cold)
        # tools/harness-sandbox builds the nono (Seatbelt/Landlock) + sigstore
        # closure into its OWN target dir — cargo namespaces compiled artifacts
        # per target dir, so this is NOT shared with rs/target. Dedicated cache
        # (own key, own path) so the lint job's rs/target cache can't lock a key
        # that omits it. Only the verify job builds harness:sandbox:build.
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: tools/harness-sandbox/target
          key: ${{ runner.os }}-harness-sandbox-${{ hashFiles('tools/harness-sandbox/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-harness-sandbox-

      - name: Install cargo-audit
        # `task rs:audit` (a verify dep) shells out to `cargo audit`.
        # GH runner doesn't ship cargo-audit; install + lock for
        # reproducibility. Only needed in the verify job — PR-time
        # `task lint` doesn't run rs:audit. No untrusted input flows
        # into this command.
        run: cargo install --locked cargo-audit

      - name: Install cargo-deny
        # `task rs:audit` (a verify dep) also runs `cargo deny check`
        # for the bans / advisories / licenses / sources gates.
        # GH runner doesn't ship cargo-deny either; install + lock for
        # the same reproducibility reasons as cargo-audit above.
        # Missing this install was failing the verify job at
        # `cargo deny check` ("no such command: deny") after the
        # 2026-05-13 adversarial-cycle close added the gate (a9bc8fe)
        # without a coordinated CI workflow change. No untrusted input
        # flows into this command.
        run: cargo install --locked cargo-deny

      - name: Verify (lint + capnp roundtrip + stub-companion smoke)
        # `task verify` adds the substrate-equivalence harness (production
        # codec ↔ capnp CLI ↔ production codec) and the stub-companion
        # HTTP smoke. Per ADR-0005's amendment.
        run: task verify

  # Full-stack end-to-end: real ley-line-open daemon + real mache + real
  # cloister, exercising cloister's dispatch layer against live upstreams.
  #
  # Distinct from the `verify` job's `smoke:leyline-stub`, which drives the wire
  # codec against a STUB companion. That stub speaks the wire contract but
  # enforces no auth and implements no upstream tool discovery, so it cannot
  # catch the class of break this job exists for: on 2026-07-28 `task smoke`
  # was failing 12 of 15 assertions with every dynamically-discovered tool
  # missing, and no CI job noticed because none ran it (cloister-aef43a).
  #
  # Non-blocking today: the script tolerates a declared KNOWN_FAILING list
  # (currently cloister-af794d, mache's Streamable HTTP session lifecycle) and
  # fails on anything outside it — or on a listed assertion that starts passing,
  # which forces the list to shrink rather than calcify.
  smoke-e2e:
    name: smoke-e2e (real leyline + mache + cloister)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Pinned deliberately. These are BINARY release tags and move on their own
      # cadence, independent of the server.json `version` pins in cluster.toml
      # ([inputs.llo] 0.8.0, [inputs.mache] 0.17.0) which pin the tool CONTRACT,
      # not the executable. Bump these when validating against a newer upstream.
      LEYLINE_RELEASE: v0.10.4
      MACHE_RELEASE: v0.19.0

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Enable corepack (provides pnpm via package.json packageManager field)
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install capnp
        # `task manifest` (a dep of the wrangler dev the smoke starts) compiles
        # cloister.capnp at build time, per ADR-0004.
        run: sudo apt-get update && sudo apt-get install -y capnproto

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain (1.95.0 — pinned by rs/rust-toolchain.toml) + wasm32 target
        # The smoke starts `wrangler dev`, whose bundler resolves
        # src/wire/signet-verify.ts:48 -> rs/target/wasm32-unknown-unknown/
        # release/leyline_sign.wasm. Without the artifact the Worker never
        # builds, cloister never binds its port, and the run dies at "backends
        # did not become ready" with the real cause 30 lines down in clst.log.
        # Same pin + rationale as the lint job above.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + git
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rs/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Cache pnpm store
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Node dependencies
        run: task deps:node

      - name: Build the leyline-sign wasm artifact
        # Built explicitly rather than relied on as a transitive dep: wrangler
        # invokes esbuild directly, not Task, so nothing in the smoke path would
        # trigger this build on its own.
        run: task rs:sign:wasm

      - name: Download upstream binaries
        # Both repos publish linux-amd64 release assets, so the smoke runs
        # against SHIPPED artifacts rather than a cross-repo source build —
        # which also means this job tests what an operator would actually
        # install. mache ships checksums; leyline does not, so only mache's
        # integrity is verifiable here (worth raising upstream).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          gh release download "$LEYLINE_RELEASE" \
            --repo agentic-research/ley-line-open \
            --pattern 'leyline-linux-amd64' --output "$RUNNER_TEMP/bin/leyline"
          gh release download "$MACHE_RELEASE" \
            --repo agentic-research/mache \
            --pattern 'mache-linux-amd64' --output "$RUNNER_TEMP/bin/mache"
          gh release download "$MACHE_RELEASE" \
            --repo agentic-research/mache \
            --pattern 'checksums-sha256.txt' --output "$RUNNER_TEMP/mache-sums.txt"
          ( cd "$RUNNER_TEMP/bin" \
            && grep 'mache-linux-amd64' "$RUNNER_TEMP/mache-sums.txt" \
               | sed 's/mache-linux-amd64/mache/' \
               | sha256sum -c - )
          chmod +x "$RUNNER_TEMP/bin/leyline" "$RUNNER_TEMP/bin/mache"

      - name: Run the full-stack smoke
        # LEYLINE / MACHE / CLOISTER_DIR override the script's laptop defaults
        # (~/remotes/art/...), which do not exist on a runner.
        env:
          LEYLINE: ${{ runner.temp }}/bin/leyline
          MACHE: ${{ runner.temp }}/bin/mache
        run: CLOISTER_DIR="$GITHUB_WORKSPACE" task smoke
