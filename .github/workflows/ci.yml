name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default GITHUB_TOKEN permissions are read-only at the workflow level.
# Jobs that need writes opt in explicitly (none do — lint + verify only).
# No untrusted github.event inputs interpolate into run: blocks anywhere
# in this file. Only github.event_name (enum) and github.ref (validated
# string) are used, in the verify job's branch guard and the concurrency
# group key.
permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. A push to main
# never does: each merge is a commit someone may later bisect to or deploy, and
# a run cancelled by the next merge leaves that commit with no result at all.
# On main the group is per commit, so runs do not queue behind each other
# either.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: lint (tsc + worker tests + script/rail tests)
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        # Pinned to the same v4.4.0 commit constellation repos use. Bumping
        # node here probably wants a coordinated bump across the constellation.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Wrangler 4.87 requires Node 22+. Keep this aligned with
          # package.json and the clean-install image.
          node-version: '22'

      - name: Enable corepack (provides pnpm via package.json packageManager field)
        # `packageManager` in package.json pins pnpm@10.30.3. Corepack ships
        # with Node and reads that field — no third-party pnpm action needed,
        # which sidesteps the pin-a-non-constellation-action question.
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install Task
        # Constellation's standard. SHA-pinned to the same commit ley-line
        # and mache use; bump together when bumping their workflows.
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
        with:
          # Authenticate the release download to dodge anonymous GitHub API
          # rate limits on shared runner IPs (setup-task otherwise flakes).
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install capnp + libdbus dev headers
        # `capnproto` — required by `task manifest` (compiles
        # cloister.capnp → src/generated/manifest.ts at build time,
        # per ADR-0004).
        # `libdbus-1-dev pkg-config` — required by `task rs:sign:host`
        # (a dep of `task test` → `task lint`). On Linux, the
        # `keyring` crate's `sync-secret-service` feature is activated
        # by the `[target.'cfg(target_os = "linux")'.dependencies]`
        # block in LLO's `rs/ll-open/sign/Cargo.toml` (pulled here via
        # the git dep pinned in rs/crates/cas/Cargo.toml). That feature pulls in
        # secret-service → zbus → libdbus-sys, whose build.rs invokes
        # `pkg-config --cflags --libs dbus-1` and panics if libdbus-1.pc
        # is missing. macOS dev boxes use the `apple-native` keyring
        # backend instead (no dbus) which is why local builds pass.
        # Per ADR-0014 the keystore backend is intentionally
        # platform-native; the Linux build environment requirement is
        # accepted cost.
        run: sudo apt-get update && sudo apt-get install -y capnproto libdbus-1-dev pkg-config

      - name: Install Rust toolchain (1.95.0 — pinned by rs/rust-toolchain.toml) + wasm32 target
        # Required by `task rs:cas:wasm` and `task rs:sign:host`, both
        # deps of `task test` → `task lint`. cloister_cas.wasm is loaded by
        # src/wire/cas-hash.ts; without it, vitest-pool-workers fails every
        # test file at module init. (leyline_sign.wasm is no longer built
        # here — `task llo:wasm` fetches LLO's digest-pinned asset,
        # cloister-dbe9c3.)
        #
        # Install 1.95.0 explicitly (matching rs/rust-toolchain.toml,
        # pinned by ADR-0019 §"Implementation pins") to avoid a parallel
        # rustup-download race: `task lint` runs `rs:sign:host` +
        # `rs:cas:wasm` concurrently via Task's dep parallelism. If
        # the installed channel here is `stable`, cargo's rustup-proxy
        # sees the override file and BOTH parallel cargo invocations
        # race-fetch 1.95.0 into the same ~/.rustup/downloads/*.partial
        # path → one process renames the partial first, the other gets
        # ENOENT and exits 1. Installing 1.95.0 up-front means cargo
        # finds it already-resolved and skips the fetch entirely.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + git
        # Cuts ~30s off cold runs. Keyed on Cargo.lock so an rs/ deps
        # bump invalidates cleanly.
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rs/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Cache pnpm store
        # Same cache action ley-line uses; SHA-pinned to v5. Keyed on the
        # lockfile so a deps change invalidates the cache cleanly.
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Node dependencies
        # Project dependency policy lives in Taskfile.yml; workflow setup
        # still owns OS packages, toolchains, and caches.
        run: task deps:node

      - name: Pre-warm rustup toolchain
        # Belt-and-suspenders for the parallel rustup-download race.
        # `cd rs && cargo --version` triggers rustup to fully realize
        # the 1.95.0 toolchain (already installed by the prior step,
        # but `cargo --version` is what proves rustup's proxy can
        # dispatch without a fetch). If the prior step's install was
        # complete this is a no-op; if anything is still partial it
        # serializes the resolution here BEFORE Task fans out.
        run: cd rs && cargo --version && rustc --version

      - name: Lint (the inner-loop gate)
        # `task lint` chains: task manifest → rs:test + llo:wasm → tsc
        # --noEmit → vitest in workerd → the script/rail node:test suites.
        #
        # NOTE: this job's `name:` above is a REQUIRED status check in main's
        # branch protection, matched by EXACT STRING. Renaming it deadlocks the
        # renaming PR — the required check never reports under its expected
        # name, so that PR can never merge (hit for real in #197). Always
        # update branch protection FIRST, then the workflow, never the reverse.
        run: task lint

  install-image:
    name: install (clean Linux image)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prove a first install from source only
        run: task test:install:image

  # Path filter: does this PR touch the substrate (rust / wire codec / manifest /
  # build)? If so, `verify` runs on the PR — catching verify-breaks BEFORE merge
  # (the gap that let #130 land a broken verify). Non-substrate PRs stay
  # lint-only for fast feedback. Push events always verify (shortcut below).
  changes:
    name: changes (verify path filter)
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.filter.outputs.verify }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "verify=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")

          # Fail-safe direction (cloister-d19015). This filter used to ENUMERATE
          # substrate paths and skip verify for anything unlisted — so a path
          # nobody remembered to add silently lost its strict gate. It had
          # already happened: cloister.capnp (the consumer manifest — routes,
          # backends, scopes), cluster.toml, cluster.lock.toml, config.capnp
          # and wrangler.toml were ALL unlisted. A PR touching only the
          # manifest ran lint and nothing else. The list even matched
          # `cluster.capnp` while missing `cloister.capnp`.
          #
          # Inverted: verify runs UNLESS every changed file is provably
          # non-substrate. Forgetting to list a substrate path now costs a
          # slower CI run instead of a missing gate — the omission fails safe.
          # Keep this list narrow; when in doubt, leave a path off it.
          SAFE='^(docs/|\.beads/|\.github/ISSUE_TEMPLATE/|[^/]*\.md$|LICENSE$|\.gitignore$)'

          if [ -z "$files" ]; then
            echo "verify=true" >> "$GITHUB_OUTPUT"
            echo "empty diff — verifying (fail-safe)"
          elif printf '%s\n' "$files" | grep -qvE "$SAFE"; then
            echo "verify=true" >> "$GITHUB_OUTPUT"
            echo "substrate-relevant changes:"
            printf '%s\n' "$files" | grep -vE "$SAFE" | sed 's/^/  /'
          else
            echo "verify=false" >> "$GITHUB_OUTPUT"
            echo "docs-only PR — verify skipped. Files:"
            printf '%s\n' "$files" | sed 's/^/  /'
          fi

  verify:
    name: verify (strict — substrate equivalence + smoke)
    # Runs on every main push AND on PRs that touch the substrate (see `changes`).
    # Non-substrate PRs stay lint-only for fast feedback.
    needs: [lint, changes]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      needs.changes.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Enable corepack
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
        with:
          # Authenticate the release download to dodge anonymous GitHub API
          # rate limits on shared runner IPs (setup-task otherwise flakes).
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install capnp + libdbus dev headers
        # See the lint job's matching step for the rationale. `task verify`
        # additionally runs `rs:sign:host-extras` (cargo test with the
        # nono closure) which also links against libdbus on Linux.
        #
        # `libcapnp-dev` is only needed here: `task verify` runs
        # `rs:host-runtime:llo`, whose `capnp-json` build script compiles a
        # schema that imports `/capnp/c++.capnp`. The `capnproto` package is
        # just the compiler; the standard includes ship in `libcapnp-dev`.
        run: sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev libdbus-1-dev pkg-config

      - name: Install Rust toolchain (1.95.0 — pinned by rs/rust-toolchain.toml) + wasm32 target
        # See the lint job's matching step for the rustup-race rationale.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + git
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rs/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Cache pnpm store
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Node dependencies
        # Project dependency policy lives in Taskfile.yml; workflow setup
        # still owns OS packages, toolchains, and caches.
        run: task deps:node

      - name: Pre-warm rustup toolchain
        # See the lint job's matching step. `task verify` fans out
        # `lint` (which runs rs:sign:host + rs:cas:wasm in parallel)
        # AND `rs:sign:host-extras` + `rs:audit`; pre-warming avoids
        # the parallel rustup-download race.
        run: cd rs && cargo --version && rustc --version

      - name: Cache harness-sandbox target (nono/sigstore closure — ~4min cold)
        # tools/harness-sandbox builds the nono (Seatbelt/Landlock) + sigstore
        # closure into its OWN target dir — cargo namespaces compiled artifacts
        # per target dir, so this is NOT shared with rs/target. Dedicated cache
        # (own key, own path) so the lint job's rs/target cache can't lock a key
        # that omits it. Only the verify job builds harness:sandbox:build.
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: tools/harness-sandbox/target
          key: ${{ runner.os }}-harness-sandbox-${{ hashFiles('tools/harness-sandbox/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-harness-sandbox-

      - name: Install cargo-audit
        # `task rs:audit` (a verify dep) shells out to `cargo audit`.
        # GH runner doesn't ship cargo-audit; install + lock for
        # reproducibility. Only needed in the verify job — PR-time
        # `task lint` doesn't run rs:audit. No untrusted input flows
        # into this command.
        run: cargo install --locked cargo-audit

      - name: Install cargo-deny
        # `task rs:audit` (a verify dep) also runs `cargo deny check`
        # for the bans / advisories / licenses / sources gates.
        # GH runner doesn't ship cargo-deny either; install + lock for
        # the same reproducibility reasons as cargo-audit above.
        # Missing this install was failing the verify job at
        # `cargo deny check` ("no such command: deny") after the
        # 2026-05-13 adversarial-cycle close added the gate (a9bc8fe)
        # without a coordinated CI workflow change. No untrusted input
        # flows into this command.
        run: cargo install --locked cargo-deny

      - name: Verify (lint + capnp roundtrip + stub-companion smoke)
        # `task verify` adds the substrate-equivalence harness (production
        # codec ↔ capnp CLI ↔ production codec) and the stub-companion
        # HTTP smoke. Per ADR-0005's amendment.
        run: task verify

  # Every other test of lowering stops at the YAML. This job runs it: it lowers a
  # cluster.toml, applies the result to a real cluster, and observes that a
  # declared edge works and an UNDECLARED one is refused. The refusal is the
  # point: without it "strength: policy" is asserted and never seen.
  #
  # kind and kubectl ship on the runner image. kind >= 0.24's own network
  # plugin enforces NetworkPolicy, so no CNI is installed here. The job fails,
  # rather than passing vacuously, if the cluster does not enforce it.
  lowered-kind:
    name: lowered-kind (apply lowered manifests to a real cluster)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Enable corepack (provides pnpm via package.json packageManager field)
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache pnpm store
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Node dependencies
        run: task deps:node

      - name: Show the cluster tooling
        run: |
          kind version
          kubectl version --client

      - name: Lower, apply to kind, and observe the graph
        run: task smoke:lowered-kind

      - name: The same from a Terraform plan nobody edited (draft, lower, apply, observe)
        # The step above starts from a hand-written cluster.toml. This one
        # starts from a rendered plan: `inspect --draft` writes cluster.toml,
        # and it is lowered as drafted. Same job, because the tooling is the
        # same and a second cluster is a minute and a half.
        run: task smoke:lowered-drafted

  # The same, for the Knative lowering and for edges between the two
  # placements a cluster can hold. Separate from lowered-kind on purpose:
  # installing Knative is minutes of setup with its own ways to fail, and the
  # kubernetes check should not be held up by them.
  lowered-knative:
    name: lowered-knative (apply lowered manifests to a cluster with Knative)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Enable corepack (provides pnpm via package.json packageManager field)
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache pnpm store
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Node dependencies
        run: task deps:node

      - name: Show the cluster tooling
        run: |
          kind version
          kubectl version --client

      - name: Install Knative, lower, apply, and observe the graph
        run: task smoke:lowered-knative

  # Full-stack end-to-end: real ley-line-open daemon + real mache + real
  # cloister, exercising cloister's dispatch layer against live upstreams.
  #
  # Distinct from the `verify` job's `smoke:leyline-stub`, which drives the wire
  # codec against a STUB companion. That stub speaks the wire contract but
  # enforces no auth and implements no upstream tool discovery, so it cannot
  # catch the class of break this job exists for: on 2026-07-28 `task smoke`
  # was failing 12 of 15 assertions with every dynamically-discovered tool
  # missing, and no CI job noticed because none ran it (cloister-aef43a).
  #
  # Blocking, through `ci-ok` below. The script tolerates a declared
  # KNOWN_FAILING list (empty today) and fails on anything outside it, or on a
  # listed assertion that starts passing, which forces the list to shrink
  # rather than calcify.
  smoke-e2e:
    name: smoke-e2e (real leyline + mache + cloister)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # leyline is NOT pinned here. Its version and digest are in
      # schema-bridge.lock.json with every other ley-line-open pin, so
      # `task llo:bump` moves it and `lint:upstream-pins` holds it to the same
      # release. A separate tag here once sat at v0.11.3 while the rest of the
      # repo moved to v0.30.0, and the full-stack check ran an engine nobody
      # used.
      #
      # mache is a BINARY release tag, apart from the server.json `version` in
      # cluster.toml ([inputs.mache]), which pins the tool CONTRACT. The digest
      # is the trust root, not the tag and not the release's own checksum file:
      # that file comes from the same place as the binary. Bump both together.
      #
      # HELD at v0.19.0 on purpose. v0.22.0 was tried (2026-11-19) and the
      # smoke's `mache_list_directory` failed: a newer mache no longer falls
      # back to a default project when the client cannot answer its
      # server-initiated `roots/list`, and cloister's proxy has no channel for
      # one. mache's own answer is a `?project=<token>` on the URL
      # (mache-6ec106). Until cloister forwards one or the other, a newer mache
      # behind cloister cannot resolve a workspace. Do not bump past this
      # without that; the smoke will say so.
      MACHE_RELEASE: v0.19.0
      MACHE_SHA256: 533e9a7b228ee92166706201b5fffc4fe7cb310f3dfef32100951d94be56ff3e

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Enable corepack (provides pnpm via package.json packageManager field)
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install capnp
        # `task manifest` (a dep of the wrangler dev the smoke starts) compiles
        # cloister.capnp at build time, per ADR-0004.
        run: sudo apt-get update && sudo apt-get install -y capnproto

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain (1.95.0 — pinned by rs/rust-toolchain.toml) + wasm32 target
        # The smoke starts `wrangler dev`, whose bundler resolves
        # src/wire/signet-verify.ts:48 -> rs/target/wasm32-unknown-unknown/
        # release/leyline_sign.wasm. Without the artifact the Worker never
        # builds, cloister never binds its port, and the run dies at "backends
        # did not become ready" with the real cause 30 lines down in clst.log.
        # Same pin + rationale as the lint job above.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + git
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rs/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Cache pnpm store
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Node dependencies
        run: task deps:node

      - name: Fetch the leyline-sign wasm artifact
        # Fetched explicitly rather than relied on as a transitive dep: wrangler
        # invokes esbuild directly, not Task, so nothing in the smoke path would
        # trigger it on its own. LLO's digest-pinned release asset, not a local
        # wasm32 build (cloister-dbe9c3).
        run: task llo:wasm

      - name: Fetch upstream binaries, each checked against a pinned digest
        # Both repos publish linux-amd64 release assets, so the smoke runs
        # against SHIPPED artifacts rather than a cross-repo source build, which
        # also means this job tests what an operator would actually install.
        # A digest that does not match fails the job before anything runs.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cp "$(node gen/fetch-schema-bridge.mjs leyline)" "$RUNNER_TEMP/bin/leyline"
          gh release download "$MACHE_RELEASE" \
            --repo agentic-research/mache \
            --pattern 'mache-linux-amd64' --output "$RUNNER_TEMP/bin/mache"
          echo "$MACHE_SHA256  $RUNNER_TEMP/bin/mache" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/leyline" "$RUNNER_TEMP/bin/mache"

      - name: Run the full-stack smoke
        # LEYLINE / MACHE / CLOISTER_DIR override the script's laptop defaults
        # (~/remotes/art/...), which do not exist on a runner.
        env:
          LEYLINE: ${{ runner.temp }}/bin/leyline
          MACHE: ${{ runner.temp }}/bin/mache
        run: CLOISTER_DIR="$GITHUB_WORKSPACE" task smoke

  # The one check to require. It needs every job in this file and passes only
  # if each one succeeded, or was skipped on purpose (`verify` on a docs-only
  # pull request). Branch protection lists check NAMES, so a job added here
  # later would otherwise be advisory until someone remembered to list it: this
  # job is the list. `lint/test/ci-gate.test.mjs` fails if a job is left out.
  #
  # `if: always()` matters. Without it a failed dependency SKIPS this job, and
  # a skipped required check counts as passing.
  ci-ok:
    name: ci-ok (every job passed)
    if: always()
    needs: [lint, install-image, changes, verify, lowered-kind, lowered-knative, smoke-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job succeeded, or was skipped on purpose
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Only `verify` has a condition, so only it may be skipped.
          bad="$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and (.key != "verify" or .value.result != "skipped")) | .key')"
          if [ -n "$bad" ]; then
            echo "not passed: $bad"
            exit 1
          fi
